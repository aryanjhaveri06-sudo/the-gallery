name: Match repeat sales

# Finds the same work sold more than once by comparing pictures (ingest/repeats.py).
# Separate from the nightly refresh because it needs Pillow, and the nightly is
# stdlib-only on purpose. Shares the refresh's concurrency group and database
# cache: it restores the newest DB, adds image signatures and chains, and saves
# it back under a fresh key, which the next nightly restores and builds from.
# It can run for two hours, so it is timed well clear of the nightly: two runs
# in one concurrency group means the later one cancels the earlier one's wait.
on:
  schedule:
    - cron: "30 6 * * 6"      # Saturday 12:00 IST — hours clear of the 02:00 refresh either side
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet Pillow

      - name: Restore database
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/artdesk.db
          key: artdesk-db-${{ github.run_id }}
          restore-keys: artdesk-db-

      - name: Match pictures across sales
        run: |
          [ -f data/artdesk.db ] || { echo "::error::no database in cache — run the refresh first"; exit 1; }
          cd ingest && python3 repeats.py --budget-minutes 240

      - name: Save database
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/artdesk.db
          key: artdesk-db-${{ github.run_id }}

      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "no TELEGRAM_BOT_TOKEN; not alerting"; exit 0; }
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=AG Newsroom: repeat-sale matching FAILED. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage"
