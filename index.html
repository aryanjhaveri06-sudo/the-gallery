<meta charset="utf-8">
<title>AG Newsroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AG Newsroom">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   TOKENS — AG Newsroom

   Every value below comes from the AG Newsroom handoff. The whole app reads
   these, so the palette IS the re-skin: change it here and each screen follows.

   The design is light-only. The desk is not — it has a theme toggle and she
   uses it — so the dark blocks derive the same relationships against a dark
   ground rather than being dropped. Light stays the default.
   ============================================================ */
:root{
  --paper:#FBF9F6;          /* background (paper) */
  --raised:#FFFFFF;         /* card fill; most cards are hairline-bordered paper */
  --surface:#EFEAE0;        /* outer app chrome */
  --ink:#1A1A1A;
  --muted:#6B686B;
  --gold:#B8860B;           /* accent */
  --gold-ink:#8A6A16;       /* accent-dark: link and label text on paper */
  --gold-tint:#F3EEE3;      /* tint fill for callouts */
  /* Above or below the published estimate. The desk is otherwise gold-only on
     purpose; direction against estimate is the one thing worth a second hue. */
  --up:#4B6B4E;
  --down:#9B3B2E;
  --rule:var(--ink);

  --ink-72:color-mix(in srgb, var(--ink) 78%, transparent);
  --ink-60:var(--muted);    /* the design has one muted, and this is it */
  --ink-50:color-mix(in srgb, var(--muted) 82%, transparent);
  --ink-40:color-mix(in srgb, var(--muted) 62%, transparent);
  --divider:#E3DDD1;        /* hairline borders — a fixed colour, not a mix */
  --divider-soft:color-mix(in srgb, var(--divider) 60%, transparent);

  --font-heading:"Playfair Display", "Iowan Old Style", Georgia, serif;
  --font-body:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --r-sm:2px; --r-md:6px; --r-lg:10px; --r-pill:20px;

  /* One easing curve and two durations for the whole app, so nothing moves at a
     speed nothing else moves at. Fast is for a control answering a touch; slow
     is for something arriving on screen. */
  --ease:cubic-bezier(.32,.72,0,1);
  --t-fast:.14s; --t-slow:.34s;
  --shadow-md:0 3px 10px color-mix(in srgb, var(--ink) 16%, transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb, var(--ink) 22%, transparent);

  --pad:26px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151412;
    --raised:#1e1d1a;
    --surface:#100f0e;
    --ink:#F2EEE7;
    --muted:#A19D97;
    --gold:#D3A43C;
    --gold-ink:#E2BC6B;
    --gold-tint:#2A2620;
    --up:#7FA983;
    --down:#D2705F;
    --rule:color-mix(in srgb, var(--ink) 66%, transparent);
    --divider:#332F29;
    --divider-soft:color-mix(in srgb, var(--divider) 70%, transparent);
    --shadow-md:0 3px 14px rgba(0,0,0,.5);
    --shadow-lg:0 14px 36px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#151412;
  --raised:#1e1d1a;
  --surface:#100f0e;
  --ink:#F2EEE7;
  --muted:#A19D97;
  --gold:#D3A43C;
  --gold-ink:#E2BC6B;
  --gold-tint:#2A2620;
  --up:#7FA983;
  --down:#D2705F;
  --rule:color-mix(in srgb, var(--ink) 66%, transparent);
  --divider:#332F29;
  --divider-soft:color-mix(in srgb, var(--divider) 70%, transparent);
  --shadow-md:0 3px 14px rgba(0,0,0,.5);
  --shadow-lg:0 14px 36px rgba(0,0,0,.6);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* Motion. Everything below is decoration on top of a layout that already works,
   so all of it comes off in one block for anyone who asks for less. */
@media (prefers-reduced-motion: no-preference){
  .main, .split .list, .split .detail, .ask-scroll{scroll-behavior:smooth}

  /* A screen arriving. Only when the screen actually CHANGED — re-rendering the
     same screen on every keystroke and fading it each time would be a strobe. */
  .wrap.enter{animation:screen-in var(--t-slow) var(--ease) both}
  @keyframes screen-in{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
  }

  /* A sale's summary unfolding. Height is not animatable from `auto`, so this
     moves the things inside it instead — same read, no measuring. */
  .ev-sum{animation:unfold var(--t-slow) var(--ease) both}
  @keyframes unfold{
    from{opacity:0;transform:translateY(-4px)}
    to{opacity:1;transform:none}
  }

  /* Chat turns land rather than blink into place. */
  .ask-q, .ask-a{animation:turn-in var(--t-slow) var(--ease) both}
  @keyframes turn-in{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
  }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:1ms !important;animation-iteration-count:1 !important;
    transition-duration:1ms !important;scroll-behavior:auto !important}
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:16.8px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
::selection{background:var(--gold-tint);color:var(--ink)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- typographic primitives ---- */
.kicker{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold-ink);font-family:var(--font-body);line-height:1.5;
}
.label{
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-50);
}
.serif{font-family:var(--font-heading);font-weight:700}
.muted{color:var(--ink-60)}
.rule-heavy{height:1px;background:var(--rule);border:0;margin:0}
.hr{height:1px;background:var(--divider);border:0;margin:0}

/* section heading used across every screen */
.sec{margin-top:36px}
.cols{margin-top:34px}
.view-body > .sec:first-child,
.view-body > .cols:first-child{margin-top:0}
.cols > .col.sec:first-child{margin-top:0}
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding-bottom:10px;margin-bottom:10px;
}
.sec-head h2{
  font-family:var(--font-body);font-weight:700;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;margin:0;line-height:1.4;color:var(--ink);
}
.sec-head .side{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-60);white-space:nowrap}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{padding:0 var(--pad) 48px}
.wrap.wide{max-width:none}
.main.ask-main, .main.split-main{overflow:hidden}
.wrap.split-wrap{height:100%;padding-bottom:0}
.wrap.ask-wrap{height:100%;padding:12px var(--pad) 0;display:flex;flex-direction:column;min-height:0}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding-top:var(--safe-t);
  border-bottom:1px solid var(--rule);
}
.topbar-in{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;
  gap:8px;padding:6px var(--pad) 7px;min-height:48px;
}
.wordmark{
  text-align:center;font-family:var(--font-heading);font-weight:700;
  font-size:15.8px;letter-spacing:.24em;text-transform:uppercase;line-height:1.2;
}
.wordmark small{
  display:block;font-size:8.9px;letter-spacing:.2em;color:var(--ink-50);
  margin-top:2px;font-family:var(--font-body);
}
.icon-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-60);border-radius:var(--r-md);transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);
}
.icon-btn:active{background:var(--gold-tint);color:var(--gold-ink)}
.icon-btn.back{justify-content:flex-start;color:var(--gold-ink)}
.topbar .double{height:3px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 var(--pad) -1px}

/* ---- view title ---- */
.view-head{padding:22px var(--pad) 0}
.view-head h1{
  font-family:var(--font-heading);font-weight:700;font-size:26px;line-height:1.15;
  margin:0;letter-spacing:-.005em;text-wrap:balance;
}
.view-head p{margin:4px 0 0;font-size:14px;line-height:1.5;color:var(--ink-60);max-width:52ch}
.view-head .date{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-60);margin-bottom:6px}
.view-body{padding-top:22px;container-type:inline-size;container-name:pane}

/* The handoff's three tiles under the greeting, and the brief beneath them.
   Both read entirely off the record — the counts are counted, and the brief
   names what is actually in front of her rather than narrating a mood. */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0 20px}
.tile{border:1px solid var(--divider);border-radius:var(--r-md);padding:12px 8px;text-align:center}
.tile .tv{font-family:var(--font-heading);font-weight:700;font-size:22px;line-height:1.1;color:var(--ink)}
.tile .tl{font-size:10px;color:var(--ink-60);margin-top:2px;line-height:1.3}
.brief{background:var(--gold-tint);border-left:2px solid var(--gold);padding:12px 14px;margin-bottom:22px}
.brief .bl{font-size:10px;letter-spacing:.1em;color:var(--gold-ink);font-weight:700;margin-bottom:6px}
.brief .bb{font-size:13px;color:var(--ink);line-height:1.5}

/* ---- bottom tab bar (phone) ---- */
.tabbar{
  display:flex;justify-content:space-around;align-items:center;
  background:var(--paper);border-top:1px solid var(--divider);
  padding:10px 0 calc(var(--safe-b) + 14px);flex-shrink:0;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:2px;min-height:44px;color:var(--ink-60);transition:color var(--t-fast) var(--ease);
}
/* Sans, 9px, barely tracked — the handoff sets section and nav labels in
   Source Sans, not the display serif. */
.tabbar button .tl{font-size:9px;letter-spacing:.03em;text-transform:uppercase;font-weight:600}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button:active{color:var(--ink)}

/* ---- Ask, one tap from anywhere ----
   The handoff floats it over every list and detail screen, and hides it on Ask
   itself. It is the "woven in" part: the assistant is never more than a tap
   away, and never in the way. */
.fab{
  position:fixed;right:18px;bottom:calc(82px + var(--safe-b));
  width:48px;height:48px;border-radius:50%;background:var(--gold);
  display:flex;align-items:center;justify-content:center;color:var(--paper);
  box-shadow:0 6px 16px -4px color-mix(in srgb, var(--gold) 50%, transparent);
  z-index:5;transition:transform var(--t-fast) var(--ease);
}
.fab:active{transform:scale(.94)}
.fab[hidden]{display:none}   /* [hidden] alone loses to the class above */

/* ---- side rail (iPad) ---- */
.rail{display:none}

/* ============================================================
   REUSABLE PIECES
   ============================================================ */
.chip{
  display:inline-block;padding:8px 13px;border-radius:var(--r-md);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  border:1px solid var(--divider);color:var(--ink-60);background:transparent;
  transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);
}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-tint)}
.chip:active{border-color:var(--gold)}
.chiprow{
  display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
  padding:14px var(--pad);margin:0 calc(var(--pad) * -1);
}
.chiprow::-webkit-scrollbar{display:none}

.house{
  font-family:var(--font-heading);font-weight:600;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
}
.house[data-h="AstaGuru"]{color:var(--gold-ink)}
.house[data-h="Fair"]{color:var(--gold-ink)}

.tag{
  display:inline-block;padding:4px 10px;border:1px solid var(--divider);border-radius:var(--r-md);
  font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-60);
}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}

/* row list — the workhorse */
.rows > *{border-top:1px solid var(--divider)}
.rows > *:first-child{border-top:1px solid var(--divider-soft)}
.row{display:block;width:100%;padding:19px 0;transition:background var(--t-fast) var(--ease)}
button.row:active{background:var(--gold-tint)}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row-name{font-family:var(--font-heading);font-weight:600;font-size:19.9px;line-height:1.24}
.row-sub{font-size:13.1px;color:var(--ink-60);margin-top:5px;line-height:1.55}
.row-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-50);white-space:nowrap}
.chev{color:var(--ink-40);flex-shrink:0;margin-top:2px}

/* pill for above/within estimate */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.6px;letter-spacing:.06em;
  color:var(--ink-60);white-space:nowrap;
}
.pill.up{color:var(--gold-ink)}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.85}

/* segmented control */
.seg{
  display:flex;border:1px solid var(--divider);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:6px;
}
.seg button{
  flex:1;text-align:center;padding:11px 6px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-family:var(--font-heading);font-weight:600;
  color:var(--ink-50);border-right:1px solid var(--divider);transition:all var(--t-fast) var(--ease);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold-tint);color:var(--gold-ink)}

/* accent box — the only one in the app, kept rare */
.accent-box{
  border:1px solid var(--gold);border-radius:var(--r-md);padding:14px 16px;
  background:var(--gold-tint);
}
.accent-box .when{font-family:var(--font-heading);font-weight:600;font-size:15.8px;color:var(--gold-ink);letter-spacing:.02em}
.accent-box .what{font-size:14.2px;margin-top:5px;line-height:1.55}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:9px 16px;border:1px solid var(--divider);border-radius:var(--r-md);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--font-heading);font-weight:600;color:var(--ink-72);transition:all var(--t-fast) var(--ease);
}
.btn:active{background:var(--gold-tint)}
.btn-primary{border-color:var(--gold);color:var(--gold-ink)}
.btn-block{width:100%}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ============================================================
   SCREEN: TODAY
   ============================================================ */
.diary{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:15px 0;align-items:start}
.diary .t{font-family:var(--font-heading);font-weight:600;font-size:17.9px;color:var(--gold-ink)}
.diary .ti{font-family:var(--font-heading);font-weight:600;font-size:19.4px;line-height:1.24}
.diary .wh{font-size:13.1px;color:var(--ink-60);margin-top:3px}
.diary .pr{font-size:13.1px;font-style:italic;color:var(--ink-72);margin-top:6px;line-height:1.5}

.fu{padding:16px 0}
.fu.done{opacity:.5}
.fu-name{
  font-family:var(--font-heading);font-weight:600;font-size:18.9px;
  text-decoration:underline;text-decoration-color:var(--divider);text-underline-offset:4px;
}
.fu-age{font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--ink-50)}
.fu-age.over{color:var(--gold-ink)}
.fu-why{font-size:13.7px;color:var(--ink-72);margin-top:6px;line-height:1.55}

/* Each headline is now an <a> out to the publisher, so the link defaults have
   to be undone — otherwise real news renders blue and underlined. */
.news{padding:23px 0;display:grid;grid-template-columns:1fr auto;gap:16px;
  align-items:start;color:inherit;text-decoration:none}
/* A press photo is a crop of a scene, not a work of art — cover is right here,
   unlike a lot thumbnail where cropping the painting would be the whole loss. */
.news .nimg{
  width:76px;aspect-ratio:1/1;object-fit:cover;display:block;
  background:var(--surface);border:1px solid var(--divider-soft);border-radius:var(--r-sm);
}
.filterbar{display:flex;flex-direction:column;gap:8px;padding:16px 0 4px;
  border-bottom:1px solid var(--divider-soft);margin-bottom:4px}
.fgroup{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fgroup::-webkit-scrollbar{display:none}
.fchip{font-size:11.6px;letter-spacing:.04em;padding:6px 13px;border-radius:999px;
  border:1px solid var(--divider);color:var(--ink-60);white-space:nowrap;flex:none;background:transparent}
.fchip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-tint)}

/* ---- Today, to the mockup (spec §3) ---- */
.hero{position:relative;padding-top:6px}
/* These three were anchors out to the publisher and are buttons into the
   article now. A button does not fill its parent the way a block anchor does. */
.hero-link{display:block;width:100%;color:inherit;text-decoration:none}
.hero-media{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.hero-media img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.rank{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:var(--r-sm);
  background:var(--gold);color:#fff;font-family:var(--font-heading);font-weight:600;
  font-size:13.1px;display:flex;align-items:center;justify-content:center}
.hero-tag{position:absolute;top:10px;right:10px;background:var(--ink);color:var(--paper);
  font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:5px 8px;border-radius:var(--r-sm)}
.hero-body{padding-top:14px}
.hero-head{font-family:var(--font-heading);font-weight:700;font-size:17px;line-height:1.25;
  margin:6px 0 0;text-wrap:pretty}
.hero-sum{margin:6px 0 0;font-size:12.5px;color:var(--ink-60);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-why{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.why-chip{font-size:10px;letter-spacing:.05em;padding:3px 9px;border-radius:999px;
  border:1px solid var(--divider);color:var(--ink-60)}
.why-chip.artist{border-color:var(--gold);color:var(--gold-ink)}
.why-chip.client{border-color:var(--up);color:var(--up)}

.mark{position:absolute;top:0;right:0;padding:8px;color:var(--ink-40);line-height:0}
.mark.on{color:var(--gold-ink)}
.mark.on svg{fill:currentColor}

.scrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.sc{display:block;width:100%;color:inherit;text-decoration:none}
.sc-media{position:relative;border-radius:var(--r-sm);overflow:hidden;background:var(--surface);
  aspect-ratio:4/3}
.sc-media img{width:100%;height:100%;object-fit:cover;display:block}
.sc-media .rank{width:20px;height:20px;font-size:11.6px;top:8px;left:8px}
.sc-media .hero-tag{font-size:8px;padding:3px 6px;top:8px;right:8px}
.sc-meta{display:flex;align-items:center;gap:8px}
.rank.flat{position:static;width:19px;height:19px;font-size:11px;flex:none}
.sc-body h4{font-family:var(--font-heading);font-weight:700;font-size:14px;line-height:1.25;
  margin:6px 0 0;text-wrap:pretty}

.pulserow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.pulse{border:1px solid var(--divider-soft);border-radius:var(--r-md);padding:12px 11px;
  background:var(--raised)}
.pulse .pi{color:var(--gold-ink);line-height:0;display:block;margin-bottom:8px}
.pulse .pv{font-family:var(--font-heading);font-weight:600;font-size:18.9px;line-height:1.05}
.pulse .pl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);margin-top:6px}
.pulse .ps{font-size:10.5px;color:var(--ink-50);margin-top:2px;line-height:1.3}

.wrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;
  border-bottom:1px solid var(--divider-soft);color:inherit}
.wrow .wn{flex:1;font-family:var(--font-heading);font-weight:600;font-size:16.8px}
.wrow .wr{display:block;font-family:var(--font-body);font-weight:400;font-size:11.6px;
  color:var(--ink-50);margin-top:3px}
.wrow .wspark{width:78px;height:26px;flex:none;line-height:0}
.wrow .wspark svg{width:100%;height:26px;display:block}

.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;
  border-bottom:1px solid var(--divider-soft);color:inherit}
.dayrow .di{color:var(--gold-ink);line-height:0}
.dayrow .dt{flex:1;font-size:14.2px}
.dayrow .dt b{font-family:var(--font-heading);font-weight:600;margin-right:3px}

.mf{position:relative;border-bottom:1px solid var(--divider-soft)}
.mf-link{display:block;width:100%;color:inherit;text-decoration:none}
.mf-link, .mf > .mf-body{display:grid;grid-template-columns:1fr 66px;gap:14px;
  align-items:start;padding:15px 34px 15px 0}
.mf-img{width:66px;aspect-ratio:1/1;object-fit:cover;border-radius:var(--r-sm);
  background:var(--surface)}
.mf-body h4{font-family:var(--font-heading);font-weight:700;font-size:14px;line-height:1.25;
  margin:5px 0 0;text-wrap:pretty}
.mf .mark{top:12px}

/* Empty states collapse to one line — §13 forbids reserved blank blocks. */
.oneline{font-size:13.1px;color:var(--ink-50);font-style:italic;padding:14px 0}

@media (max-width:560px){
  .pulserow{grid-template-columns:1fr 1fr}
  .hero-head{font-size:16px}
}

.news-tag{
  display:inline-block;font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold-ink);background:var(--gold-tint);
  border:1px solid var(--divider);padding:3px 7px;border-radius:var(--r-sm);
  margin-bottom:7px;
}
.news:hover h3{color:var(--gold-ink)}
.news h3{transition:color .15s ease}
.news .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.news h3{font-family:var(--font-heading);font-weight:600;font-size:21px;line-height:1.22;margin:6px 0 0;text-wrap:pretty}
.news p{margin:6px 0 0;font-size:13.7px;color:var(--ink-72);line-height:1.55;text-wrap:pretty}

/* closing lots — horizontal cards on phone */
.lots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:16px var(--pad) 4px;margin:0 calc(var(--pad) * -1)}
.lots::-webkit-scrollbar{display:none}
.lot{
  flex:0 0 232px;scroll-snap-align:start;border:1px solid var(--divider);border-radius:var(--r-md);
  padding:14px 15px;background:var(--raised);
}
.lot .n{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50)}
.lot .a{font-family:var(--font-heading);font-weight:600;font-size:19.9px;margin-top:4px;line-height:1.2}
.lot .s{font-size:12.6px;color:var(--ink-60);margin-top:4px}
.lot .e{font-family:var(--font-heading);font-weight:600;font-size:17.9px;margin-top:10px}
.lot .m{font-size:12.6px;color:var(--gold-ink);margin-top:4px;line-height:1.4}

/* ============================================================
   SCREEN: DOSSIER
   ============================================================ */
.dossier-head h1{font-family:var(--font-heading);font-weight:700;font-size:42px;line-height:1.02;margin:8px 0 0;letter-spacing:-.012em;text-wrap:balance}
.dossier-head .yrs{font-size:14.7px;font-style:italic;color:var(--ink-60);margin-top:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats .stat{border:1px solid var(--divider);border-radius:var(--r-md);
  padding:12px 10px;text-align:center;min-width:0}
.stats .stat .v{font-family:var(--font-heading);font-weight:700;font-size:17px;
  line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.stats .stat .k{font-size:9.5px;color:var(--ink-60);margin-top:3px;line-height:1.3}
.stats .stat.gold .v{color:var(--gold-ink)}
.stats .stat.quiet .v{font-size:12px;color:var(--ink-40);font-family:var(--font-body);font-weight:600}
@media (max-width:420px){ .stats{grid-template-columns:1fr 1fr} }


.chart{margin-top:22px}
.chart-cap{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50);margin-top:7px}
.chart svg{width:100%;display:block}

.bio{font-size:15.8px;line-height:1.75;text-align:justify;hyphens:auto;margin-top:20px;color:var(--ink-72)}
.bio.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more-link{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-family:var(--font-heading);font-weight:600}

.rec{padding:22px 0}
/* A record with a picture is two columns; one without keeps the full width
   rather than sitting beside an empty frame. */
.rec.has-pic{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:start}
.rec-body{min-width:0}
.rec-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rec-work{font-family:var(--font-heading);font-weight:600;font-style:italic;font-size:19.9px;line-height:1.25;margin-top:7px}
.rec-med{font-size:13.1px;color:var(--ink-60);margin-top:3px}
.rec-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:15px}
.rec-est{font-size:12.6px;color:var(--ink-50)}
.rec-price{font-family:var(--font-heading);font-weight:600;font-size:22.1px;text-align:right;line-height:1.1}
.rec-price.up{color:var(--gold-ink)}
.rp-path{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-top:12px;font-size:13px}
.rp-sale{white-space:nowrap}.rp-sale b{font-weight:600;margin-left:4px}
.rp-arrow{color:var(--ink-50)}
.rp-move{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--ink-60)}
.rp-move.up{color:var(--gold-ink)}
/* ---- alerts ---- */
.bell-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--divider);border-radius:var(--r-md);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);background:transparent;white-space:nowrap}
.bell-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-tint)}
.bell-btn svg{width:15px;height:15px}
.watch-sheet{margin-top:14px;padding:16px 18px 18px;background:var(--raised);border:1px solid var(--divider);border-radius:var(--r-md)}
.watch-sheet .wrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--divider)}
.watch-sheet .wrow:last-of-type{border-bottom:0}
.watch-sheet .wl{font-size:14px}.watch-sheet .wl small{display:block;font-size:12px;color:var(--ink-60);margin-top:2px}
.sw{width:40px;height:24px;border-radius:12px;background:var(--divider);position:relative;flex-shrink:0;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:left .15s}
.sw[aria-checked="true"]{background:var(--gold-ink)}.sw[aria-checked="true"]::after{left:19px}
.up-new{display:inline-block;padding:2px 7px;border-radius:10px;background:var(--gold-tint);color:var(--gold-ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.al-kind{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
/* ---- Value a work ---- */
.val-form{margin-top:4px}
.val-form .fld{margin-top:16px}
.val-form .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);margin-bottom:8px}
.val-form input[type=text],.val-form input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--divider);border-radius:var(--r-md);background:var(--raised);color:var(--ink);font-size:15px}
.val-size{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}
.val-size .x{color:var(--ink-50);text-align:center}
.val-size .unit{display:flex;gap:4px}
.val-head{margin-top:22px}
.val-range{font-family:var(--font-heading);font-weight:700;font-size:30px;line-height:1.1;color:var(--gold-ink)}
.val-sub{font-size:13.5px;color:var(--ink-60);margin-top:6px;line-height:1.5}
.native{font-size:11px;letter-spacing:.06em;color:var(--ink-60);text-align:right;margin-top:3px;white-space:nowrap}
.foot-note{font-size:12.1px;font-style:italic;color:var(--ink-50);margin-top:16px;line-height:1.5}

.talk{display:grid;grid-template-columns:16px 1fr;gap:12px;padding:13px 0;font-size:14.7px;line-height:1.62}
.talk .mk{color:var(--gold);font-family:var(--font-heading);font-size:17.9px;line-height:1.3}

/* ============================================================
   SCREEN: MARKET
   ============================================================ */
/* ---- lot card ------------------------------------------------------------
   The point of the desk is the picture. Every lot in the database carries one
   and all three houses serve them to our origin, so a result leads with the
   work and the numbers sit beside it. */
.lotcard{
  display:grid;grid-template-columns:80px 1fr;gap:16px;
  padding:18px 0;align-items:start;width:100%;text-align:left;
  /* The card is an <a> now, so the link defaults have to be undone or every
     line of it renders underlined. */
  font:inherit;color:inherit;text-decoration:none;
}
.lotcard:hover .lot-artist{color:var(--gold-ink)}
.lotcard .lot-artist{transition:color .12s ease}
.lotcard + .lotcard,
.lotwrap + .lotwrap, .lotwrap + .lotcard, .lotcard + .lotwrap{border-top:1px solid var(--divider-soft)}
.lotwrap .lotcard{border-top:0}
.lot-dossier{margin:0 0 16px 96px;font-size:10.5px}
/* contain, never cover: cropping a painting to fit a box defeats the point of
   showing it. Saffronart serves squares, AstaGuru tall scans; both fit. One
   rule for every thumbnail; only the box size differs. */
.thumb{
  object-fit:contain;display:block;flex:none;
  background:var(--surface);border:1px solid var(--divider-soft);
  border-radius:var(--r-sm);
}
.thumb.t-lot{width:80px;aspect-ratio:3/4}
.thumb.t-rec{width:96px;aspect-ratio:3/4}
.thumb.t-ares{width:46px;aspect-ratio:1/1}
.thumb.ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);
  padding:4px;line-height:1.3;
}
.lotcard .thumb.ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);
  padding:4px;line-height:1.3;
}
.lot-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lot-artist{font-family:var(--font-heading);font-weight:600;font-size:19.9px;line-height:1.18;margin-top:7px}
.lot-title{font-size:13.1px;font-style:italic;color:var(--ink-72);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lot-meta{font-size:11.6px;color:var(--ink-50);margin-top:3px}
/* Wrap as whole units. At 375px the content column is ~250px and
   "Est. ₹2.2–2.8 lakh" beside "₹1.4 lakh" does not fit — without nowrap the
   estimate broke mid-phrase and ran into the price. */
.lot-foot{display:flex;justify-content:space-between;align-items:flex-end;
  gap:2px 14px;margin-top:11px;flex-wrap:wrap}
.lot-est{font-size:12.1px;color:var(--ink-50);white-space:nowrap}
.lot-foot > div:last-child{margin-left:auto}
.lot-price{font-family:var(--font-heading);font-weight:600;font-size:21px;line-height:1;text-align:right;white-space:nowrap}
.lot-vs{font-size:11.6px;margin-top:4px;text-align:right;white-space:nowrap}
.lot-vs.above{color:var(--up)}
.lot-vs.below{color:var(--down)}

.res{padding:22px 0}
.res-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.res-artist{font-family:var(--font-heading);font-weight:600;font-size:22.1px;line-height:1.2;margin-top:8px}
.res-work{font-size:13.7px;font-style:italic;color:var(--ink-72);margin-top:3px}
.res-sale{font-size:12.6px;color:var(--ink-50);margin-top:3px}
.res-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:14px}
.res-price{font-family:var(--font-heading);font-weight:600;font-size:23.1px;line-height:1}

.trend{display:grid;grid-template-columns:26px 1fr auto;gap:16px;align-items:center;padding:19px 0;width:100%;text-align:left}
.trend .rk{font-family:var(--font-heading);font-weight:600;font-size:14.7px;color:var(--ink-40)}
.trend .nm{font-family:var(--font-heading);font-weight:600;font-size:18.9px;line-height:1.2}
.trend .mt{font-size:12.1px;color:var(--ink-50);margin-top:3px}
.trend .dl{font-family:var(--font-heading);font-weight:600;font-size:19.9px;text-align:right}
.trend .dl.hot{color:var(--gold-ink)}
.trend .av{font-size:11.6px;color:var(--ink-50);text-align:right;margin-top:2px;letter-spacing:.04em}

.fx-list .fxr{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0}
.fx-list .fxr .p{font-size:13.7px;letter-spacing:.06em}
.fx-list .fxr .r{font-family:var(--font-heading);font-weight:600;font-size:19.9px}
.fx-list .fxr .m{font-size:12.6px;margin-left:10px}
.fx-list .fxr .m.up{color:var(--gold-ink)}

/* ============================================================
   SCREEN: CLIENTS
   ============================================================ */
.cl-tier{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--ink-50)}
.cl-tier.principal{color:var(--gold-ink)}

.card-head{padding-bottom:18px;border-bottom:1px solid var(--rule)}
.card-head h1{font-family:var(--font-heading);font-weight:700;font-size:35.7px;line-height:1.06;margin:6px 0 0;text-wrap:balance}
.card-head .ti{font-size:13.7px;color:var(--ink-60);margin-top:7px}
.card-head .lv{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:16px}
.card-head .lv .amt{font-family:var(--font-heading);font-weight:600;font-size:27.3px}
.card-head .lv .cap{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-50);text-align:right;max-width:12ch;line-height:1.5}

.brief-p{font-size:14.7px;line-height:1.72;hyphens:auto;color:var(--ink-72);padding-top:14px}

.hold{padding:13px 0}
.hold .a{font-family:var(--font-heading);font-weight:600;font-size:17.9px}
.hold .w{font-size:13.1px;color:var(--ink-60);margin-top:2px}

.ref{padding:12px 0;font-size:14.2px;line-height:1.5}
.ref b{font-family:var(--font-heading);font-weight:600;color:var(--gold-ink);font-size:15.8px}
.ref span{color:var(--ink-60)}

.log{display:grid;grid-template-columns:72px 1fr;gap:15px;padding:15px 0}
.log .d{font-size:12.1px;color:var(--gold-ink);letter-spacing:.02em;line-height:1.5}
.log .ch{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50);margin-top:2px}
.log .nt{font-size:14.2px;line-height:1.58}

.tpl{padding:0}
.tpl-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;width:100%}
.tpl-hd .n{font-family:var(--font-heading);font-weight:600;font-size:17.9px;line-height:1.25}
.tpl-hd .ac{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);white-space:nowrap}
.tpl-body{
  background:var(--raised);border:1px solid var(--divider);border-radius:var(--r-md);
  padding:15px 16px;font-size:14.2px;line-height:1.72;white-space:pre-line;margin-bottom:16px;
}

/* ============================================================
   SCREEN: KNOWLEDGE
   ============================================================ */
.obj-q{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px 0;width:100%}
.obj-q .q{font-family:var(--font-heading);font-weight:600;font-size:19.9px;line-height:1.3}
.obj-q .mk{font-family:var(--font-heading);font-size:23.1px;color:var(--gold);line-height:1;flex-shrink:0;width:20px;text-align:right}
.obj-a{padding:0 0 18px 16px;border-left:1px solid var(--gold);margin-bottom:2px}
.obj-a p{margin:0;font-size:14.7px;line-height:1.72;text-align:justify;hyphens:auto;color:var(--ink-72)}
.obj-a .proof{margin-top:11px;font-size:12.6px;font-style:italic;color:var(--ink-50);text-align:left}

.pitch{border:1px solid var(--divider);border-radius:var(--r-md);background:var(--raised);padding:20px 18px;margin-top:16px}
.pitch h3{font-family:var(--font-heading);font-weight:600;font-size:25.2px;line-height:1.18;margin:8px 0 0;text-wrap:balance}
.pitch .bd{font-size:14.7px;line-height:1.78;white-space:pre-line;margin-top:14px;text-align:justify;hyphens:auto;color:var(--ink-72)}
.ai-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
/* Ask AG Newsroom — the handoff's chat screen.
   Full height, no bottom nav, a back chevron at the top. The thread scrolls;
   the composer is pinned. */
.ask-screen{display:flex;flex-direction:column;height:100%;min-height:0}
.ask-top{display:flex;align-items:center;gap:14px;padding:2px 0 10px;flex:none}
.ask-scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0;padding-bottom:8px}
.ask-scroll::-webkit-scrollbar{width:0}
.ask-intro{padding:10px 0 20px}
.ask-intro h2{font-family:var(--font-heading);font-weight:700;font-size:26px;
  line-height:1.15;margin:0 0 4px;color:var(--ink)}
.ask-intro .sub{font-size:13px;color:var(--ink-60);margin-bottom:22px}
.ask-intro p{font-size:12.5px;line-height:1.55;color:var(--ink-60);margin:0 0 12px;max-width:56ch}
/* Suggestions are bordered cards in the handoff, not pills. */
.ask-chips{display:flex;flex-direction:column;gap:8px}
.ask-chips button{border:1px solid var(--divider);border-radius:var(--r-md);
  padding:12px 14px;font-size:12.5px;color:var(--ink);line-height:1.4;
  text-align:left;width:100%;transition:border-color .12s,background .12s}
.ask-chips button:hover{border-color:var(--gold)}
.ask-chips button:active{background:var(--gold-tint)}

.ask-q{align-self:flex-end;background:var(--ink);color:var(--paper);
  border-radius:10px 10px 2px 10px;padding:10px 14px;font-size:13px;
  line-height:1.45;max-width:80%;white-space:pre-line;margin-bottom:10px}
.ask-a{margin-bottom:16px;max-width:88%}
.ask-body{background:var(--gold-tint);border-radius:2px 10px 10px 10px;
  padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.5;
  margin-bottom:6px;white-space:pre-line}
/* The handoff's source chips, carrying which records the answer drew on. */
.ask-src{display:flex;gap:6px;flex-wrap:wrap}
.ask-src span{font-size:10px;color:var(--gold-ink);border:1px solid var(--divider);
  border-radius:var(--r-pill);padding:3px 9px}
/* Citations. The marker in the prose stays small and quiet; the list beneath is
   where she actually clicks. */
.ask-cite{color:var(--gold-ink);text-decoration:none;font-size:11px;
  vertical-align:super;line-height:0;padding:0 1px}
.ask-cite:hover{text-decoration:underline}
.ask-refs{display:flex;flex-direction:column;gap:1px;margin:8px 0 6px}
.ask-refs a{display:grid;grid-template-columns:18px 1fr;gap:0 8px;padding:7px 0;
  color:inherit;text-decoration:none;border-top:1px solid var(--divider-soft)}
.ask-refs a:hover .rt{color:var(--gold-ink)}
.ask-refs .rn{font-size:10px;color:var(--gold-ink);padding-top:2px}
.ask-refs .rt{font-size:12px;line-height:1.4}
.ask-refs .rs{grid-column:2;font-size:10px;color:var(--ink-60);margin-top:2px;
  letter-spacing:.03em;text-transform:uppercase}
.ask-thinking .ask-body{color:var(--ink-60)}
.ask-warn{font-size:11px;line-height:1.5;color:var(--down);
  border:1px solid color-mix(in srgb, var(--down) 35%, transparent);
  border-radius:var(--r-md);padding:7px 10px;margin-bottom:6px}
.ask-err{font-size:12.5px;line-height:1.5;color:var(--down);padding:4px 0 12px}

.ask-form{display:flex;align-items:center;gap:8px;padding:12px 0 calc(22px + var(--safe-b));
  border-top:1px solid var(--divider);flex:none}
.ask-input{flex:1;border:1px solid var(--divider);border-radius:var(--r-pill);
  padding:10px 14px;font:inherit;font-size:13px;outline:none;color:var(--ink);
  background:var(--paper);resize:none;max-height:120px;line-height:1.45}
.ask-input:focus{border-color:var(--gold)}
.ask-send{width:34px;height:34px;border-radius:50%;background:var(--ink);
  color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.ask-send[disabled]{opacity:.4}
.ask-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.ask-foot .chip{font-size:10.5px;letter-spacing:.04em;text-transform:none;
  padding:5px 11px;border-radius:var(--r-pill)}
.ask-note{font-size:10.5px;line-height:1.45;color:var(--ink-60);flex:1;min-width:180px}
/* Artists list — avatar, name over years, momentum on the right. */
.arows > *{border-top:1px solid var(--divider-soft)}
.arow{display:grid;grid-template-columns:38px 1fr auto;gap:0 12px;align-items:center;
  width:100%;text-align:left;padding:12px 0;color:inherit;
  transition:background var(--t-fast) var(--ease)}
.arow:hover{background:var(--gold-tint)}
.arow.on{background:var(--gold-tint)}
.arow .av{width:38px;height:38px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-weight:700;font-size:13px;color:var(--ink-60)}
.arow .an{display:block;font-family:var(--font-heading);font-weight:700;font-size:15px;line-height:1.2}
.arow .ay{display:block;font-size:11px;color:var(--ink-60);margin-top:2px}
.arow .am{font-size:12.5px;font-weight:600;white-space:nowrap;text-align:right}
.arow .am.up{color:var(--up)}
.arow .am.down{color:var(--down)}
.arow .am.flat{color:var(--ink-60)}
.arow .am .none{font-size:10px;font-weight:400;color:var(--ink-40)}
/* Artist profile header, to the handoff. */
.prof{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;align-items:center}
.prof .pav{width:56px;height:56px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-weight:700;font-size:18px;color:var(--ink-60)}
.prof h1{margin:0}
.prof .py{display:block;font-size:12px;color:var(--ink-60);margin-top:3px}
.prof .pm{font-size:13px;font-weight:600;white-space:nowrap}
.prof .pm.up{color:var(--up)}
.prof .pm.down{color:var(--down)}
.ask-cta p{font-size:12.5px;line-height:1.55;color:var(--ink-60);margin:12px 0 14px;max-width:58ch}
.ask-form{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--divider);padding-top:18px}
.ask-input{flex:1;min-height:44px;max-height:180px;resize:none;font:inherit;font-size:15.1px;
  line-height:1.55;color:var(--ink);background:var(--raised);border:1px solid var(--divider);
  border-radius:var(--r-md);padding:11px 14px}
.ask-input:focus{outline:none;border-color:var(--gold)}
.ask-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ask-note{font-size:12.1px;line-height:1.5;color:var(--ink-60);flex:1;min-width:200px}
.ai-note{font-size:13.1px;line-height:1.55;margin-top:10px;color:var(--ink-60)}
.ai-bad{color:var(--warn,#8a3324)}
.pitch-lot{padding:14px 0}
.pitch-lot .a{font-family:var(--font-heading);font-weight:600;font-size:18.9px}
.pitch-lot .w{font-size:13.1px;font-style:italic;color:var(--ink-60);margin-top:3px}
.pitch-lot .why{font-size:13.1px;color:var(--gold-ink);margin-top:6px;line-height:1.5}
.pitch-lot .es{font-family:var(--font-heading);font-weight:600;font-size:17.9px;white-space:nowrap}

/* ============================================================
   SCREEN: CALENDAR
   ============================================================ */
.month{font-family:var(--font-heading);font-weight:600;font-size:13.7px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);padding:24px 0 8px;border-bottom:1px solid var(--divider)}

/* ---- month grid ------------------------------------------------------------
   A sale calendar she can actually plan around, rather than a list she has to
   read end to end. One house gets one colour, so a month reads at a glance. */
.cal-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:20px}
.cal-title{font-family:var(--font-heading);font-weight:600;font-size:27.3px;letter-spacing:.01em;margin:0;flex:1 1 auto}
.cal-nav{display:flex;gap:6px}
.cal-nav .chip{min-width:34px;justify-content:center;text-align:center}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:20px}
.cal-dow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-50);text-align:center;padding-bottom:7px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-cell{
  min-height:100px;border:1px solid var(--divider-soft);border-radius:var(--r-md);
  padding:6px 7px;background:var(--raised);text-align:left;overflow:hidden;
  font:inherit;color:inherit;display:block;width:100%;
}
.cal-cell.pad{background:transparent;border-color:transparent}
.cal-cell.has{cursor:pointer;border-color:var(--divider);transition:border-color .12s ease}
.cal-cell.has:hover{border-color:var(--gold)}
.cal-cell.sel{border-color:var(--gold);background:var(--gold-tint)}
.cal-cell .dn{font-family:var(--font-heading);font-weight:600;font-size:14.7px;font-variant-numeric:tabular-nums}
.cal-cell .hd{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:5px}
.cal-now{font-size:7.9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper);background:var(--gold-ink);padding:2px 5px;border-radius:999px}
.cal-cell.today .dn{color:var(--gold-ink)}
.cal-ev{display:flex;align-items:center;gap:5px;margin-bottom:3px;font-size:11px;
  line-height:1.25;overflow:hidden;white-space:nowrap}
.cal-ev .t{overflow:hidden;text-overflow:ellipsis;color:var(--ink-72)}
.cal-dot{width:6px;height:6px;border-radius:50%;flex:none}
.cal-more{font-size:10px;color:var(--ink-50);margin-top:2px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:11.6px;color:var(--ink-60);align-items:center}
.cal-legend .k{display:inline-flex;align-items:center;gap:6px}
.cal-day-detail{margin-top:22px;padding:18px;border:1px solid var(--divider);
  border-radius:var(--r-md);background:var(--raised)}

/* One colour per house. Unknown houses fall back to plain ink. */
.cal-dot.h-astaguru{background:var(--gold)}
.cal-dot.h-saffronart{background:#7a6096}
.cal-dot.h-pundoles{background:#4a7c6f}
.cal-dot.h-giftex{background:#b5544a}
.cal-dot.h-other{background:var(--ink-40)}

/* Seven columns means the cell width, not the viewport, decides what fits.
   At 1280 a cell is ~129px and a title reads in full; on an iPad in portrait it
   is ~55px, where a single ellipsed line said only "Inte...". Between those the
   title wraps to two short lines instead of being cut to nothing. */
@media (max-width:900px){
  .cal-now{display:none}
  .cal-cell.today .dn{
    background:var(--gold-ink);color:var(--paper);
    border-radius:999px;padding:1px 5px;margin-left:-2px;
  }
  .cal-ev{white-space:normal;align-items:flex-start}
  .cal-ev .t{
    font-size:9.5px;line-height:1.15;text-overflow:clip;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .cal-dot{margin-top:2px}
  .cal-cell{min-height:112px}
}
@media (max-width:560px){
  /* ~44px a cell: nothing readable fits, so dots only and tap for the detail. */
  .cal-cell{min-height:56px;padding:5px 4px}
  .cal-ev .t, .cal-more{display:none}
  .cal-ev{gap:3px;margin-bottom:2px;display:inline-flex}
  .cal-cell .hd{margin-bottom:3px}
  .cal-title{font-size:22.1px}
}
.ev{display:grid;grid-template-columns:1fr auto;gap:0 14px;padding:16px 0;align-items:start}
.ev-hit{grid-column:1;text-align:left;width:100%;color:inherit;display:block}
.ev .rs{grid-column:2;grid-row:1}
.ev .rs svg{transition:transform var(--t-slow) var(--ease);color:var(--ink-40)}
.ev.open .rs svg{transform:rotate(90deg);color:var(--gold-ink)}
.ev-sum{grid-column:1 / -1;overflow:hidden}
.ev-sum dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:14px 0 0;
  padding:14px 0 0;border-top:1px solid var(--divider-soft)}
.ev-sum dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-60);padding-top:3px}
.ev-sum dd{margin:0;font-size:13.1px;line-height:1.5}
.ev-sum .chip{margin-top:14px}
.ev-nocat{font-size:12px;color:var(--ink-60);font-style:italic;margin-top:12px}
.ev .day{font-family:var(--font-heading);font-weight:600;font-size:16.8px;margin-bottom:5px}
.ev .ti{font-family:var(--font-heading);font-weight:600;font-size:19.9px;line-height:1.22;margin-top:6px}
.ev .ci{font-size:13.1px;color:var(--ink-60);margin-top:3px}
.ev .nt{font-size:13.1px;color:var(--ink-72);margin-top:7px;line-height:1.5}
.ev .rs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ev .gs{font-size:11px;color:var(--ink-50);white-space:nowrap}

/* ============================================================
   MORE (phone hub)
   ============================================================ */
.hub .hrow{display:flex;align-items:center;gap:14px;padding:17px 0;width:100%}
.hub .hrow .ic{color:var(--gold);flex-shrink:0}
.hub .hrow .tx{flex:1}
.hub .hrow .tt{font-family:var(--font-heading);font-weight:600;font-size:18.9px}
.hub .hrow .sb{font-size:13.1px;color:var(--ink-60);margin-top:2px}

/* ---- form fields ---- */
input[data-nc], input[data-key], textarea[data-nc],
input[data-ed], textarea[data-ed]{
  width:100%;margin-top:9px;padding:12px 14px;
  font-family:var(--font-body);font-size:16.8px;   /* 16px stops iOS zooming on focus */
  color:var(--ink);background:var(--raised);
  border:1px solid var(--divider);border-radius:var(--r-md);
  -webkit-appearance:none;appearance:none;
}
input[data-nc]:focus, input[data-key]:focus, textarea[data-nc]:focus,
input[data-ed]:focus, textarea[data-ed]:focus{outline:none;border-color:var(--gold)}
textarea[data-nc], textarea[data-ed]{resize:vertical;line-height:1.6}
/* Safari renders a date input at its own intrinsic width and ignores width:100%
   unless the appearance is reset, which the rule above already does. */
input[data-ed][type=date]{min-height:46px}

/* ---- inline edit panels on the client card ---- */
.panel{
  margin-top:18px;padding:18px 18px 20px;
  background:var(--raised);border:1px solid var(--divider);border-radius:var(--r-md);
}
.panel .fld{margin-top:16px}
.panel .fld:first-of-type{margin-top:10px}
.panel .chiprow{padding:0;margin:10px 0 0}
.row-actions{margin-top:2px;gap:8px}
.row-actions .chip{font-size:10.5px;padding:5px 10px}
/* An armed delete looks different from an idle one, so the second tap is never
   a surprise. */
.chip.danger{border-color:var(--gold);color:var(--gold-ink)}

/* ---- theme toggle ---- */
.theme-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-60);border-radius:var(--r-md);
}
.theme-btn:active{background:var(--gold-tint);color:var(--gold-ink)}

/* ============================================================
   SEARCH SHEET
   ============================================================ */
.sheet-bg{
  position:fixed;inset:0;z-index:100;background:color-mix(in srgb, var(--ink) 40%, transparent);
  display:flex;flex-direction:column;
}
.sheet{
  background:var(--paper);flex:1;display:flex;flex-direction:column;
  padding-top:var(--safe-t);animation:rise .22s cubic-bezier(.32,.72,0,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-top{display:flex;align-items:center;gap:12px;padding:10px var(--pad);border-bottom:1px solid var(--rule)}
.sheet-top .g{color:var(--gold);flex-shrink:0}
.sheet-top input{
  flex:1;border:0;background:transparent;outline:none;font-family:var(--font-heading);
  font-weight:500;font-size:24.2px;padding:8px 0;letter-spacing:.005em;
}
.sheet-top input::placeholder{color:var(--ink-40);font-weight:400}
.sheet-top .cancel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-family:var(--font-heading);font-weight:600;padding:10px 0}
.sheet-body{flex:1;overflow-y:auto;padding:0 var(--pad) 40px}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px 0;width:100%;border-top:1px solid var(--divider)}
@media (min-width:520px){.sug{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px}}
.sug .n{font-family:var(--font-heading);font-weight:600;font-size:21px}
.sug .m{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-50);white-space:nowrap}
.sheet-hint{padding:22px 0 10px}
.empty{padding:30px 0;text-align:center;font-size:14.2px;color:var(--ink-50);font-style:italic}


/* ============================================================
   PASS 3 — NEWS, ARTICLE, SEARCH, MARKET TABS, CLIENT TABS
   ============================================================ */

/* The handoff's tab strip: an underlined row, not the segmented control. Used
   by News, Market and the client card, so the three read as one pattern. */
.seg-tabs{
  border:0;border-bottom:1px solid var(--divider);border-radius:0;
  gap:20px;overflow-x:auto;scrollbar-width:none;margin-bottom:0;
}
.seg-tabs::-webkit-scrollbar{display:none}
.seg-tabs button{
  flex:0 0 auto;text-align:left;padding:2px 0 10px;border-right:0;
  font-family:var(--font-body);font-weight:600;font-size:11.5px;letter-spacing:.08em;
  border-bottom:2px solid transparent;white-space:nowrap;
}
.seg-tabs button[aria-pressed="true"]{
  background:transparent;color:var(--ink);border-bottom-color:var(--gold);
}
.seg-tabs .tabn{
  font-size:10px;margin-left:6px;color:var(--ink-40);letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.seg-tabs button[aria-pressed="true"] .tabn{color:var(--gold-ink)}

/* ---- news card (handoff's feed row) ---- */
.scard{
  position:relative;display:grid;grid-template-columns:1fr 58px;gap:12px;
  align-items:start;border:1px solid var(--divider);border-radius:var(--r-md);
  padding:13px 34px 13px 14px;margin-bottom:10px;
}
.scard.noimg{grid-template-columns:1fr}
.scard-open{display:block;width:100%;text-align:left;color:inherit;min-width:0}
.scard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.scard-top .news-tag{margin-bottom:0}
.scard-top .kick{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-50)}
.scard-head{
  display:block;font-family:var(--font-heading);font-weight:700;font-size:15px;
  line-height:1.28;margin-top:6px;text-wrap:pretty;
}
.scard-open:hover .scard-head{color:var(--gold-ink)}
.scard-sum{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12.5px;color:var(--ink-60);line-height:1.45;margin-top:5px;
}
.scard .story-why{margin-top:9px}
.scard-img{
  width:58px;height:58px;object-fit:cover;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--divider-soft);
}
.scard .mark{top:6px;right:4px}

/* ---- article ---- */
.article-head .art-media{
  border-radius:var(--r-md);overflow:hidden;background:var(--surface);margin-bottom:16px;
}
/* A 16/9 hero is 620px tall in a 1100px column, which is a whole screen of
   press photograph before the headline. Cap it; the crop is a press photo, not
   a painting, so cover is the right fit here. */
.article-head .art-media img{
  width:100%;aspect-ratio:16/9;max-height:min(46vh,400px);object-fit:cover;display:block;
}
.article-head .art-kick{position:relative;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;padding-right:38px}
.hero-tag.static{position:static}
.article-head h1{
  font-family:var(--font-heading);font-weight:700;font-size:29px;line-height:1.14;
  margin:12px 0 0;letter-spacing:-.008em;text-wrap:balance;
}
.article-head .art-sum{margin:10px 0 0;font-size:14.7px;color:var(--ink-72);line-height:1.55}
.article-head .mark{position:absolute;top:-6px;right:0}

/* how a story scored — a rule, shown as a rule */
.sigs{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.sig{display:flex;align-items:flex-start;gap:9px;font-size:12.6px;color:var(--ink-72);line-height:1.4}
.sig .sd{width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px;
  border:1px solid var(--divider);background:transparent}
.sig.on{color:var(--ink)}
.sig.on .sd{background:var(--gold);border-color:var(--gold)}
.sig.off{color:var(--ink-40)}

/* a result line — article, market overview, search */
.ares{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--divider-soft);color:inherit;text-decoration:none;
}
.ares-b{min-width:0}
.ares-t{font-size:13.5px;line-height:1.35;text-wrap:pretty}
.ares-m{font-size:11px;color:var(--ink-50);margin-top:3px}
.ares-p{font-family:var(--font-heading);font-weight:600;font-size:14.5px;white-space:nowrap}
.ares-p.up{color:var(--up)}
.ares-p.down{color:var(--down)}
a.ares:hover .ares-t{color:var(--gold-ink)}

/* ---- market ---- */
.tiles.three .tile .of{font-size:12.5px;color:var(--ink-40);font-weight:400;font-family:var(--font-body)}
.mrow{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 0;border-bottom:1px solid var(--divider-soft);color:inherit;
}
.mrow .rk{font-family:var(--font-heading);font-weight:600;font-size:12.5px;color:var(--ink-40);flex:none}
.mrow .mb{flex:1;min-width:0}
.mrow .mn{display:block;font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1.25}
.mrow .mm{display:block;font-size:11px;color:var(--ink-50);margin-top:3px}
.mrow .md{font-family:var(--font-heading);font-weight:600;font-size:14.5px;white-space:nowrap}
.mrow .md.up{color:var(--up)}
.mrow .md.down{color:var(--down)}
.mrow .md.flat{color:var(--ink-50)}

.auc{
  display:block;border:1px solid var(--divider);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:10px;color:inherit;text-decoration:none;
}
.auc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:7px;flex-wrap:wrap}
.auc-status{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.auc-status.open{color:var(--gold-ink)}
.auc-status.closed{color:var(--ink-40)}
.auc-name{font-family:var(--font-heading);font-weight:700;font-size:16px;line-height:1.25;text-wrap:pretty}
.auc-meta{font-size:11.5px;color:var(--ink-60);margin-top:4px}
.auc-link{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-top:9px}
a.auc:hover .auc-name{color:var(--gold-ink)}

/* ---- clients ---- */
.curow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--divider-soft);color:inherit;
}
.cav,.ch-av{
  width:36px;height:36px;border-radius:50%;background:var(--gold-tint);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--gold-ink);
  font-family:var(--font-body);font-weight:700;font-size:11.5px;letter-spacing:.04em;
}
.curow .cub{flex:1;min-width:0}
.curow .cun{display:block;font-family:var(--font-heading);font-weight:600;font-size:15.5px}
.curow .cui{display:block;font-size:11.5px;color:var(--ink-50);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.curow .cud{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-50);
  white-space:nowrap;flex:none}
.curow .cud.over{color:var(--down)}
.logbtn{width:100%;text-align:left;color:inherit;border-bottom:1px solid var(--divider-soft)}
.logbtn .nt .row-sub{margin-top:5px}
/* A logged note is free text she typed, and a pasted URL is one unbroken token
   no wrapper can split. Let it break rather than push the column open. */
.log .nt, .curow .cui, .row-name, .ares-t, .auc-name{overflow-wrap:anywhere}

.ch-id{display:flex;align-items:center;gap:14px}
.ch-av{width:52px;height:52px;font-family:var(--font-heading);font-size:16px}

   ============================================================ */

/* ---- pane-level: these follow the width of the column they sit in,
   not the width of the device, so a split pane never over-columnises ---- */
@container pane (min-width:460px){
  .stat:last-child{grid-column:auto}
}
@container pane (min-width:640px){ .stats{grid-template-columns:repeat(6,1fr)} }

@container pane (min-width:520px){
  .bio.clamped{-webkit-line-clamp:unset;display:block;overflow:visible}
  .more-link{display:none}

  .lots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;overflow:visible;margin:16px 0 0;padding:0}

}
@container pane (min-width:700px){

@container pane (min-width:600px){
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 42px;align-items:start}
  .two > .col{min-width:0}
  .two > .col.sec{margin-top:0}
}
@container pane (min-width:860px){
  .three{display:grid;grid-template-columns:1.05fr 1fr 1.1fr;gap:0 34px;align-items:start}
  .three > .col{min-width:0}
  .three > .col.sec{margin-top:0}
  .lots{grid-template-columns:repeat(4,1fr)}
}

/* iPad landscape — wide enough for a genuine list-and-detail split */
@media (min-width:1024px){
  .wrap{max-width:1180px;margin-inline:auto}
  /* Two columns, two scrollbars. The list used to be position:sticky against a
     page that scrolled as one, so reading down a dossier dragged the artist list
     off the top with it and getting back to it meant scrolling the whole page
     up again. Each column now owns its own overflow and keeps its own place. */
  .split{display:grid;grid-template-columns:308px 1fr;align-items:stretch;height:100%;min-height:0}
  .split .list{border-right:1px solid var(--divider);padding-right:24px;
    overflow-y:auto;min-height:0;padding-bottom:40px;overscroll-behavior:contain}
  .split .detail{padding-left:30px;min-width:0;
    overflow-y:auto;min-height:0;padding-bottom:56px;overscroll-behavior:contain}
  /* Thin, and only while the column is in use — two permanent scrollbars either
     side of a reading column is noise. */
  .split .list, .split .detail{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .split .list:hover, .split .detail:hover{scrollbar-color:var(--divider) transparent}
  .split .list::-webkit-scrollbar, .split .detail::-webkit-scrollbar{width:8px}
  .split .list::-webkit-scrollbar-thumb, .split .detail::-webkit-scrollbar-thumb{
    background:transparent;border-radius:4px;border:2px solid transparent;background-clip:content-box}
  .split .list:hover::-webkit-scrollbar-thumb, .split .detail:hover::-webkit-scrollbar-thumb{
    background:var(--divider);background-clip:content-box}
  .market-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:0 38px;align-items:start}
  .market-grid .rail-col{border-left:1px solid var(--divider);padding-left:34px;min-width:0}
  .market-grid .main-col{min-width:0}
}

/* Desktop monitors. The column used to stop at 1180px hard against the sidebar
   and leave the rest of a 1920 screen blank, so it steps up instead — and once
   there is real width, the lead block becomes a newsroom grid rather than one
   enormous picture. A 16/10 hero at 1480px wide is 925px tall: a wall, not a
   lead. Beside its secondaries it is a lead again. */
@media (min-width:1440px){
  .wrap{max-width:1360px}
}
@media (min-width:1700px){
  .wrap{max-width:1560px}
}
@media (min-width:1360px){
  .topblock{display:grid;grid-template-columns:1.62fr 1fr;gap:0 30px;align-items:start}
  .topblock > .hero{min-width:0;padding-top:0}
  .topblock > .scrow{grid-template-columns:1fr;gap:22px;margin-top:0;min-width:0}
  .topblock .hero-media img{aspect-ratio:16/9}
  /* A fixed height rather than a ratio: the side column has to come out level
     with the hero, and two ratio-driven cards in a 550px column always ran
     taller. object-fit still keeps the picture uncropped in the frame. */
  .topblock .sc-media{aspect-ratio:auto;height:196px}
  .topblock .sc-media img{height:100%}
  .topblock .hero-head{font-size:23px}
}

/* The auction feed supplies figures; it cannot supply prose. These are the
   artists we have written a dossier for — everyone else shows figures only. */
const NARRATIVE_FOR = {
  "v s gaitonde": "gaitonde", "s h raza": "raza", "f n souza": "souza",
  "m f husain": "husain", "amrita sher-gil": "sher_gil",
  "bhupen khakhar": "khakhar", "tyeb mehta": "mehta", "subodh gupta": "subodh"
};

const listOf = xs => xs.length < 2 ? (xs[0] || "")
  : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

const todayLong = () => new Date().toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "long", year: "numeric" });

const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d} ${MON3[+m - 1]} ${y.slice(2)}`;
};
// Lakh keeps a decimal under 10, matching ingest/export_app.py. Rounding to
// whole lakh made 1.1, 1.3 and 1.9 lakh all read as "1 lakh" or "2 lakh".
/* Mirrors inr() in ingest/export_app.py — the two MUST agree, because the same
   rupee figure is rendered here on a client card and there in the feed.

   Rounding is done on the integer rupee value, not with toFixed on the divided
   float: (1.035).toFixed(2) is "1.03", because 1.035 is really 1.0349999… in
   binary. That made ₹1,03,50,000 read as ₹1.03 cr in the browser and ₹1.04 cr
   from the pipeline. Math.round on an integer quotient is exact and half-up,
   which is what the Decimal ROUND_HALF_UP on the Python side does. */
const inrShort = n => {
  if (!n) return "\u2014";
  if (n >= 1e7 || Math.round(n / 1e5) >= 100) {
    return n / 1e7 < 10
      ? `\u20b9${(Math.round(n / 1e5) / 100).toFixed(2)} cr`
      : `\u20b9${(Math.round(n / 1e6) / 10).toFixed(1)} cr`;
  }
  if (n >= 1e5) {
    return n / 1e5 < 10
      ? `\u20b9${(Math.round(n / 1e4) / 10).toFixed(1)} lakh`
      : `\u20b9${Math.round(n / 1e5)} lakh`;
  }
  return `\u20b9${n.toLocaleString("en-IN")}`;
};

const pctLabel = v => v == null ? null : (v >= 0 ? "+" : "") + v.toFixed(0) + "%";

/* ---- market news --------------------------------------------------------
   Real headlines from ingest/news.py, every one linking back to the publisher
   that wrote it. Two tiers: what Google News returns for Indian-art queries,
   and the international trade press. They are kept visibly apart because an
   international story is not a story about her category, and the four headlines
   this replaced were invented — one of them quoting a sell-through figure the
   data rules say cannot be derived at all.
   ------------------------------------------------------------------------ */
/* One word for what kind of story it is, read off the headline. Ordered most
   specific first, because "gallery opens at the museum" is a gallery story.
   No match means no chip — better silent than mislabelled. */
const NEWS_TAGS = [
  ["Auction",     /\b(auction|auctioned|sold|sells|fetches|hammer|bidding)\b|saffronart|astaguru|pundole|sotheby|christie|bonhams/i],
  ["Market",      /\b(market|prices|record|crore|lakh|index|report|collectors)\b/i],
  ["Gallery",     /\b(gallery|galleries|showroom)\b/i],
  ["Institution", /\b(museum|biennale|biennial|foundation|ministry|academy|festival)\b/i],
  ["Exhibition",  /\b(exhibition|exhibit|showcase|retrospective)\b/i],
  ["Artist",      /\b(artist|artists|painter|sculptor)\b/i],
];
/* ---- story ranking (spec §3.4) --------------------------------------------

   Scored IN THE BROWSER, deliberately. Two of the six signals depend on her
   client book, and that lives behind the desk key in D1 — scoring server-side
   would mean shipping client interests to a shared endpoint to rank public news.
   The spec's own §14 says send the minimum client context anywhere; here the
   answer is none at all.

   Weights follow the spec. Every point scored records WHY, because "why does
   this matter" has to be traceable to a stored record — not prose a model wrote.
   No LLM is involved and none is implied. */
const AUTHORITATIVE = [
  "the hindu", "the indian express", "indian express", "economic times",
  "hindustan times", "the art newspaper", "artnews", "artforum", "artnet",
  "bloomberg", "reuters", "mint", "livemint", "business standard", "the print",
  "financial express", "times of india", "the tribune", "scroll",
];
const MARKET_SIGNIFICANCE = [
  "auction", "auctions", "sold", "sells", "fetches", "record", "hammer",
  "estimate", "crore", "lakh", "consignment", "sale", "collection",
  "saffronart", "astaguru", "pundole", "sotheby", "christie", "bonhams",
];

/* Surnames that are ordinary words or too common to identify anyone. */
const SURNAME_STOP = new Set(["roy", "das", "sen", "bose", "khan", "singh",
  "kumar", "shaw", "gupta", "iyer", "menon", "rao", "dey", "jain", "shah"]);

function artistsInText(hay) {
  /* The curated set only — matching all 1,300 raw names fired on the word
     "Artist" itself. Headlines write the same painter as "S H Raza",
     "S.H. Raza" and "Sayed Haider Raza", so compare with punctuation stripped
     and fall back to the surname. FOUR characters, not five: Raza is four, and
     excluding him excluded the single most quoted name in this market. The
     stoplist carries the ones that would match anything. */
  const flat = hay.replace(/[.\u2019']/g, "").replace(/\s+/g, " ");
  const out = [];
  for (const k of artistKeys) {
    const a = ARTISTS[k];
    if (!a || !a.name) continue;
    const name = a.name.toLowerCase().replace(/[.\u2019']/g, "");
    const surname = name.split(" ").pop();
    if (flat.includes(name)) { out.push(k); continue; }
    if (surname.length >= 4 && !SURNAME_STOP.has(surname) &&
        new RegExp("(?<!\\w)" + surname + "(?!\\w)").test(flat)) out.push(k);
  }
  return out;
}

/* Does a collector's stated interest actually appear in this story?
   Word boundaries matter more than they look: "Bengal" is a substring of
   "Bengaluru", so the loose test promoted a wrestling exhibition in Bengaluru
   over a Jamini Roy sale for a Bengal School collector. */
function wantsMatchStory(client, hay, artistHits) {
  const wants = [(client.focus || ""), ...(client.wants || [])].join(" ").toLowerCase();
  if (!wants.trim()) return false;
  if (artistHits.some(k => wants.includes(ARTISTS[k].name.toLowerCase().split(" ").pop()))) return true;
  return wants.split(/[^a-z]+/).some(w =>
    w.length > 4 && new RegExp("(?<!\\w)" + w + "(?!\\w)").test(hay));
}

function scoreStory(n) {
  const hay = ((n.headline || "") + " " + (n.why || "")).toLowerCase();
  const src = (n.source || "").toLowerCase();
  let score = 0;
  const reasons = [];

  // recency 20 — linear decay over a fortnight
  const days = Math.max(0, (Date.now() - Date.parse(n.date + "T00:00:00")) / 86400000);
  score += 20 * Math.max(0, 1 - days / 14);

  // Indian / South Asian relevance 20
  if (INDIA_WORDS.some(t => hay.includes(t))) { score += 20; }

  // auction / market significance 20
  const mk = MARKET_SIGNIFICANCE.filter(t => hay.includes(t));
  if (mk.length) { score += 20; reasons.push({ kind: "market", label: "Market activity" }); }

  // watchlist artist match 15
  const hits = artistsInText(hay);
  if (hits.length) {
    score += 15;
    reasons.push({ kind: "artist", label: ARTISTS[hits[0]].name + " on the desk", key: hits[0] });
  }

  // client relevance 15 — only when the book is actually open
  if (CRM.live && CRM.clients) {
    const matched = CRM.clients.filter(c => wantsMatchStory(c, hay, hits));
    if (matched.length) {
      score += 15;
      reasons.push({ kind: "client",
        label: matched.length + (matched.length === 1 ? " client" : " clients") + " in the book" });
    }
  }

  // source authority 10
  const authoritative = AUTHORITATIVE.some(t => src.includes(t));
  if (authoritative) score += 10;

  /* The chips are what the desk shows on a card, and they only cover the
     signals worth a chip. The article screen shows the whole scoring, because
     "why is this at the top" should be answerable, and answerable from the
     rule rather than from prose somebody wrote. */
  const signals = [
    { label: "Published " + (days < 1 ? "today" : Math.round(days) + (days < 2 ? " day" : " days") + " ago"),
      on: days <= 14 },
    { label: "Names India or an Indian city", on: INDIA_WORDS.some(t => hay.includes(t)) },
    { label: mk.length ? "Auction language: " + mk.slice(0, 4).join(", ") : "No auction language",
      on: !!mk.length },
    { label: hits.length ? listOf(hits.slice(0, 3).map(k => ARTISTS[k].name)) + " on the desk"
                         : "No artist you track is named", on: !!hits.length },
    { label: authoritative ? n.source + " is a desk source" : (n.source || "Source not on the desk list"),
      on: authoritative },
  ];

  return { score: Math.round(score), reasons, artists: hits, signals };
}

const INDIA_WORDS = ["india", "indian", "mumbai", "delhi", "kolkata", "chennai",
  "bengaluru", "hyderabad", "bengal", "south asian", "saffronart", "astaguru",
  "pundole", "kochi", "jaipur"];

/* Ranked once per render, cached on the object so the Today hero and the feed
   agree about what matters. */
/* rankedStories() was here. allStories() replaced it: the same ranking, but
   scored once per feed rather than once per render, carrying a stable key so a
   card can open the story it belongs to, and covering the wider pool too. */

const newsTag = n => {
  const hay = (n.headline || "") + " " + (n.why || "");
  const hit = NEWS_TAGS.find(([, rx]) => rx.test(hay));
  return hit ? hit[0] : null;
};

/* newsRow / newsBlock / onMarketCount lived here until the news desk got its own
   screen. Nothing had rendered them since Today became picture-led — they were
   still being built on every paint and thrown away. storyCard() is the one news
   row now, and every screen that shows a headline uses it. */

/* Both news pools as one scored list. Today's hero, the News screen, Search and
   the article all read this, so they cannot disagree about what a story is or
   why it ranked. Scoring walks 48 artists per headline, so it is cached until
   the feed or the book changes under it \u2014 loadNews() and loadCRM() both land
   mid-session. */
let _stories = null, _storiesOn = null;
function allStories() {
  const d = REAL.news || {};
  /* The tracked set belongs in the stamp. A story carries the artist keys it
     matched, and loadLiveData() can swap REAL under a running session — cache
     across that and the keys point at artists that are no longer there. */
  const stamp = [d.generated_at, (d.on_market || []).length, (d.wider || []).length,
                 artistKeys.length, artistKeys[0],
                 CRM.live ? (CRM.clients || []).length : -1].join("|");
  if (_stories && _storiesOn === stamp) return _stories;
  const mk = (rows, scope) => (rows || []).filter(n => n && n.headline)
    .map(n => ({ ...n, scope, key: storyKey(n), ...scoreStory(n) }));
  _stories = [...mk(d.on_market, "India"), ...mk(d.wider, "Wider")];
  _storiesOn = stamp;
  return _stories;
}
const storyByKey = k => allStories().find(x => x.key === k) || null;
const byDateDesc = (a, b) => String(b.date).localeCompare(String(a.date));

/* The bookmark toggle. It was a closure inside viewToday, which meant only

const markBtn = n => `<button class="mark ${isMarked(n) ? "on" : ""}" data-mark="${esc(markKey(n))}"

let ARTISTS = buildArtists();

let FX = [];

/* Recompute everything derived from REAL. Called once at boot, and again if the
   live fetch replaces the embedded dataset. */
function rebuildFromReal() {
  // One gate for the whole app. The embedded copy ships inside the page (and
  // inside a published Artifact), so it can be older than the schema the code
  // expects, and a half-failed ingest can drop a key outright. Filling the
  // shape once here beats defending forty read sites: a missing `coverage` used
  // to white-screen Market, Calendar, More, the dossier and the search sheet,
  // and a missing `generated_at` took out More on its own.
  REAL.coverage = REAL.coverage || {};
  REAL.coverage.houses = REAL.coverage.houses || [];
  REAL.coverage.lots = REAL.coverage.lots || 0;
  REAL.coverage.from = REAL.coverage.from || "";
  REAL.coverage.to = REAL.coverage.to || "";
  REAL.caveats = REAL.caveats || {};
  REAL.artists = REAL.artists || {};
  REAL.feed = REAL.feed || [];
  REAL.trending = REAL.trending || [];
  REAL.recent_sales = REAL.recent_sales || [];
  REAL.events = REAL.events || [];
  REAL.news = REAL.news || { on_market: [], wider: [] };
  REAL.generated_at = REAL.generated_at || "";

  ARTISTS = buildArtists();
  artistKeys = Object.keys(ARTISTS);
  _byName = {};
  artistKeys.forEach(k => { _byName[normName(ARTISTS[k].name)] = k; });
  FX = ((REAL.fx && REAL.fx.pairs) || []).map(p => ({
    pair: p.pair, rate: Number(p.rate).toFixed(2)
  }));
  FX_AS_OF = REAL.fx ? REAL.fx.as_of : null;
  if (!ARTISTS[S.artist]) S.artist = artistKeys[0];
}
