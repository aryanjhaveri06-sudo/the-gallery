<meta charset="utf-8">
<title>The Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Gallery">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
/* ============================================================
   TOKENS — Classical design system, adapted for touch
   ============================================================ */
:root{
  --paper:#f7f5f0;
  --raised:#fffdf9;
  --surface:#efece4;
  --ink:#1c1b19;
  --gold:#b68235;
  --gold-ink:#7d5411;
  --gold-tint:#fff3e4;
  /* Above or below the published estimate. The desk is otherwise gold-only on
     purpose; direction against estimate is the one thing worth a second hue,
     and these are muted to sit inside the palette rather than shout. */
  --up:#2f7d5b;
  --down:#b3453a;
  --rule:var(--ink);

  --ink-72:color-mix(in srgb, var(--ink) 72%, transparent);
  --ink-60:color-mix(in srgb, var(--ink) 60%, transparent);
  --ink-50:color-mix(in srgb, var(--ink) 50%, transparent);
  --ink-40:color-mix(in srgb, var(--ink) 40%, transparent);
  --divider:color-mix(in srgb, var(--ink) 16%, transparent);
  --divider-soft:color-mix(in srgb, var(--ink) 9%, transparent);

  --font-heading:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body:"Lora", "Iowan Old Style", Georgia, serif;

  --r-sm:2px; --r-md:4px; --r-lg:7px;
  --shadow-md:0 3px 10px color-mix(in srgb, var(--ink) 16%, transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb, var(--ink) 22%, transparent);

  --pad:26px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171614;
    --raised:#1f1e1b;
    --surface:#252320;
    --ink:#ece7de;
    --gold:#c99a4e;
    --gold-ink:#dcb175;
    --gold-tint:color-mix(in srgb, #c99a4e 15%, transparent);
    --up:#5fb98d;
    --down:#e07a6d;
    --rule:color-mix(in srgb, var(--ink) 66%, transparent);
    --divider:color-mix(in srgb, var(--ink) 18%, transparent);
    --divider-soft:color-mix(in srgb, var(--ink) 10%, transparent);
    --shadow-md:0 3px 14px rgba(0,0,0,.5);
    --shadow-lg:0 14px 36px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#171614;
  --raised:#1f1e1b;
  --surface:#252320;
  --ink:#ece7de;
  --gold:#c99a4e;
  --gold-ink:#dcb175;
  --gold-tint:color-mix(in srgb, #c99a4e 15%, transparent);
  --up:#5fb98d;
  --down:#e07a6d;
  --rule:color-mix(in srgb, var(--ink) 66%, transparent);
  --divider:color-mix(in srgb, var(--ink) 18%, transparent);
  --divider-soft:color-mix(in srgb, var(--ink) 10%, transparent);
  --shadow-md:0 3px 14px rgba(0,0,0,.5);
  --shadow-lg:0 14px 36px rgba(0,0,0,.6);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:16.8px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
::selection{background:var(--gold-tint);color:var(--ink)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- typographic primitives ---- */
.kicker{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold-ink);font-family:var(--font-body);line-height:1.5;
}
.label{
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-50);
}
.serif{font-family:var(--font-heading);font-weight:400}
.muted{color:var(--ink-60)}
.rule-heavy{height:1px;background:var(--rule);border:0;margin:0}
.hr{height:1px;background:var(--divider);border:0;margin:0}

/* section heading used across every screen */
.sec{margin-top:50px}
.cols{margin-top:48px}
.view-body > .sec:first-child,
.view-body > .cols:first-child{margin-top:0}
.cols > .col.sec:first-child{margin-top:0}
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:6px;
}
.sec-head h2{
  font-family:var(--font-heading);font-weight:500;font-size:13.7px;
  letter-spacing:.19em;text-transform:uppercase;margin:0;line-height:1.4;
}
.sec-head .side{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-50);white-space:nowrap}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{padding:0 var(--pad) 48px}
.wrap.wide{max-width:none}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding-top:var(--safe-t);
  border-bottom:1px solid var(--rule);
}
.topbar-in{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;
  gap:8px;padding:6px var(--pad) 7px;min-height:48px;
}
.wordmark{
  text-align:center;font-family:var(--font-heading);font-weight:400;
  font-size:15.8px;letter-spacing:.24em;text-transform:uppercase;line-height:1.2;
}
.wordmark small{
  display:block;font-size:8.9px;letter-spacing:.2em;color:var(--ink-50);
  margin-top:2px;font-family:var(--font-body);
}
.icon-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-60);border-radius:var(--r-md);transition:color .12s,background .12s;
}
.icon-btn:active{background:var(--gold-tint);color:var(--gold-ink)}
.icon-btn.back{justify-content:flex-start;color:var(--gold-ink)}
.topbar .double{height:3px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 var(--pad) -1px}

/* ---- view title ---- */
.view-head{padding:30px var(--pad) 0}
.view-head h1{
  font-family:var(--font-heading);font-weight:400;font-size:35.7px;line-height:1.08;
  margin:0;letter-spacing:-.005em;text-wrap:balance;
}
.view-head p{margin:12px 0 0;font-size:13.7px;line-height:1.6;color:var(--ink-50);max-width:44ch}
.view-head .date{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-50);margin-bottom:9px}
.view-body{padding-top:34px;container-type:inline-size;container-name:pane}

/* ---- bottom tab bar (phone) ---- */
.tabbar{
  display:flex;background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:var(--safe-b);flex-shrink:0;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;min-height:52px;color:var(--ink-50);
  border-top:2px solid transparent;margin-top:-1px;transition:color .12s;
}
.tabbar button .tl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-family:var(--font-heading);font-weight:600}
.tabbar button[aria-current="true"]{color:var(--gold-ink);border-top-color:var(--gold)}
.tabbar button:active{color:var(--gold-ink)}

/* ---- side rail (iPad) ---- */
.rail{display:none}

/* ============================================================
   REUSABLE PIECES
   ============================================================ */
.chip{
  display:inline-block;padding:8px 13px;border-radius:var(--r-md);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  border:1px solid var(--divider);color:var(--ink-60);background:transparent;
  transition:border-color .12s,color .12s,background .12s;
}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-tint)}
.chip:active{border-color:var(--gold)}
.chiprow{
  display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
  padding:14px var(--pad);margin:0 calc(var(--pad) * -1);
}
.chiprow::-webkit-scrollbar{display:none}

.house{
  font-family:var(--font-heading);font-weight:600;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
}
.house[data-h="AstaGuru"]{color:var(--gold-ink)}
.house[data-h="Fair"]{color:var(--gold-ink)}

.tag{
  display:inline-block;padding:4px 10px;border:1px solid var(--divider);border-radius:var(--r-md);
  font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-60);
}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}

/* row list — the workhorse */
.rows > *{border-top:1px solid var(--divider)}
.rows > *:first-child{border-top:1px solid var(--divider-soft)}
.row{display:block;width:100%;padding:19px 0;transition:background .12s}
button.row:active{background:var(--gold-tint)}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row-name{font-family:var(--font-heading);font-weight:500;font-size:19.9px;line-height:1.24}
.row-sub{font-size:13.1px;color:var(--ink-60);margin-top:5px;line-height:1.55}
.row-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-50);white-space:nowrap}
.chev{color:var(--ink-40);flex-shrink:0;margin-top:2px}

/* pill for above/within estimate */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.6px;letter-spacing:.06em;
  color:var(--ink-60);white-space:nowrap;
}
.pill.up{color:var(--gold-ink)}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.85}

/* segmented control */
.seg{
  display:flex;border:1px solid var(--divider);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:6px;
}
.seg button{
  flex:1;text-align:center;padding:11px 6px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-family:var(--font-heading);font-weight:600;
  color:var(--ink-50);border-right:1px solid var(--divider);transition:all .12s;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold-tint);color:var(--gold-ink)}

/* accent box — the only one in the app, kept rare */
.accent-box{
  border:1px solid var(--gold);border-radius:var(--r-md);padding:14px 16px;
  background:var(--gold-tint);
}
.accent-box .when{font-family:var(--font-heading);font-weight:600;font-size:15.8px;color:var(--gold-ink);letter-spacing:.02em}
.accent-box .what{font-size:14.2px;margin-top:5px;line-height:1.55}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:9px 16px;border:1px solid var(--divider);border-radius:var(--r-md);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--font-heading);font-weight:600;color:var(--ink-72);transition:all .12s;
}
.btn:active{background:var(--gold-tint)}
.btn-primary{border-color:var(--gold);color:var(--gold-ink)}
.btn-block{width:100%}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ============================================================
   SCREEN: TODAY
   ============================================================ */
.diary{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:15px 0;align-items:start}
.diary .t{font-family:var(--font-heading);font-weight:600;font-size:17.9px;color:var(--gold-ink)}
.diary .ti{font-family:var(--font-heading);font-weight:500;font-size:19.4px;line-height:1.24}
.diary .wh{font-size:13.1px;color:var(--ink-60);margin-top:3px}
.diary .pr{font-size:13.1px;font-style:italic;color:var(--ink-72);margin-top:6px;line-height:1.5}

.fu{padding:16px 0}
.fu.done{opacity:.5}
.fu-name{
  font-family:var(--font-heading);font-weight:500;font-size:18.9px;
  text-decoration:underline;text-decoration-color:var(--divider);text-underline-offset:4px;
}
.fu-age{font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--ink-50)}
.fu-age.over{color:var(--gold-ink)}
.fu-why{font-size:13.7px;color:var(--ink-72);margin-top:6px;line-height:1.55}

/* Each headline is now an <a> out to the publisher, so the link defaults have
   to be undone — otherwise real news renders blue and underlined. */
.news{padding:23px 0;display:grid;grid-template-columns:1fr auto;gap:16px;
  align-items:start;color:inherit;text-decoration:none}
/* A press photo is a crop of a scene, not a work of art — cover is right here,
   unlike a lot thumbnail where cropping the painting would be the whole loss. */
.news .nimg{
  width:76px;aspect-ratio:1/1;object-fit:cover;display:block;
  background:var(--surface);border:1px solid var(--divider-soft);border-radius:var(--r-sm);
}
.filterbar{display:flex;flex-direction:column;gap:8px;padding:16px 0 4px;
  border-bottom:1px solid var(--divider-soft);margin-bottom:4px}
.fgroup{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fgroup::-webkit-scrollbar{display:none}
.fchip{font-size:11.6px;letter-spacing:.04em;padding:6px 13px;border-radius:999px;
  border:1px solid var(--divider);color:var(--ink-60);white-space:nowrap;flex:none;background:transparent}
.fchip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-tint)}

/* ---- Today, to the mockup (spec §3) ---- */
.hero{position:relative;padding-top:6px}
.hero-link{display:block;color:inherit;text-decoration:none}
.hero-media{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.hero-media img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.rank{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:var(--r-sm);
  background:var(--gold);color:#fff;font-family:var(--font-heading);font-weight:600;
  font-size:13.1px;display:flex;align-items:center;justify-content:center}
.hero-tag{position:absolute;top:10px;right:10px;background:var(--ink);color:var(--paper);
  font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:5px 8px;border-radius:var(--r-sm)}
.hero-body{padding-top:14px}
.hero-head{font-family:var(--font-heading);font-weight:500;font-size:25.2px;line-height:1.18;
  margin:6px 0 0;text-wrap:pretty}
.hero-sum{margin:8px 0 0;font-size:13.7px;color:var(--ink-72);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-why{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.why-chip{font-size:10px;letter-spacing:.05em;padding:3px 9px;border-radius:999px;
  border:1px solid var(--divider);color:var(--ink-60)}
.why-chip.artist{border-color:var(--gold);color:var(--gold-ink)}
.why-chip.client{border-color:var(--up);color:var(--up)}

.mark{position:absolute;top:0;right:0;padding:8px;color:var(--ink-40);line-height:0}
.mark.on{color:var(--gold-ink)}
.mark.on svg{fill:currentColor}

.scrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.sc{display:block;color:inherit;text-decoration:none}
.sc-media{position:relative;border-radius:var(--r-sm);overflow:hidden;background:var(--surface);
  aspect-ratio:4/3}
.sc-media img{width:100%;height:100%;object-fit:cover;display:block}
.sc-media .rank{width:20px;height:20px;font-size:11.6px;top:8px;left:8px}
.sc-media .hero-tag{font-size:8px;padding:3px 6px;top:8px;right:8px}
.sc-meta{display:flex;align-items:center;gap:8px}
.rank.flat{position:static;width:19px;height:19px;font-size:11px;flex:none}
.sc-body h4{font-family:var(--font-heading);font-weight:500;font-size:15.8px;line-height:1.25;
  margin:6px 0 0;text-wrap:pretty}

.pulserow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.pulse{border:1px solid var(--divider-soft);border-radius:var(--r-md);padding:12px 11px;
  background:var(--raised)}
.pulse .pi{color:var(--gold-ink);line-height:0;display:block;margin-bottom:8px}
.pulse .pv{font-family:var(--font-heading);font-weight:600;font-size:18.9px;line-height:1.05}
.pulse .pl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);margin-top:6px}
.pulse .ps{font-size:10.5px;color:var(--ink-50);margin-top:2px;line-height:1.3}

.wrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;
  border-bottom:1px solid var(--divider-soft);color:inherit}
.wrow .wn{flex:1;font-family:var(--font-heading);font-weight:500;font-size:16.8px}
.wrow .wr{display:block;font-family:var(--font-body);font-weight:400;font-size:11.6px;
  color:var(--ink-50);margin-top:3px}
.wrow .wspark{width:78px;height:26px;flex:none;line-height:0}
.wrow .wspark svg{width:100%;height:26px;display:block}

.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;
  border-bottom:1px solid var(--divider-soft);color:inherit}
.dayrow .di{color:var(--gold-ink);line-height:0}
.dayrow .dt{flex:1;font-size:14.2px}
.dayrow .dt b{font-family:var(--font-heading);font-weight:600;margin-right:3px}

.mf{position:relative;border-bottom:1px solid var(--divider-soft)}
.mf-link{display:block;color:inherit;text-decoration:none}
.mf-link, .mf > .mf-body{display:grid;grid-template-columns:1fr 66px;gap:14px;
  align-items:start;padding:15px 34px 15px 0}
.mf-img{width:66px;aspect-ratio:1/1;object-fit:cover;border-radius:var(--r-sm);
  background:var(--surface)}
.mf-body h4{font-family:var(--font-heading);font-weight:500;font-size:15.8px;line-height:1.25;
  margin:5px 0 0;text-wrap:pretty}
.mf .mark{top:12px}

/* Empty states collapse to one line — §13 forbids reserved blank blocks. */
.oneline{font-size:13.1px;color:var(--ink-50);font-style:italic;padding:14px 0}

@media (max-width:560px){
  .pulserow{grid-template-columns:1fr 1fr}
  .hero-head{font-size:23.1px}
}

.news-tag{
  display:inline-block;font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold-ink);background:var(--gold-tint);
  border:1px solid var(--divider);padding:3px 7px;border-radius:var(--r-sm);
  margin-bottom:7px;
}
.news:hover h3{color:var(--gold-ink)}
.news h3{transition:color .15s ease}
.news .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.news h3{font-family:var(--font-heading);font-weight:500;font-size:21px;line-height:1.22;margin:6px 0 0;text-wrap:pretty}
.news p{margin:6px 0 0;font-size:13.7px;color:var(--ink-72);line-height:1.55;text-wrap:pretty}

/* closing lots — horizontal cards on phone */
.lots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:16px var(--pad) 4px;margin:0 calc(var(--pad) * -1)}
.lots::-webkit-scrollbar{display:none}
.lot{
  flex:0 0 232px;scroll-snap-align:start;border:1px solid var(--divider);border-radius:var(--r-md);
  padding:14px 15px;background:var(--raised);
}
.lot .n{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50)}
.lot .a{font-family:var(--font-heading);font-weight:500;font-size:19.9px;margin-top:4px;line-height:1.2}
.lot .s{font-size:12.6px;color:var(--ink-60);margin-top:4px}
.lot .e{font-family:var(--font-heading);font-weight:600;font-size:17.9px;margin-top:10px}
.lot .m{font-size:12.6px;color:var(--gold-ink);margin-top:4px;line-height:1.4}

/* ============================================================
   SCREEN: DOSSIER
   ============================================================ */
.dossier-head h1{font-family:var(--font-heading);font-weight:400;font-size:42px;line-height:1.02;margin:8px 0 0;letter-spacing:-.012em;text-wrap:balance}
.dossier-head .yrs{font-size:14.7px;font-style:italic;color:var(--ink-60);margin-top:8px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:10px}
.stat{padding:16px 0;border-top:1px solid var(--divider)}
.stat .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-50)}
.stat .v{font-family:var(--font-heading);font-weight:600;font-size:23.1px;margin-top:2px;letter-spacing:.01em}
.stat.gold .v{color:var(--gold-ink)}
.stat:last-child{grid-column:1 / -1}

.chart{margin-top:22px}
.chart-cap{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50);margin-top:7px}
.chart svg{width:100%;display:block}

.bio{font-size:15.8px;line-height:1.75;text-align:justify;hyphens:auto;margin-top:20px;color:var(--ink-72)}
.bio.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more-link{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-family:var(--font-heading);font-weight:600}

.rec{padding:22px 0}
.rec-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rec-work{font-family:var(--font-heading);font-weight:500;font-style:italic;font-size:19.9px;line-height:1.25;margin-top:7px}
.rec-med{font-size:13.1px;color:var(--ink-60);margin-top:3px}
.rec-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:15px}
.rec-est{font-size:12.6px;color:var(--ink-50)}
.rec-price{font-family:var(--font-heading);font-weight:600;font-size:22.1px;text-align:right;line-height:1.1}
.rec-price.up{color:var(--gold-ink)}
.foot-note{font-size:12.1px;font-style:italic;color:var(--ink-50);margin-top:16px;line-height:1.5}

.talk{display:grid;grid-template-columns:16px 1fr;gap:12px;padding:13px 0;font-size:14.7px;line-height:1.62}
.talk .mk{color:var(--gold);font-family:var(--font-heading);font-size:17.9px;line-height:1.3}

/* ============================================================
   SCREEN: MARKET
   ============================================================ */
/* ---- lot card ------------------------------------------------------------
   The point of the desk is the picture. Every lot in the database carries one
   and all three houses serve them to our origin, so a result leads with the
   work and the numbers sit beside it. */
.lotcard{
  display:grid;grid-template-columns:80px 1fr;gap:16px;
  padding:18px 0;align-items:start;width:100%;text-align:left;
  /* The card is an <a> now, so the link defaults have to be undone or every
     line of it renders underlined. */
  font:inherit;color:inherit;text-decoration:none;
}
.lotcard:hover .lot-artist{color:var(--gold-ink)}
.lotcard .lot-artist{transition:color .12s ease}
.lotcard + .lotcard,
.lotwrap + .lotwrap, .lotwrap + .lotcard, .lotcard + .lotwrap{border-top:1px solid var(--divider-soft)}
.lotwrap .lotcard{border-top:0}
.lot-dossier{margin:0 0 16px 96px;font-size:10.5px}
.lotcard .thumb{
  /* contain, never cover: cropping a painting to fit a box defeats the point of
     showing it. Saffronart serves squares, AstaGuru tall scans; both fit. */
  width:80px;aspect-ratio:3/4;object-fit:contain;display:block;
  background:var(--surface);border:1px solid var(--divider-soft);
  border-radius:var(--r-sm);
}
.lotcard .thumb.ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);
  padding:4px;line-height:1.3;
}
.lot-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lot-artist{font-family:var(--font-heading);font-weight:500;font-size:19.9px;line-height:1.18;margin-top:7px}
.lot-title{font-size:13.1px;font-style:italic;color:var(--ink-72);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lot-meta{font-size:11.6px;color:var(--ink-50);margin-top:3px}
/* Wrap as whole units. At 375px the content column is ~250px and
   "Est. ₹2.2–2.8 lakh" beside "₹1.4 lakh" does not fit — without nowrap the
   estimate broke mid-phrase and ran into the price. */
.lot-foot{display:flex;justify-content:space-between;align-items:flex-end;
  gap:2px 14px;margin-top:11px;flex-wrap:wrap}
.lot-est{font-size:12.1px;color:var(--ink-50);white-space:nowrap}
.lot-foot > div:last-child{margin-left:auto}
.lot-price{font-family:var(--font-heading);font-weight:600;font-size:21px;line-height:1;text-align:right;white-space:nowrap}
.lot-vs{font-size:11.6px;margin-top:4px;text-align:right;white-space:nowrap}
.lot-vs.above{color:var(--up)}
.lot-vs.below{color:var(--down)}

.res{padding:22px 0}
.res-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.res-artist{font-family:var(--font-heading);font-weight:500;font-size:22.1px;line-height:1.2;margin-top:8px}
.res-work{font-size:13.7px;font-style:italic;color:var(--ink-72);margin-top:3px}
.res-sale{font-size:12.6px;color:var(--ink-50);margin-top:3px}
.res-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:14px}
.res-price{font-family:var(--font-heading);font-weight:600;font-size:23.1px;line-height:1}

.trend{display:grid;grid-template-columns:26px 1fr auto;gap:16px;align-items:center;padding:19px 0;width:100%;text-align:left}
.trend .rk{font-family:var(--font-heading);font-weight:500;font-size:14.7px;color:var(--ink-40)}
.trend .nm{font-family:var(--font-heading);font-weight:500;font-size:18.9px;line-height:1.2}
.trend .mt{font-size:12.1px;color:var(--ink-50);margin-top:3px}
.trend .dl{font-family:var(--font-heading);font-weight:600;font-size:19.9px;text-align:right}
.trend .dl.hot{color:var(--gold-ink)}
.trend .av{font-size:11.6px;color:var(--ink-50);text-align:right;margin-top:2px;letter-spacing:.04em}

.fx-list .fxr{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0}
.fx-list .fxr .p{font-size:13.7px;letter-spacing:.06em}
.fx-list .fxr .r{font-family:var(--font-heading);font-weight:600;font-size:19.9px}
.fx-list .fxr .m{font-size:12.6px;margin-left:10px}
.fx-list .fxr .m.up{color:var(--gold-ink)}

/* ============================================================
   SCREEN: CLIENTS
   ============================================================ */
.cl-tier{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--ink-50)}
.cl-tier.principal{color:var(--gold-ink)}

.card-head{padding-bottom:18px;border-bottom:1px solid var(--rule)}
.card-head h1{font-family:var(--font-heading);font-weight:400;font-size:35.7px;line-height:1.06;margin:6px 0 0;text-wrap:balance}
.card-head .ti{font-size:13.7px;color:var(--ink-60);margin-top:7px}
.card-head .lv{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:16px}
.card-head .lv .amt{font-family:var(--font-heading);font-weight:600;font-size:27.3px}
.card-head .lv .cap{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-50);text-align:right;max-width:12ch;line-height:1.5}

.brief-p{font-size:14.7px;line-height:1.72;hyphens:auto;color:var(--ink-72);padding-top:14px}

.hold{padding:13px 0}
.hold .a{font-family:var(--font-heading);font-weight:500;font-size:17.9px}
.hold .w{font-size:13.1px;color:var(--ink-60);margin-top:2px}

.ref{padding:12px 0;font-size:14.2px;line-height:1.5}
.ref b{font-family:var(--font-heading);font-weight:600;color:var(--gold-ink);font-size:15.8px}
.ref span{color:var(--ink-60)}

.log{display:grid;grid-template-columns:72px 1fr;gap:15px;padding:15px 0}
.log .d{font-size:12.1px;color:var(--gold-ink);letter-spacing:.02em;line-height:1.5}
.log .ch{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50);margin-top:2px}
.log .nt{font-size:14.2px;line-height:1.58}

.tpl{padding:0}
.tpl-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;width:100%}
.tpl-hd .n{font-family:var(--font-heading);font-weight:500;font-size:17.9px;line-height:1.25}
.tpl-hd .ac{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);white-space:nowrap}
.tpl-body{
  background:var(--raised);border:1px solid var(--divider);border-radius:var(--r-md);
  padding:15px 16px;font-size:14.2px;line-height:1.72;white-space:pre-line;margin-bottom:16px;
}

/* ============================================================
   SCREEN: KNOWLEDGE
   ============================================================ */
.obj-q{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px 0;width:100%}
.obj-q .q{font-family:var(--font-heading);font-weight:500;font-size:19.9px;line-height:1.3}
.obj-q .mk{font-family:var(--font-heading);font-size:23.1px;color:var(--gold);line-height:1;flex-shrink:0;width:20px;text-align:right}
.obj-a{padding:0 0 18px 16px;border-left:1px solid var(--gold);margin-bottom:2px}
.obj-a p{margin:0;font-size:14.7px;line-height:1.72;text-align:justify;hyphens:auto;color:var(--ink-72)}
.obj-a .proof{margin-top:11px;font-size:12.6px;font-style:italic;color:var(--ink-50);text-align:left}

.pitch{border:1px solid var(--divider);border-radius:var(--r-md);background:var(--raised);padding:20px 18px;margin-top:16px}
.pitch h3{font-family:var(--font-heading);font-weight:500;font-size:25.2px;line-height:1.18;margin:8px 0 0;text-wrap:balance}
.pitch .bd{font-size:14.7px;line-height:1.78;white-space:pre-line;margin-top:14px;text-align:justify;hyphens:auto;color:var(--ink-72)}
.ai-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.ai-note{font-size:13.1px;line-height:1.55;margin-top:10px;color:var(--ink-60)}
.ai-bad{color:var(--warn,#8a3324)}
.pitch-lot{padding:14px 0}
.pitch-lot .a{font-family:var(--font-heading);font-weight:500;font-size:18.9px}
.pitch-lot .w{font-size:13.1px;font-style:italic;color:var(--ink-60);margin-top:3px}
.pitch-lot .why{font-size:13.1px;color:var(--gold-ink);margin-top:6px;line-height:1.5}
.pitch-lot .es{font-family:var(--font-heading);font-weight:600;font-size:17.9px;white-space:nowrap}

/* ============================================================
   SCREEN: CALENDAR
   ============================================================ */
.month{font-family:var(--font-heading);font-weight:600;font-size:13.7px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);padding:24px 0 8px;border-bottom:1px solid var(--divider)}

/* ---- month grid ------------------------------------------------------------
   A sale calendar she can actually plan around, rather than a list she has to
   read end to end. One house gets one colour, so a month reads at a glance. */
.cal-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:20px}
.cal-title{font-family:var(--font-heading);font-weight:500;font-size:27.3px;letter-spacing:.01em;margin:0;flex:1 1 auto}
.cal-nav{display:flex;gap:6px}
.cal-nav .chip{min-width:34px;justify-content:center;text-align:center}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:20px}
.cal-dow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-50);text-align:center;padding-bottom:7px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-cell{
  min-height:100px;border:1px solid var(--divider-soft);border-radius:var(--r-md);
  padding:6px 7px;background:var(--raised);text-align:left;overflow:hidden;
  font:inherit;color:inherit;display:block;width:100%;
}
.cal-cell.pad{background:transparent;border-color:transparent}
.cal-cell.has{cursor:pointer;border-color:var(--divider);transition:border-color .12s ease}
.cal-cell.has:hover{border-color:var(--gold)}
.cal-cell.sel{border-color:var(--gold);background:var(--gold-tint)}
.cal-cell .dn{font-family:var(--font-heading);font-weight:600;font-size:14.7px;font-variant-numeric:tabular-nums}
.cal-cell .hd{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:5px}
.cal-now{font-size:7.9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper);background:var(--gold-ink);padding:2px 5px;border-radius:999px}
.cal-cell.today .dn{color:var(--gold-ink)}
.cal-ev{display:flex;align-items:center;gap:5px;margin-bottom:3px;font-size:11px;
  line-height:1.25;overflow:hidden;white-space:nowrap}
.cal-ev .t{overflow:hidden;text-overflow:ellipsis;color:var(--ink-72)}
.cal-dot{width:6px;height:6px;border-radius:50%;flex:none}
.cal-more{font-size:10px;color:var(--ink-50);margin-top:2px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:11.6px;color:var(--ink-60);align-items:center}
.cal-legend .k{display:inline-flex;align-items:center;gap:6px}
.cal-day-detail{margin-top:22px;padding:18px;border:1px solid var(--divider);
  border-radius:var(--r-md);background:var(--raised)}

/* One colour per house. Unknown houses fall back to plain ink. */
.cal-dot.h-astaguru{background:var(--gold)}
.cal-dot.h-saffronart{background:#7a6096}
.cal-dot.h-pundoles{background:#4a7c6f}
.cal-dot.h-giftex{background:#b5544a}
.cal-dot.h-other{background:var(--ink-40)}

/* Seven columns means the cell width, not the viewport, decides what fits.
   At 1280 a cell is ~129px and a title reads in full; on an iPad in portrait it
   is ~55px, where a single ellipsed line said only "Inte...". Between those the
   title wraps to two short lines instead of being cut to nothing. */
@media (max-width:900px){
  .cal-now{display:none}
  .cal-cell.today .dn{
    background:var(--gold-ink);color:var(--paper);
    border-radius:999px;padding:1px 5px;margin-left:-2px;
  }
  .cal-ev{white-space:normal;align-items:flex-start}
  .cal-ev .t{
    font-size:9.5px;line-height:1.15;text-overflow:clip;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .cal-dot{margin-top:2px}
  .cal-cell{min-height:112px}
}
@media (max-width:560px){
  /* ~44px a cell: nothing readable fits, so dots only and tap for the detail. */
  .cal-cell{min-height:56px;padding:5px 4px}
  .cal-ev .t, .cal-more{display:none}
  .cal-ev{gap:3px;margin-bottom:2px;display:inline-flex}
  .cal-cell .hd{margin-bottom:3px}
  .cal-title{font-size:22.1px}
}
.ev{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 0;align-items:start}
.ev .day{font-family:var(--font-heading);font-weight:600;font-size:16.8px;margin-bottom:5px}
.ev .ti{font-family:var(--font-heading);font-weight:500;font-size:19.9px;line-height:1.22;margin-top:6px}
.ev .ci{font-size:13.1px;color:var(--ink-60);margin-top:3px}
.ev .nt{font-size:13.1px;color:var(--ink-72);margin-top:7px;line-height:1.5}
.ev .rs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ev .gs{font-size:11px;color:var(--ink-50);white-space:nowrap}

/* ============================================================
   MORE (phone hub)
   ============================================================ */
.hub .hrow{display:flex;align-items:center;gap:14px;padding:17px 0;width:100%}
.hub .hrow .ic{color:var(--gold);flex-shrink:0}
.hub .hrow .tx{flex:1}
.hub .hrow .tt{font-family:var(--font-heading);font-weight:500;font-size:18.9px}
.hub .hrow .sb{font-size:13.1px;color:var(--ink-60);margin-top:2px}

/* ---- form fields ---- */
input[data-nc], input[data-key], textarea[data-nc],
input[data-ed], textarea[data-ed]{
  width:100%;margin-top:9px;padding:12px 14px;
  font-family:var(--font-body);font-size:16.8px;   /* 16px stops iOS zooming on focus */
  color:var(--ink);background:var(--raised);
  border:1px solid var(--divider);border-radius:var(--r-md);
  -webkit-appearance:none;appearance:none;
}
input[data-nc]:focus, input[data-key]:focus, textarea[data-nc]:focus,
input[data-ed]:focus, textarea[data-ed]:focus{outline:none;border-color:var(--gold)}
textarea[data-nc], textarea[data-ed]{resize:vertical;line-height:1.6}
/* Safari renders a date input at its own intrinsic width and ignores width:100%
   unless the appearance is reset, which the rule above already does. */
input[data-ed][type=date]{min-height:46px}

/* ---- inline edit panels on the client card ---- */
.panel{
  margin-top:18px;padding:18px 18px 20px;
  background:var(--raised);border:1px solid var(--divider);border-radius:var(--r-md);
}
.panel .fld{margin-top:16px}
.panel .fld:first-of-type{margin-top:10px}
.panel .chiprow{padding:0;margin:10px 0 0}
.row-actions{margin-top:2px;gap:8px}
.row-actions .chip{font-size:10.5px;padding:5px 10px}
/* An armed delete looks different from an idle one, so the second tap is never
   a surprise. */
.chip.danger{border-color:var(--gold);color:var(--gold-ink)}

/* ---- theme toggle ---- */
.theme-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-60);border-radius:var(--r-md);
}
.theme-btn:active{background:var(--gold-tint);color:var(--gold-ink)}

/* ============================================================
   SEARCH SHEET
   ============================================================ */
.sheet-bg{
  position:fixed;inset:0;z-index:100;background:color-mix(in srgb, var(--ink) 40%, transparent);
  display:flex;flex-direction:column;
}
.sheet{
  background:var(--paper);flex:1;display:flex;flex-direction:column;
  padding-top:var(--safe-t);animation:rise .22s cubic-bezier(.32,.72,0,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-top{display:flex;align-items:center;gap:12px;padding:10px var(--pad);border-bottom:1px solid var(--rule)}
.sheet-top .g{color:var(--gold);flex-shrink:0}
.sheet-top input{
  flex:1;border:0;background:transparent;outline:none;font-family:var(--font-heading);
  font-weight:500;font-size:24.2px;padding:8px 0;letter-spacing:.005em;
}
.sheet-top input::placeholder{color:var(--ink-40);font-weight:400}
.sheet-top .cancel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-family:var(--font-heading);font-weight:600;padding:10px 0}
.sheet-body{flex:1;overflow-y:auto;padding:0 var(--pad) 40px}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px 0;width:100%;border-top:1px solid var(--divider)}
@media (min-width:520px){.sug{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px}}
.sug .n{font-family:var(--font-heading);font-weight:500;font-size:21px}
.sug .m{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-50);white-space:nowrap}
.sheet-hint{padding:22px 0 10px}
.empty{padding:30px 0;text-align:center;font-size:14.2px;color:var(--ink-50);font-style:italic}

/* ============================================================
   iPAD — 768px and up
   ============================================================ */
@media (min-width:768px){
  :root{--pad:40px}
  body{font-size:17.3px}
  .app{flex-direction:row}

  .tabbar{display:none}

  .rail{
    display:flex;flex-direction:column;width:262px;flex-shrink:0;
    border-right:1px solid var(--rule);background:var(--paper);
    padding:calc(var(--safe-t) + 26px) 0 calc(var(--safe-b) + 18px);overflow-y:auto;
  }
  .rail-brand{padding:0 20px 20px;text-align:center}
  .rail-brand .wm{font-family:var(--font-heading);font-weight:400;font-size:22.1px;letter-spacing:.2em;text-transform:uppercase;line-height:1.15}
  .rail-brand .sub{font-size:8.9px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-50);margin-top:7px;line-height:1.6}
  .rail-brand .dbl{height:3px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:16px}
  .rail-nav{padding:14px 14px 0;display:flex;flex-direction:column;gap:2px}
  .rail-nav button{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-md);
    color:var(--ink-60);border-left:2px solid transparent;transition:all .12s;min-height:44px;
  }
  .rail-nav button .tl{font-family:var(--font-heading);font-weight:600;font-size:14.2px;letter-spacing:.13em;text-transform:uppercase;flex:1}
  .rail-nav button .bg{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40)}
  .rail-nav button[aria-current="true"]{background:var(--gold-tint);color:var(--gold-ink);border-left-color:var(--gold)}
  .rail-nav button[aria-current="true"] .bg{color:var(--gold-ink);opacity:.75}
  .rail-nav button:hover{color:var(--ink)}
  .rail-foot{margin-top:auto;padding:20px 24px 0;border-top:1px solid var(--divider);margin-left:24px;margin-right:24px}

/* The auction feed supplies figures; it cannot supply prose. These are the
   artists we have written a dossier for — everyone else shows figures only. */
const NARRATIVE_FOR = {
  "v s gaitonde": "gaitonde", "s h raza": "raza", "f n souza": "souza",
  "m f husain": "husain", "amrita sher-gil": "sher_gil",
  "bhupen khakhar": "khakhar", "tyeb mehta": "mehta", "subodh gupta": "subodh"
};

const listOf = xs => xs.length < 2 ? (xs[0] || "")
  : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

const todayLong = () => new Date().toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "long", year: "numeric" });

const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d} ${MON3[+m - 1]} ${y.slice(2)}`;
};
// Lakh keeps a decimal under 10, matching ingest/export_app.py. Rounding to
// whole lakh made 1.1, 1.3 and 1.9 lakh all read as "1 lakh" or "2 lakh".
/* Mirrors inr() in ingest/export_app.py — the two MUST agree, because the same
   rupee figure is rendered here on a client card and there in the feed.

   Rounding is done on the integer rupee value, not with toFixed on the divided
   float: (1.035).toFixed(2) is "1.03", because 1.035 is really 1.0349999… in
   binary. That made ₹1,03,50,000 read as ₹1.03 cr in the browser and ₹1.04 cr
   from the pipeline. Math.round on an integer quotient is exact and half-up,
   which is what the Decimal ROUND_HALF_UP on the Python side does. */
const inrShort = n => {
  if (!n) return "\u2014";
  if (n >= 1e7 || Math.round(n / 1e5) >= 100) {
    return n / 1e7 < 10
      ? `\u20b9${(Math.round(n / 1e5) / 100).toFixed(2)} cr`
      : `\u20b9${(Math.round(n / 1e6) / 10).toFixed(1)} cr`;
  }
  if (n >= 1e5) {
    return n / 1e5 < 10
      ? `\u20b9${(Math.round(n / 1e4) / 10).toFixed(1)} lakh`
      : `\u20b9${Math.round(n / 1e5)} lakh`;
  }
  return `\u20b9${n.toLocaleString("en-IN")}`;
};

const pctLabel = v => v == null ? null : (v >= 0 ? "+" : "") + v.toFixed(0) + "%";

/* ---- market news --------------------------------------------------------
   Real headlines from ingest/news.py, every one linking back to the publisher
   that wrote it. Two tiers: what Google News returns for Indian-art queries,
   and the international trade press. They are kept visibly apart because an
   international story is not a story about her category, and the four headlines
   this replaced were invented — one of them quoting a sell-through figure the
   data rules say cannot be derived at all.
   ------------------------------------------------------------------------ */
/* One word for what kind of story it is, read off the headline. Ordered most
   specific first, because "gallery opens at the museum" is a gallery story.
   No match means no chip — better silent than mislabelled. */
const NEWS_TAGS = [
  ["Auction",     /\b(auction|auctioned|sold|sells|fetches|hammer|bidding)\b|saffronart|astaguru|pundole|sotheby|christie|bonhams/i],
  ["Market",      /\b(market|prices|record|crore|lakh|index|report|collectors)\b/i],
  ["Gallery",     /\b(gallery|galleries|showroom)\b/i],
  ["Institution", /\b(museum|biennale|biennial|foundation|ministry|academy|festival)\b/i],
  ["Exhibition",  /\b(exhibition|exhibit|showcase|retrospective)\b/i],
  ["Artist",      /\b(artist|artists|painter|sculptor)\b/i],
];
/* ---- story ranking (spec §3.4) --------------------------------------------

   Scored IN THE BROWSER, deliberately. Two of the six signals depend on her
   client book, and that lives behind the desk key in D1 — scoring server-side
   would mean shipping client interests to a shared endpoint to rank public news.
   The spec's own §14 says send the minimum client context anywhere; here the
   answer is none at all.

   Weights follow the spec. Every point scored records WHY, because "why does
   this matter" has to be traceable to a stored record — not prose a model wrote.
   No LLM is involved and none is implied. */
const AUTHORITATIVE = [
  "the hindu", "the indian express", "indian express", "economic times",
  "hindustan times", "the art newspaper", "artnews", "artforum", "artnet",
  "bloomberg", "reuters", "mint", "livemint", "business standard", "the print",
  "financial express", "times of india", "the tribune", "scroll",
];
const MARKET_SIGNIFICANCE = [
  "auction", "auctions", "sold", "sells", "fetches", "record", "hammer",
  "estimate", "crore", "lakh", "consignment", "sale", "collection",
  "saffronart", "astaguru", "pundole", "sotheby", "christie", "bonhams",
];

/* Surnames that are ordinary words or too common to identify anyone. */
const SURNAME_STOP = new Set(["roy", "das", "sen", "bose", "khan", "singh",
  "kumar", "shaw", "gupta", "iyer", "menon", "rao", "dey", "jain", "shah"]);

function artistsInText(hay) {
  /* The curated set only — matching all 1,300 raw names fired on the word
     "Artist" itself. Headlines write the same painter as "S H Raza",
     "S.H. Raza" and "Sayed Haider Raza", so compare with punctuation stripped
     and fall back to the surname. FOUR characters, not five: Raza is four, and
     excluding him excluded the single most quoted name in this market. The
     stoplist carries the ones that would match anything. */
  const flat = hay.replace(/[.\u2019']/g, "").replace(/\s+/g, " ");
  const out = [];
  for (const k of artistKeys) {
    const a = ARTISTS[k];
    if (!a || !a.name) continue;
    const name = a.name.toLowerCase().replace(/[.\u2019']/g, "");
    const surname = name.split(" ").pop();
    if (flat.includes(name)) { out.push(k); continue; }
    if (surname.length >= 4 && !SURNAME_STOP.has(surname) &&
        new RegExp("(?<!\\w)" + surname + "(?!\\w)").test(flat)) out.push(k);
  }
  return out;
}

function scoreStory(n) {
  const hay = ((n.headline || "") + " " + (n.why || "")).toLowerCase();
  const src = (n.source || "").toLowerCase();
  let score = 0;
  const reasons = [];

  // recency 20 — linear decay over a fortnight
  const days = Math.max(0, (Date.now() - Date.parse(n.date + "T00:00:00")) / 86400000);
  score += 20 * Math.max(0, 1 - days / 14);

  // Indian / South Asian relevance 20
  if (INDIA_WORDS.some(t => hay.includes(t))) { score += 20; }

  // auction / market significance 20
  const mk = MARKET_SIGNIFICANCE.filter(t => hay.includes(t));
  if (mk.length) { score += 20; reasons.push({ kind: "market", label: "Market activity" }); }

  // watchlist artist match 15
  const hits = artistsInText(hay);
  if (hits.length) {
    score += 15;
    reasons.push({ kind: "artist", label: ARTISTS[hits[0]].name + " on the desk", key: hits[0] });
  }

  // client relevance 15 — only when the book is actually open
  if (CRM.live && CRM.clients) {
    const matched = CRM.clients.filter(c => {
      const wants = [(c.focus || ""), ...(c.wants || [])].join(" ").toLowerCase();
      if (!wants.trim()) return false;
      return hits.some(k => wants.includes(ARTISTS[k].name.toLowerCase().split(" ").pop()))
        || wants.split(/[^a-z]+/).some(w => w.length > 4 && hay.includes(w));
    });
    if (matched.length) {
      score += 15;
      reasons.push({ kind: "client",
        label: matched.length + (matched.length === 1 ? " client" : " clients") + " in the book" });
    }
  }

  // source authority 10
  if (AUTHORITATIVE.some(t => src.includes(t))) score += 10;

  return { score: Math.round(score), reasons, artists: hits };
}

const INDIA_WORDS = ["india", "indian", "mumbai", "delhi", "kolkata", "chennai",
  "bengaluru", "hyderabad", "bengal", "south asian", "saffronart", "astaguru",
  "pundole", "kochi", "jaipur"];

/* Ranked once per render, cached on the object so the Today hero and the feed
   agree about what matters. */
function rankedStories() {
  const all = ((REAL.news || {}).on_market || []).map(n => ({ ...n, ...scoreStory(n) }));
  return all.sort((a, b) => b.score - a.score || String(b.date).localeCompare(String(a.date)));
}

const newsTag = n => {
  const hay = (n.headline || "") + " " + (n.why || "");
  const hit = NEWS_TAGS.find(([, rx]) => rx.test(hay));
  return hit ? hit[0] : null;
};

const newsRow = n => {
  const u = safeUrl(n.url);
  const tag = newsTag(n);
  const img = safeUrl(n.image);
  const body = `<div>
      ${tag ? `<span class="news-tag">${esc(tag)}</span>` : ""}
      <div class="kick">${esc(fmtDate(n.date))} \u00b7 ${esc(n.source)}</div>
      <h3>${esc(n.headline)}</h3>${n.why ? `<p>${esc(n.why)}</p>` : ""}
    </div>${img
      ? `<img class="nimg" src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`
      : ""}`;
  return u
    ? `<a class="news" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${body}</a>`
    : `<div class="news">${body}</div>`;
};

function newsBlock(nMine, nWider) {
  const d = REAL.news || {};
  const mine = (d.on_market || []).slice(0, nMine);
  const wider = (d.wider || []).slice(0, nWider);
  if (!mine.length && !wider.length) {
    return `<div class="empty">No headlines pulled yet. The nightly refresh fills this.</div>`;
  }
  return `<div class="rows">`
    + mine.map(newsRow).join("")
    + (wider.length
        ? `<div class="label" style="padding:20px 0 2px">Wider art market</div>` + wider.map(newsRow).join("")
        : "")
    + `</div>`;
}

const onMarketCount = () => ((REAL.news || {}).on_market || []).length;

function buildArtists() {
  const out = {};
  for (const key of Object.keys(REAL.artists)) {
    const a = REAL.artists[key], s = a.stats;
    const n = NARRATIVE[NARRATIVE_FOR[key]] || {};
    out[key] = {
      key: key,
      name: a.name,
      years: n.years || "",
      movement: n.movement || `${s.lots_total} lots on record`,
      bio: n.bio || "",
      themes: n.themes || [],
      talking: n.talking || [],
      collectors: n.collectors || [],
      stats: {
        high: s.high || "—",
        avg: s.median_12mo || s.median_all || "—",
        lots12: String(s.lots_12mo == null ? 0 : s.lots_12mo),
        above: s.above_high_rate == null ? "—" : s.above_high_rate + "%",
        sellThrough: s.sell_through,
        sellBasis: s.sell_through_basis || null,
        delta: pctLabel(s.delta_12mo),
        deltaBasis: s.delta_basis || null,
        indexHouses: s.index_houses || []
      },
      index: (a.index || []).map(p => p.value),
      indexYears: (a.index || []).map(p => p.year),
      records: (a.records || []).map(r => ({
        date: fmtDate(r.date), house: r.house,
        work: r.title || "Untitled",
        medium: [r.medium, r.size].filter(Boolean).join(", ") || "—",
        sale: r.lot ? "Lot " + r.lot : "",
        est: r.est || "Estimate not published",
        price: r.price || "—",
        up: !!r.above, nat: !!r.nat, url: r.url
      }))
    };
  }
  return out;
}

let ARTISTS = buildArtists();

let FX = [];
let FX_AS_OF = null;

/* Recompute everything derived from REAL. Called once at boot, and again if the
   live fetch replaces the embedded dataset. */
function rebuildFromReal() {
  // One gate for the whole app. The embedded copy ships inside the page (and
  // inside a published Artifact), so it can be older than the schema the code
  // expects, and a half-failed ingest can drop a key outright. Filling the
  // shape once here beats defending forty read sites: a missing `coverage` used
  // to white-screen Market, Calendar, More, the dossier and the search sheet,
  // and a missing `generated_at` took out More on its own.
  REAL.coverage = REAL.coverage || {};

   The private half. /api is Access-protected and same-origin, so a 401 simply
   means she is not signed in (or this is the public GitHub Pages mirror, which
   has no API at all). Either way the desk keeps working on the sample book
   rather than breaking — the market data is the part that must never fail.
   ------------------------------------------------------------ */
const CRM = { live: false, who: null, clients: null, followups: null, diary: null,
              detail: {}, guard: null, needsKey: false, keyError: null,
              ai: false };   // a Mistral key is set on this origin

const KEY_STORE = "gallery.key";
const deskKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } };
const setDeskKey = k => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} };

async function api(path, opts) {
  const key = deskKey();
  const r = await fetch("api" + path, {
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      ...(key ? { Authorization: "Bearer " + key } : {}),
    },
    ...opts,
  });
  if (r.status === 401 || r.status === 503) return null;
  if (!r.ok) throw new Error(`api ${path} -> ${r.status}`);
  return r.json();
}

async function loadCRM() {
  try {
    // /health needs no key, so an unconfigured host is distinguishable from a
    // wrong key — the difference between "no desk here" and "try again".
    const h = await fetch("api/health").then(r => r.ok ? r.json() : null).catch(() => null);
    CRM.guard = h ? h.guard : null;
    if (!h) return false;

    const me = await api("/me");
    if (!me) { CRM.needsKey = true; return false; }
    CRM.needsKey = false;
    // The drafter is optional: an origin with no MISTRAL_API_KEY is a working
    // desk, just without the button. Never let its absence fail the load.
    const [clients, brief, ai] = await Promise.all([
      api("/clients"),
      api("/brief"),
      api("/ai/status").catch(() => null),
    ]);
    CRM.ai = !!(ai && ai.configured);
    if (!clients) return false;
    CRM.live = true;
    CRM.who = me.email;
    CRM.clients = clients.clients || [];
    CRM.followups = (brief && brief.followups) || [];
    CRM.diary = (brief && brief.diary) || null;
    return true;
  } catch (e) {
    return false;                    // sample book stands
  }
}

/* Live headlines. The nightly pipeline bakes a copy into app_data.json, which
   caps freshness at 24 hours — and the desk sat on six-day-old headlines while
   that cron ran green every night, because the queries were unbounded. This
   asks the edge instead, so the private site is current within its cache
   window. On GitHub Pages there is no Function, api/news 404s, and the baked
   copy stands.

   The endpoint serves her market only; the wider trade-press tier stays baked,
   because those five feeds are not worth five more fetches per cache miss. */
/* Same origin first — that is the private site, where the Function lives. On
   GitHub Pages there is no Function and api/news 404s, so it reaches across to
   the private site for the same public headlines. A published Artifact cannot
   do either: its CSP blocks cross-origin fetches, so it keeps the embedded copy
   and is a snapshot by design. */
const NEWS_ENDPOINTS = ["api/news", "https://the-gallery-ct1.pages.dev/api/news"];

async function loadNews() {
  try {
    let d = null;
    for (const url of NEWS_ENDPOINTS) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) continue;
        d = await r.json();
        if (d && Array.isArray(d.on_market) && d.on_market.length) break;
        d = null;
      } catch (e) { /* try the next one */ }
    }
    if (!d) return false;

    /* Merge, do not replace. The two layers see different things: the edge
       reads Indian art desks (galleries, shows, the scene) and is minutes old;
       the nightly Google News pass runs from GitHub Actions, where Google will
       answer, and it is the one that catches "Saffronart", "AstaGuru" and the
       record-price stories. Dropping either loses half her picture. */
    const baked = ((REAL.news || {}).on_market) || [];
    const key = h => h.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().slice(0, 60);
    const seen = new Set();
    const merged = [];
    for (const n of [...d.on_market, ...baked]) {
      if (!n || !n.headline) continue;
      const k = key(n.headline);
      if (seen.has(k)) continue;
      seen.add(k);
      merged.push(n);
    }
    /* Same day, picture first. Google-sourced stories carry no image — its
       interstitial hides the publisher URL and its og:image is Google's own
       logo — while the publisher feeds do. Sorting on date alone put the
       imageless ones on top and buried every picture below the fold. Date still
       wins across days; this only breaks ties. */
    merged.sort((a, b) => {
      const d = String(b.date).localeCompare(String(a.date));
      if (d !== 0) return d;
      return (b.image ? 1 : 0) - (a.image ? 1 : 0);
    });

    /* Reserve slots for market stories. Sorted purely by date, a run of fresh
       gallery-scene pieces evicted every auction story she actually trades on —
       measured: the Gandhi record and the AstaGuru Singapore piece both fell off
       the end. The live feeds are mostly scene; the market news comes from the
       nightly pass, and it is older by construction. */
    // "collector" alone matched a furniture showroom; a market story needs an
    // auction word or a house name, not a lifestyle noun.
    const isMarket = n => /saffronart|astaguru|pundole|sotheby|christie|bonhams|\b(auction|auctioned|auctions|sold|sells|fetches|record|hammer|consignment|crore|lakh)\b/i
      .test(n.headline + " " + (n.why || ""));
    const market = merged.filter(isMarket).slice(0, 6);
    const scene = merged.filter(n => !isMarket(n)).slice(0, 8);
    const kept = [...market, ...scene]
      .sort((a, b) => String(b.date).localeCompare(String(a.date)));

    REAL.news = {
      ...(REAL.news || {}),
      on_market: kept,
      generated_at: d.generated_at,
      live: true,
    };
    return true;
  } catch (e) {
    return false;                 // baked copy stands
  }
}

async function loadLiveData() {

/* ---- sparkline: measured, so the endpoint dot stays round ---- */
function sparkline(values, width) {
  const w = Math.max(240, width), h = 128, padT = 12, padB = 22, padX = 5;
  const min = Math.min(...values), max = Math.max(...values), span = Math.max(1, max - min);
  const x = i => padX + (i * (w - padX * 2)) / (values.length - 1);
  const y = v => padT + (1 - (v - min) / span) * (h - padT - padB);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `M${x(0).toFixed(1)},${(h - padB).toFixed(1)} L${pts.split(" ").join(" L")} L${x(values.length - 1).toFixed(1)},${(h - padB).toFixed(1)} Z`;
  const lastX = x(values.length - 1), lastY = y(values[values.length - 1]);
  const mid = padT + (h - padT - padB) / 2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
      aria-label="Price index, 2016 base 100, rising to ${values[values.length - 1]}">
    <line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="var(--divider-soft)" stroke-width="1"/>
    <line x1="0" y1="${h - padB}" x2="${w}" y2="${h - padB}" stroke="var(--divider)" stroke-width="1"/>
    <path d="${area}" fill="var(--gold)" opacity="0.09"/>
    <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.5"/>
  </svg>`;
}

      ? `<div class="oneline">Her calendar is not connected yet.</div>`
      : (CRM.diary.today.length
          ? `<div class="rows">` + CRM.diary.today.map(e => `
              <div class="diary">
                <div class="t tnum">${esc(e.allDay ? "all day" : (e.time || ""))}</div>
                <div><div class="ti">${esc(e.title)}</div>
                ${e.location ? `<div class="wh">${esc(e.location)}</div>` : ""}</div>
              </div>`).join("") + `</div>`
          : '<div class="oneline">Nothing in the diary today.</div>');

  const fups = !CRM.live
    ? `<div class="oneline">Follow-ups live with the client book.</div>`
    : (CRM.followups.length
        ? `<div class="rows">` + CRM.followups.map(f => `
            <div class="fu">
              <div class="row-top">
                <button class="fu-name" data-open-client="${esc(f.client_id)}">${esc(f.client_name)}</button>
                <span class="fu-age ${f.overdue ? "over" : ""}">${esc(f.age)}</span>
              </div>
              <div class="fu-why">${esc(f.reason || "")}</div>
              <div class="btnrow">
                <button class="chip" data-clear-followup="${esc(f.id)}">Mark done</button>
                <button class="btn" data-open-client="${esc(f.client_id)}">Open card</button>
              </div>
            </div>`).join("") + `</div>`
        : '<div class="oneline">Nothing owed. Rare.</div>');

  const news = newsBlock(6, 4);

  const next = (REAL.events || []).slice(0, 3).map(e => {
    const d = new Date(e.starts + "T00:00:00");
    const day = `${String(d.getDate()).padStart(2, "0")} ${MON3[d.getMonth()]}`;
    return `<button class="row" data-nav="calendar">
      <div class="row-top"><span class="row-name">${esc(e.title || "Sale")}</span>${I(ICON.chev, 16)}</div>
      <div class="row-sub">${houseTag(e.house)} <span class="tnum">\u00b7 ${esc(day)}${e.city ? " \u00b7 " + esc(e.city) : ""}</span></div>
    </button>`;
  }).join("");

  /* ---- Today, to the mockup (spec §3) ----------------------------------- */
  const ranked = rankedStories();

  /* The top block is picture-led by design, so fill its three slots from the
     image-bearing stories first and only fall back to text when there are not
     three. Ranking still decides the order within each group — this breaks ties
     toward a story that can be seen, it does not promote a weak one. Stories
     reaching us through Google News never carry an image, so without this the
     lead frames render empty. */
  const withPic = ranked.filter(r => safeUrl(r.image));
  const noPic = ranked.filter(r => !safeUrl(r.image));
  const lead = [...withPic, ...noPic].slice(0, 3);
  const hero = lead[0];
  const seconds = lead.slice(1, 3);
  const rest = ranked.filter(r => !lead.includes(r));

  const due = CRM.live ? CRM.followups.length : 0;
  const closing = (REAL.events || []).filter(e => e.starts === todayIso()).length;
  const weekEnd = new Date(Date.parse(todayIso()) + 7 * 86400000).toISOString().slice(0, 10);
  const thisWeek = (REAL.events || []).filter(e => e.starts >= todayIso() && e.starts <= weekEnd).length;

  const stamp = (REAL.news || {}).generated_at || REAL.generated_at;
  const updated = stamp && String(stamp).length > 10
    ? "Updated " + String(stamp).slice(11, 16) + " UTC" : "";

  const markBtn = n => `<button class="mark ${isMarked(n) ? "on" : ""}" data-mark="${esc(markKey(n))}"
      aria-label="${isMarked(n) ? "Saved" : "Save"}" aria-pressed="${isMarked(n)}">${I(ICON.bookmark, 15)}</button>`;

  /* Hero: image with rank badge and category over it, then kicker, headline,
     summary and the reasons it ranked — the mockup's "Why it matters" line,
     except ours names the actual reason instead of promising an essay. */
  const heroCard = n => {
    if (!n) return `<div class="oneline">No headlines pulled yet.</div>`;
    const u = safeUrl(n.url), img = safeUrl(n.image), tag = newsTag(n);
    const inner = `
      ${img ? `<div class="hero-media">
          <img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.parentElement.remove()">
          <span class="rank">1</span>
          ${tag ? `<span class="hero-tag">${esc(tag)}</span>` : ""}
        </div>` : ""}
      <div class="hero-body">
        <div class="kicker">${esc(n.source)} \u00b7 ${esc(fmtDate(n.date))}</div>
        <h3 class="hero-head">${esc(n.headline)}</h3>
        ${n.why ? `<p class="hero-sum">${esc(n.why)}</p>` : ""}
        ${n.reasons.length ? `<div class="story-why">${n.reasons.map(r =>
          `<span class="why-chip ${esc(r.kind)}">${esc(r.label)}</span>`).join("")}</div>` : ""}
      </div>`;
    return `<div class="hero">${u
      ? `<a class="hero-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : inner}${markBtn(n)}</div>`;
  };

  const smallCard = (n, i) => {
    const u = safeUrl(n.url), img = safeUrl(n.image), tag = newsTag(n);
    const inner = `
      ${img ? `<div class="sc-media">
        <img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.parentElement.remove()">
        <span class="rank">${i + 2}</span>
        ${tag ? `<span class="hero-tag">${esc(tag)}</span>` : ""}
      </div>` : ""}
      <div class="sc-body">
        <div class="sc-meta">${img ? "" : `<span class="rank flat">${i + 2}</span>`}
          <span class="kicker">${esc(n.source)}</span></div>
        <h4>${esc(n.headline)}</h4>
      </div>`;
    return u ? `<a class="sc" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
             : `<div class="sc">${inner}</div>`;
  };

  /* Market Pulse. Four tiles, all from real rows. The mockup's "7-day Indian
     Modern momentum" is not among them on purpose: rule 1 forbids indexing on
     median price without minimum comparables in both windows, and a week never
     has them. "International fairs this week" has no source. */
  const above = (REAL.feed || []).filter(f => f.vs_est && f.vs_est.dir === "above").length;
  const withEst = (REAL.feed || []).filter(f => f.vs_est).length;
  const top = (REAL.feed || []).slice().sort((a, b) =>
    (b.vs_est ? b.vs_est.pct : -1) - (a.vs_est ? a.vs_est.pct : -1))[0];
  const pulse = [
    { i: ICON.rupee,  v: top ? top.price : "\u2014", l: "Top result", s: top ? top.artist : "no results yet" },
    { i: ICON.market, v: withEst ? Math.round(above / withEst * 100) + "%" : "\u2014", l: "Above high est.", s: `of ${withEst} priced lots` },
    { i: ICON.gavel,  v: String(thisWeek), l: "Sales this week", s: thisWeek ? "in the diary" : "none scheduled" },
    { i: ICON.globe,  v: String((REAL.events || []).length), l: "Sales ahead", s: "next three months" },
  ].map(t => `<div class="pulse"><span class="pi">${I(t.i, 15)}</span>
      <div class="pv tnum">${esc(t.v)}</div>
      <div class="pl">${esc(t.l)}</div>
      <div class="ps">${esc(t.s)}</div></div>`).join("");

  /* Watchlist. Real artists, real twelve-month move, real sparkline — and where
     the comparable count is too thin to quote a move, it says so instead of
     printing a number. */
  const watch = (REAL.trending || []).map(k => ARTISTS[k]).filter(Boolean).slice(0, 3);
  const watchRows = watch.length
    ? `<div class="rows">` + watch.map(a => {
        const d = a.stats.delta;
        return `<button class="wrow" data-open-artist="${esc(a.key)}">
          <span class="wn">${esc(a.name)}<span class="wr">${d
            ? esc(d) + " over 12 months"
            : "not enough comparable lots to quote a move"}</span></span>
          <span class="wspark" data-spark="${esc(a.key)}"></span>
        </button>`;
      }).join("") + `</div>`
    : `<div class="oneline">No artist has enough comparable lots in both windows to rank a move.</div>`;

  const dayRows = [
    due ? { i: ICON.clients, n: due, t: `follow-up${due === 1 ? "" : "s"} due`, nav: "clients" } : null,
    closing ? { i: ICON.gavel, n: closing, t: `auction${closing === 1 ? "" : "s"} closing today`, nav: "calendar" } : null,
    thisWeek ? { i: ICON.calendar, n: thisWeek, t: `sale${thisWeek === 1 ? "" : "s"} this week`, nav: "calendar" } : null,
  ].filter(Boolean);
  const yourDay = dayRows.length
    ? `<div class="rows">` + dayRows.map(r => `<button class="dayrow" data-nav="${r.nav}">
        <span class="di">${I(r.i, 15)}</span><span class="dt"><b class="tnum">${r.n}</b> ${esc(r.t)}</span>${I(ICON.chev, 15)}</button>`).join("") + `</div>`
    : `<div class="oneline">Nothing owed today.${CRM.live ? "" : " Sign in for the client book."}</div>`;

  const moreRows = rest.length
    ? `<div class="rows">` + rest.map(n => {
        const u = safeUrl(n.url), img = safeUrl(n.image);
        const body = `
          <div class="mf-body">
            <div class="kicker">${esc(n.source)} \u00b7 ${esc(fmtDate(n.date))}</div>
            <h4>${esc(n.headline)}</h4>
          </div>
          ${img ? `<img class="mf-img" src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}`;
        return `<div class="mf">${u
          ? `<a class="mf-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${body}</a>` : body}
          ${markBtn(n)}</div>`;
      }).join("") + `</div>`
    : `<div class="oneline">Nothing further today.</div>`;

  return `
    <div class="view-head">
      <span class="date tnum">${esc(todayLong())}</span>
      <h1>Good morning, Aashna</h1>
      <p>Your art-market briefing is ready.</p>
    </div>
    <div class="view-body">
      <div class="sec">${sectionHead("Top stories", updated)}
        ${heroCard(hero)}
        ${seconds.length ? `<div class="scrow">${seconds.map(smallCard).join("")}</div>` : ""}
      </div>

      <div class="sec">${sectionHead("Market pulse")}<div class="pulserow">${pulse}</div></div>

      <div class="sec">${sectionHead("Watchlist", "12-month move")}${watchRows}</div>

      <div class="sec">${sectionHead("Your day")}${yourDay}</div>

      <div class="cols two">
        <div class="col sec">${sectionHead("Today\u2019s diary")}${diary}</div>
        <div class="col sec">${sectionHead("Follow-ups due")}${fups}</div>
      </div>

      <div class="sec">${sectionHead("More from the art world", updated)}${moreRows}</div>
    </div>`;
}
