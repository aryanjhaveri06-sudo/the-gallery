    log: (d.log || []).map(l => ({ id: l.id, iso: l.happened || "", date: fmtDate(l.happened),
      channel: l.channel || "", note: l.note || "" })),
    followups: d.followups || [],
  } : null;

  /* Three different things used to print the same sentence and wait for ever:
     no collector chosen, one chosen whose record is still coming, and one whose
     record failed to arrive. Only the middle one is worth waiting on, and the
     last one is worth pressing. */
  if (CRM.live && !d) {
    const head = name => `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <h1>${esc(name)}</h1></div>`;
    if (!cid) {
      return head("Clients") + `<div class="view-body"><div class="empty">Pick a
        collector from the book${(CRM.clients || []).length ? "" : " \u2014 there is nobody in it yet"}.</div></div>`;
    }
    const name = (CRM.clients.find(x => x.id === cid) || {}).name || "Client";
    if (CRM.detailError[cid]) {
      const locked = CRM.detailError[cid] === LOCKED_OUT;
      return head(name) + `<div class="view-body"><div class="empty">
        ${esc(CRM.detailError[cid])}
        <div class="btnrow" style="justify-content:center;margin-top:14px">
          <button class="btn" data-act="retry-client" data-client="${esc(cid)}">Try again</button>
          ${locked ? `<button class="btn btn-primary" data-nav="unlock">Enter the desk key</button>` : ""}
        </div></div></div>`;
    }
    return head(name) + `<div class="view-body"><div class="empty">Opening the card\u2026</div></div>`;
  }

  // Reachable only if the book goes offline mid-session; say so rather than throw.
  if (!c) {
    return `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <h1>Client</h1></div>
      <div class="view-body"><div class="empty">The client book is not open on this device.</div></div>`;
  }

  const first = c.name.split(" ")[0];

  const refs = c.referrals.map(r => `<div class="ref"><b>${esc(r.name)}</b><br><span>${esc(r.tie)}</span></div>`).join("");

  const tpls = TEMPLATES.map((t, i) => {
    const open = S.openTemplate === i;
    // A prospect has no holdings, so there may be no artist to name — and the
    // estimate and the movement are per-lot facts this app does not hold. Leave
    // a blank she fills rather than a number she might paste into a client email.
    const blank = "\u2014\u2014\u2014\u2014";
    const body = t.body
      .replace(/\{\{first\}\}/g, first)
      .replace(/\{\{artist\}\}/g, (c.holdings[0] && c.holdings[0].artist) || blank)
      .replace(/\{\{estimate\}\}/g, blank)
      .replace(/\{\{delta\}\}/g, blank);
    return `<div class="tpl">
      <button class="tpl-hd" data-tpl="${i}" aria-expanded="${open}">
        <span class="n">${esc(t.name)}</span><span class="ac">${open ? "Close" : "Preview"}</span></button>
      ${open ? `<div class="tpl-body">${esc(body)}</div>` : ""}
    </div>`;
  }).join("");

  /* ---- inline editors -----------------------------------------------------
     Each one opens where the thing it edits already lives, so the record stays
     on screen while it is being changed. One panel at a time; cancelling throws
     the draft away without touching the record. */
  const g = S.draft || {};
  const fld = (k, label, ph, long) => `
    <div class="fld">
      <div class="label">${esc(label)}</div>
      ${long
        ? `<textarea data-ed="${k}" rows="4" placeholder="${esc(ph)}">${esc(g[k] == null ? "" : g[k])}</textarea>`
        : `<input data-ed="${k}" type="text" placeholder="${esc(ph)}" value="${esc(g[k] == null ? "" : g[k])}">`}
    </div>`;
  const dateFld = (k, label) => `
    <div class="fld">
      <div class="label">${esc(label)}</div>
      <input data-ed="${k}" type="date" value="${esc(g[k] || "")}">
    </div>`;
  const chips = (k, label, opts, attr) => `
    <div class="fld">
      <div class="label">${esc(label)}</div>
      <div class="chiprow">${opts.map(o =>
        `<button class="chip" ${attr}="${esc(o)}" aria-pressed="${(g[k] || "") === o}">${esc(o)}</button>`).join("")}</div>
    </div>`;

  const panel = (which, saveAct, saveLabel, fields) => S.panel !== which ? "" : `
    <div class="panel">
      ${fields}
      <div class="btnrow" style="margin-top:20px">
        <button class="btn btn-primary" data-act="${saveAct}">${esc(saveLabel)}</button>
        <button class="btn" data-panel="close">Cancel</button>
      </div>
      ${S.draftError ? `<div class="foot-note" style="color:var(--gold-ink)">${esc(S.draftError)}</div>` : ""}
    </div>`;

  // Editing an existing row reuses the same fields as adding one; only where the
  // panel appears and where it posts differ. S.panel carries "<kind>:<id>".
  const rowFields = kind =>
      kind === "holding" ? fld("artist_name", "Artist", "V. S. Gaitonde")
                         + fld("work", "Work", "Untitled, 1974")
                         + dateFld("acquired", "Acquired")
                         + fld("paid_inr", "Paid (\u20b9)", "Whole rupees; leave blank if not known")
    : kind === "log"     ? dateFld("happened", "When")
                         + chips("channel", "Channel", ["Call", "Email", "Viewing", "Meeting", "Sale", "Lunch", "WhatsApp"], "data-ed-channel")
                         + fld("note", "What was said", "Keep it factual \u2014 this is the record.", true)
    :                      dateFld("due", "Due")
                         + fld("reason", "What is owed", "Send the November comparables.", true);

  const rowPanel = (kind, rid) => S.panel !== `${kind}:${rid}` ? "" : `
    <div class="panel">
      ${rowFields(kind)}
      <div class="btnrow" style="margin-top:20px">
        <button class="btn btn-primary" data-act="save-row">Save changes</button>
        <button class="btn" data-panel="close">Cancel</button>
      </div>
      ${S.draftError ? `<div class="foot-note" style="color:var(--gold-ink)">${esc(S.draftError)}</div>` : ""}
    </div>`;

  // Two taps to delete: the first arms the chip, the second does it. Cheaper
  // than a modal and it cannot be triggered by one stray tap on a small screen.
  const rowActions = (kind, rid) => {
    const armed = S.confirmDelete === `${kind}:${rid}`;
    return `<div class="btnrow row-actions">
      <button class="chip" data-edit-row="${kind}:${esc(rid)}">Edit</button>
      <button class="chip${armed ? " danger" : ""}" data-del-row="${kind}:${esc(rid)}">${armed ? "Really delete?" : "Delete"}</button>
    </div>${rowPanel(kind, rid)}`;
  };

  const editPanel = panel("client", "save-edit", "Save changes",
      fld("name", "Name", "Full name")
    + fld("title", "Title", "Trustee, Nanda Family Collection")
    + fld("city", "City", "Mumbai")
    + chips("tier", "Tier", ["Principal", "Senior", "Growth"], "data-ed-tier")
    + fld("since", "Client since", "2019")
    + fld("lifetime_inr", "Lifetime with the house (\u20b9)", "Whole rupees; leave blank if unknown")
    + fld("focus", "Collecting focus", "Moderns, trophy")
    + fld("wants", "Looking for", "Comma separated \u2014 Gaitonde, works on paper")
    + fld("brief", "Collecting brief", "How they buy, and what they will not consider.", true)
    + fld("next_when", "Next action \u2014 when", "Before the November sale")
    + fld("next_what", "Next action \u2014 what", "What you owe them next"));

  const holdingPanel = panel("holding", "save-holding", "Add holding",
      fld("artist_name", "Artist", "V. S. Gaitonde")
    + fld("work", "Work", "Untitled, 1974")
    + dateFld("acquired", "Acquired")
    + fld("paid_inr", "Paid (\u20b9)", "Whole rupees; leave blank if not known"));

  const logPanel = panel("log", "save-log", "Save note",
      dateFld("happened", "When")
    + chips("channel", "Channel", ["Call", "Email", "Viewing", "Meeting", "Sale", "Lunch", "WhatsApp"], "data-ed-channel")
    + fld("note", "What was said", "Keep it factual \u2014 this is the record.", true));

  const followupPanel = panel("followup", "save-followup", "Set follow-up",
      dateFld("due", "Due")
    + fld("reason", "What is owed", "Send the November comparables.", true));

  /* The row lists are built here, below rowActions, because they use it. A row
     cannot be a <button> wrapping more <button>s, so the actions sit beside the
     row rather than inside it. */
  const holdings = c.holdings.map(h => {
    const ak = artistKeyByName(h.artist);
    return `<div>
      <button class="row hold" ${ak ? `data-open-artist="${ak}"` : ""}>
        <div class="row-top"><span class="a">${esc(h.artist)}</span>${ak ? I(ICON.chev, 15) : ""}</div>
        <div class="w"><em>${esc(h.work)}</em> \u00b7 <span class="tnum">${esc(h.acquired)}</span></div>
      </button>
      ${rowActions("holding", h.id)}
    </div>`;
  }).join("");

  const log = c.log.map(l => `<div class="log">
    <div><div class="d tnum">${esc(l.date)}</div><div class="ch">${esc(l.channel)}</div></div>
    <div class="nt">${esc(l.note)}${rowActions("log", l.id)}</div></div>`).join("");

  const today = todayIso();
  const fuRows = c.followups.length
    ? `<div class="rows">` + c.followups.map(f => `
        <div class="log">
          <div>
            <div class="d tnum">${esc(fmtDate(f.due))}</div>
            <div class="ch">${f.done ? "done" : (f.due < today ? "overdue" : "open")}</div>
          </div>
          <div class="nt">${esc(f.reason || "")}
            <div class="btnrow row-actions">
              <button class="chip" data-card-followup="${esc(f.id)}">${f.done ? "Reopen" : "Mark done"}</button>
              <button class="chip" data-edit-row="followup:${esc(f.id)}">Edit</button>
              <button class="chip${S.confirmDelete === `followup:${f.id}` ? " danger" : ""}" data-del-row="followup:${esc(f.id)}">${S.confirmDelete === `followup:${f.id}` ? "Really delete?" : "Delete"}</button>
            </div>
            ${rowPanel("followup", f.id)}
          </div>
        </div>`).join("") + `</div>`
    : `<div class="empty">Nothing owed.</div>`;

  /* ---- the handoff's four tabs -------------------------------------------
     Overview / Interests / Activity / Notes. The fourth is Templates here: the
     desk has no freeform-notes field, and an empty tab is worse than a useful
     one — the message templates were homeless at the bottom of the card and
     this is where they belong. Everything else maps onto a tab that already
     had a section, and every editor moved with the thing it edits. */

  // At a glance, from the record and nothing else. Budget and Source are in the
  // handoff and not in the tracker she gave us, so they are simply not here.
  const lastLog = c.log[0];
  const daysAgo = lastLog && lastLog.iso
    ? Math.round((Date.parse(todayIso()) - Date.parse(lastLog.iso)) / 86400000) : null;
  const glance = [
    ["Tier", c.tier],
    ["Collecting focus", c.focus],
    ["Looking for", c.wants.join(", ")],
    ["Client since", c.since],
    ["Lifetime with the house", c.lifetime === "—" ? "" : c.lifetime],
    ["Works recorded", c.holdings.length ? String(c.holdings.length) : ""],
    ["Last contact", lastLog
      ? lastLog.date + (daysAgo == null ? "" : daysAgo === 0 ? " (today)"
          : ` (${daysAgo} ${daysAgo === 1 ? "day" : "days"} ago)`)
      : ""],
    ["Follow-ups open", String(c.followups.filter(f => !f.done).length)],
  ].filter(([, v]) => v !== "" && v != null);

  const glanceRows = `<div class="glance">${glance.map(([k, v]) =>
    `<div class="gr"><span class="gk">${esc(k)}</span><span class="gv">${esc(v)}</span></div>`).join("")}</div>`;

  /* The handoff's "Latest relevant update" — the top-scoring story that actually
     matches this collector, by the same matcher that draws the client chip. No
     story rather than a loose one. */
  const rel = allStories()
    .filter(n => wantsMatchStory({ focus: c.focus, wants: c.wants },
      ((n.headline || "") + " " + (n.why || "")).toLowerCase(), n.artists || []))
    .sort((a, b) => b.score - a.score || byDateDesc(a, b))[0];

  const update = rel ? `
    <div class="sec">${sectionHead("Latest relevant update")}
      ${storyCard(rel)}</div>` : "";

  const overview = `
    ${(c.next.when || c.next.what) ? `
    <div class="accent-box">
      <div class="when">${esc(c.next.when || "Next")}</div>
      ${c.next.what ? `<div class="what">${esc(c.next.what)}</div>` : ""}
    </div>` : ""}
    <div class="btnrow">
      <button class="btn btn-primary" data-act="pitch-for" data-client="${esc(cid)}">Draft a pitch</button>
      <button class="btn" data-panel="client">Edit card</button>
      <button class="btn" data-nav="knowledge" data-know="scripts">Objection scripts</button>
    </div>
    ${editPanel}
    <div class="sec">${sectionHead("At a glance")}${glanceRows}</div>
    ${update}
    <div class="sec">${sectionHead("Follow-ups", c.followups.filter(f => !f.done).length + " open")}
      ${fuRows}
      <div class="btnrow"><button class="chip" data-panel="followup">Set a follow-up</button></div>
      ${followupPanel}</div>`;

  const interests = `
    <div class="sec" style="margin-top:0">${sectionHead("Looking for", c.wants.length ? String(c.wants.length) : "")}
      ${c.wants.length ? `<div class="tags">${c.wants.map(w => `<span class="tag">${esc(w)}</span>`).join("")}</div>`
                       : `<div class="oneline">Nothing recorded. Edit the card to add it.</div>`}</div>
    <div class="sec">${sectionHead("Collecting brief")}
      ${c.brief ? `<div class="brief-p">${esc(c.brief)}</div>`
                : `<div class="oneline">No brief written yet.</div>`}</div>
    <div class="sec">${sectionHead("Holdings", c.holdings.length + " works")}
      <div class="rows">${holdings}</div>
      ${c.holdings.length ? "" : `<div class="empty">Nothing recorded yet.</div>`}
      <div class="btnrow"><button class="chip" data-panel="holding">Add a holding</button></div>
      ${holdingPanel}</div>
    <div class="sec">${sectionHead("Referral web")}<div class="rows">${refs}</div>
      ${c.referrals.length ? "" : `<div class="empty">No referrals recorded.</div>`}</div>`;

  const activity = `
    <div class="sec" style="margin-top:0">${sectionHead("Conversation log", c.log.length + " entries")}
      <div class="rows">${log}</div>
      ${c.log.length ? "" : `<div class="empty">Nothing logged yet.</div>`}
      <div class="btnrow"><button class="chip" data-panel="log">Log a conversation</button></div>
      ${logPanel}</div>`;

  const templates = `
    <div class="sec" style="margin-top:0">${sectionHead("Message templates", TEMPLATES.length + "")}
      <div class="rows">${tpls}</div>
      <div class="foot-note">A blank in a template is a fact the desk does not
        hold. It stays blank rather than being filled with a plausible number.</div></div>`;

  const body = S.clientTab === "interests" ? interests
    : S.clientTab === "activity" ? activity
    : S.clientTab === "templates" ? templates
    : overview;

  return `
    <div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <div class="card-head">
        <div class="ch-id">
          <span class="ch-av">${esc(initials(c.name))}</span>
          <div>
            <h1>${esc(c.name)}</h1>
            <div class="ti">${[c.title, c.city].filter(Boolean).map(esc).join(" · ") || esc(c.tier)}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="view-body" ${embedded ? 'style="padding-left:0"' : ""}>
      <div class="seg seg-tabs">
        ${CLIENT_TABS.map(([k, l]) =>
          `<button data-client-tab="${k}" aria-pressed="${S.clientTab === k}">${esc(l)}</button>`).join("")}
      </div>
      <div style="margin-top:20px">${body}</div>
    </div>`;
}

const CLIENT_TABS = [["overview", "Overview"], ["interests", "Interests"],
                     ["activity", "Activity"], ["templates", "Templates"]];

/* Opening a panel has to bring its tab with it, or the editor renders on a tab
   that is not showing and the tap looks dead. */
const PANEL_TAB = { client: "overview", followup: "overview",
                    holding: "interests", log: "activity" };

/* ============================================================
   SCREEN: KNOWLEDGE
   ============================================================ */
function viewKnowledge() {
  const scripts = `<div class="rows">` + OBJECTIONS.map((o, i) => {
    const open = S.openObjection === i;
    return `<div>
      <button class="obj-q" data-obj="${i}" aria-expanded="${open}">
        <span class="q">“${esc(o.q)}”</span><span class="mk">${open ? "−" : "+"}</span></button>
      ${open ? `<div class="obj-a"><p>${esc(o.answer)}</p><div class="proof">Proof to hand: ${esc(o.proof)}</div></div>` : ""}
    </div>`;
  }).join("") + `</div>`;

  const pitch = !CRM.live
    ? `<div class="empty">The pitch generator drafts against a named collector, so
        it needs the client book. Sign in on the private site.</div>`
    : !CRM.clients.length
      ? `<div class="empty">Add a client first, then a pitch can be drafted for them.</div>`
      : (() => {
          const c = CRM.clients.find(x => x.id === S.pitchClient) || CRM.clients[0];
          // The chip handler loads the collector it was tapped for; nothing was
          // loading the one this falls back to, so the first pitch she saw was
          // drafted as if that collector owned nothing.
          if (!CRM.detail[c.id] && !CRM.detailBusy[c.id] && !CRM.detailError[c.id]) ensureDetail(c.id);
          const held = (CRM.detail[c.id] || {}).holdings || [];
          const wants = (c.wants || []).join(", ");
          const matched = REAL.feed.filter(f =>
            held.some(h => h.artist_key && h.artist_key === f.artist_key)).slice(0, 3);

          /* The template is the default and stays the default: it is built from
             records and cannot say anything the desk does not hold. Mistral is
             an optional second pass over the same facts, kept for this session
             only — nothing generated is written to D1. */
          const written = S.aiDrafts[c.id];
          const busy = S.aiBusy === c.id;

          const body = written
            ? esc(written.draft)
            : `Dear ${esc(c.name.split(" ")[0])},

${c.brief ? esc(c.brief.split(".")[0]) + "." : "A short note on the market you collect."}

${matched.length
  ? "Recent results in the names you already hold:\n" + matched.map(m =>
      `\u00b7 ${esc(m.artist)} \u2014 ${esc(m.title || "Untitled")}, ${esc(m.price)}${m.above ? " (above high estimate)" : ""}`).join("\n")
  : "I will send comparables as soon as the next relevant lots are catalogued."}
${wants ? "\nStill looking for: " + esc(wants) + "." : ""}`;

          const drafter = !CRM.ai ? "" : `
            <div class="ai-bar">
              <button class="btn btn-primary" data-act="ai-pitch" data-client="${esc(c.id)}"
                      ${busy ? "disabled" : ""}>
                ${busy ? "Drafting\u2026" : written ? "Draft again" : "Write it out"}</button>
              ${written ? `<button class="btn" data-act="ai-clear" data-client="${esc(c.id)}">Back to the template</button>` : ""}
            </div>
            ${S.aiError && S.aiBusy !== c.id ? `<div class="ai-note ai-bad">${esc(S.aiError)}</div>` : ""}`;

          return `
            <div class="chiprow">${CRM.clients.map(x =>
              `<button class="chip" data-pitch="${esc(x.id)}" aria-pressed="${c.id === x.id}">${esc(x.name)}</button>`).join("")}</div>
            ${drafter}
            <div class="pitch">
              <span class="kicker">${written ? `Written for ${esc(c.name)}` : `Drafted for ${esc(c.name)}`}</span>
              <h3>${esc(c.focus ? `Where the ${c.focus.split(",")[0].trim()} market has moved` : "What has moved since we last spoke")}</h3>
              <div class="bd">${body}</div>
              <div class="foot-note">${written
                ? `Written by ${esc(written.model)} from the record, and every figure in it checked back against the record \u2014 read it before you send it.`
                : "Drafted from the live record \u2014 read it before you send it."}</div>
            </div>`;
        })();

  const head = `<div class="view-head"><h1>Knowledge</h1>
    <p>Scripts, and a pitch drafted per collector</p></div>`;

  if (isSplit) {
    return head + `<div class="view-body"><div class="cols two">
      <div class="col sec">${sectionHead("Objection handling", OBJECTIONS.length + " scripts")}${scripts}</div>
      <div class="col sec">${sectionHead("Pitch generator")}${pitch}</div>
    </div></div>`;
  }

  return head + `<div class="view-body">
    <div class="seg">
      <button data-know="scripts" aria-pressed="${S.knowTab === "scripts"}">Objection scripts</button>
      <button data-know="pitch" aria-pressed="${S.knowTab === "pitch"}">Pitch generator</button>
    </div>
    <div class="sec" style="margin-top:22px">
      ${S.knowTab === "scripts"
        ? sectionHead("Objection handling", OBJECTIONS.length + " scripts") + scripts
        : sectionHead("Pitch generator") + pitch}
    </div>
  </div>`;
}

/* ============================================================
   SCREEN: ASK AG

   One question, one answer, over the desk's own records. The retrieval is
   deterministic — the browser sends the market slice it already holds, the
   Worker adds the book, the diary and the news — so a question costs exactly
   one Mistral call. The free tier is rate limited to about a request a minute;
   an agent that thought in four round-trips would be unusable.
   ============================================================ */
const ASK_SUGGESTIONS = [
  "What is on this week?",
  "Who should I call today?",
  "Round up the art news.",
  "Which collectors are waiting on me?",
  "What has moved at auction lately?",
];

/* What the browser contributes: the market data it already has in REAL, cut
   down to what the question could plausibly need. The Worker has D1 and the
   news feeds but not app_data, and shipping 380KB per question would be absurd.

   sell_through is deliberately absent — rule 4 says it is not derivable, it
   reads ~100%, and it is false. The Worker refuses it as a second lock. */
function askMarketSlice(question) {
  const q = " " + question.toLowerCase().replace(/[^a-z0-9 ]/g, " ") + " ";
  const named = artistKeys.filter(k => {
    const a = ARTISTS[k];
    if (!a) return false;
    if (q.includes(" " + k + " ")) return true;
    // Surnames at four characters, with the stop list — five excluded Raza.
    return a.name.toLowerCase().replace(/[^a-z ]/g, "").split(/\s+/)
      .some(w => w.length >= 4 && !SURNAME_STOP.has(w) && q.includes(" " + w + " "));
  }).slice(0, 6);

  const stat = k => {
    const a = ARTISTS[k], st = (a && a.stats) || {};
    return {
      name: a.name,
      lots: st.lots_total,
      median: st.median_12mo || st.median_all || null,
      high: st.high || null,
      // delta_12mo is null whenever there were not enough comparables. Sending
      // the null and letting the model say "not recorded" is right; sending a
      // number derived from four lots is exactly what rule 1 forbids.
      move: st.delta_12mo != null ? st.delta_12mo + "%" : null,
    };
  };

  const lot = l => ({ date: l.date, house: l.house, artist: l.artist,
                      title: l.title, price: l.price, est: l.est, above: !!l.above });

  // Lots for anyone named, then the newest results as general background.
  const byName = named.length
    ? REAL.feed.filter(f => named.some(k => (f.artist_key === k)
        || (f.artist || "").toLowerCase() === ARTISTS[k].name.toLowerCase())).slice(0, 14)
    : [];
  const recent = REAL.feed.slice(0, byName.length ? 8 : 18);
  const seen = new Set();
  const lots = [...byName, ...recent].filter(l => {
    const k = l.date + "|" + l.artist + "|" + l.price;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).map(lot);

  return {
    generated_at: REAL.generated_at,
    coverage: { lots: REAL.coverage.lots, houses: REAL.coverage.houses,
                artists: REAL.coverage.artists_tracked },
    artists: named.map(stat),
    lots,
  };
}

/* The news the assistant is allowed to talk about.
 *
 * Three things she asked for, all of them decided HERE rather than hoped for in
 * the prompt — a model told to "prefer relevant stories" will drift, a list that
 * arrives already ordered cannot.
 *
 *   1. Client-relevant first. scoreStory() already computes that (it is what
 *      draws the "3 clients in the book" chip on Today), so this reuses it
 *      rather than growing a second, drifting copy of the same rules.
 *   2. Nothing older than a month. Filtered, not requested.
 *   3. Links. The URL never passes through the model — every story goes in
 *      numbered, the model cites [3], and the browser turns [3] back into an
 *      anchor from its own record. A model cannot fabricate a link it was never
 *      asked to reproduce.
 */
const ASK_NEWS_MAX_AGE_DAYS = 31;

function askNewsSlice() {
  const now = Date.now();
  const pool = [...(((REAL.news || {}).on_market) || []),
                ...(((REAL.news || {}).wider) || [])];

  const scored = [];
  for (const n of pool) {
    if (!n || !n.headline) continue;
    const t = Date.parse((n.date || "") + "T00:00:00");
    if (!Number.isFinite(t)) continue;                       // undated cannot be aged
    const days = (now - t) / 86400000;
    if (days > ASK_NEWS_MAX_AGE_DAYS || days < -1) continue; // her month rule

    const sc = scoreStory(n);
    // scoreStory reports how MANY clients matched; the assistant is more use if
    // it can say who, so name them from the same test.
    const hay = ((n.headline || "") + " " + (n.why || "")).toLowerCase();
    const who = (CRM.live && CRM.clients ? CRM.clients : [])
      .filter(c => wantsMatchStory(c, hay, sc.artists))
      .map(c => c.name);
    scored.push({ n, score: sc.score, who, days: Math.round(days),
                  artists: sc.artists.map(k => ARTISTS[k].name) });
  }

  // Client-relevant first — most collectors, then score. Everything else after.
  scored.sort((a, b) =>
    (b.who.length > 0) - (a.who.length > 0) ||
    b.who.length - a.who.length ||
    b.score - a.score);

  return scored.slice(0, 24).map((x, i) => ({
    n: i + 1,                                   // the citation handle
    date: x.n.date,
    source: x.n.source,
    headline: x.n.headline,
    url: safeUrl(x.n.url) || "",                // checked here, not trusted later
    clients: x.who.slice(0, 6),
    artists: x.artists.slice(0, 3),
    age_days: x.days,
  }));
}

function viewAsk() {
  if (!CRM.live || !CRM.ai) {
    const why = !CRM.live
      ? `Ask AG reads her diary, her client book and the market data together, so it
         needs the private desk. Sign in on the private site.`
      : `No drafter is configured on this desk. Set <code>MISTRAL_API_KEY</code> as a
         Pages secret and Ask AG Newsroom appears on the next load.`;
    return `<div class="view-head"><h1>Ask AG Newsroom</h1>
      <p>Your art-market analyst</p></div>
      <div class="view-body"><div class="sec"><div class="empty">${why}</div></div></div>`;
  }

  const thread = S.askLog.map(m => m.role === "user"
    ? `<div class="ask-q">${esc(m.content)}</div>`
    : `<div class="ask-a">
         ${m.unverified && m.unverified.length ? `<div class="ask-warn">
           Not from the record: ${m.unverified.map(f => esc(f)).join(", ")}. Check
           ${m.unverified.length === 1 ? "it" : "them"} before you use ${m.unverified.length === 1 ? "it" : "them"}.</div>` : ""}
         <div class="ask-body">${askBody(m)}</div>
         ${askCitedList(m)}
         ${(m.sources || []).length ? `<div class="ask-src">${
            m.sources.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
       </div>`).join("");

  const intro = S.askLog.length ? "" : `
    <div class="ask-intro">
      <h2>Ask AG Newsroom</h2>
      <div class="sub">Your art-market analyst</div>
      <p>It reads the records the rest of the desk shows you: the diary and sale
      calendar, the client book, the live headlines, and the auction results
      behind Market. It answers only from those, and anything in an answer that
      is not traceable to them is marked.</p>
      <div class="ask-chips">${ASK_SUGGESTIONS.map(t =>
        `<button data-ask-sugg="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    </div>`;

  const busy = S.askBusy ? `<div class="ask-a ask-thinking"><div class="ask-body">Reading the desk\u2026</div></div>` : "";
  const err = S.askError ? `<div class="ask-err">${esc(S.askError)}</div>` : "";

  return `<div class="ask-screen">
    <div class="ask-scroll" id="askScroll">
      ${intro}${thread}${busy}${err}
    </div>

    <div class="ask-foot">
      <button class="chip" data-act="ask-book" aria-pressed="${S.askBook}">
        ${S.askBook ? "Client book included" : "Client book withheld"}</button>
      ${S.askLog.length ? `<button class="chip" data-act="ask-clear">Clear</button>` : ""}
      <span class="ask-note">${S.askBook
        ? "Her collectors\u2019 names, holdings and notes go to Mistral with each question."
        : "Only the market, the calendar and the news go to Mistral."}</span>
    </div>

    <form class="ask-form" data-act="ask-send">
      <textarea class="ask-input" name="q" rows="1" placeholder="Ask anything..."
        ${S.askBusy ? "disabled" : ""}>${esc(S.askInput)}</textarea>
      <button class="ask-send" type="submit" aria-label="Send" ${S.askBusy ? "disabled" : ""}>
        ${I(`<path d="M3 12l18-9-9 18-2-8-7-1z" fill="currentColor" stroke="none"/>`, 15)}</button>
    </form>
  </div>`;
}

/* ============================================================
   SCREEN: CALENDAR
   ============================================================ */
/* A sale's own summary, opened by tapping its row.
 *
 * Everything here is read off the record — the dates, the house, the lot count —
 * plus one thing worth knowing that the row cannot show: how that house has
 * actually been performing on this desk lately. No forecast, no commentary:
 * §11 applies here as much as anywhere. */
const evKey = e => `${e.starts}|${e.house}|${(e.title || "").slice(0, 40)}`;

function houseRecord(house) {
  const lots = (REAL.feed || []).filter(f => f.house === house);
  if (!lots.length) return null;
  return { n: lots.length, above: lots.filter(f => f.above).length };
}

function eventSummary(e) {
  const start = new Date(e.starts + "T00:00:00");
  const end = e.ends && e.ends !== e.starts ? new Date(e.ends + "T00:00:00") : null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((start - today) / 86400000);
  const when = days < 0 ? "under way or just closed"
    : days === 0 ? "today"
    : days === 1 ? "tomorrow"
    : days <= 7 ? `in ${days} days, this week`
    : `in ${days} days`;

  const long = d => d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const rec = houseRecord(e.house);

  const facts = [
    ["When", (end ? `${long(start)} to ${long(end)}` : long(start)) + ` \u00b7 ${when}`],
    ["Where", [e.city, e.kind].filter(Boolean).join(" \u00b7 ") || "Not stated"],
    e.lot_count ? ["Size", `${e.lot_count} lots catalogued`] : null,
    rec ? ["This house on the desk",
      `${rec.n} recent ${rec.n === 1 ? "result" : "results"} recorded`
      + (rec.above ? `, ${rec.above} above the high estimate` : ", none above the high estimate")] : null,
    String(e.id || "").startsWith("manual:") ? ["Source", "Added by hand \u2014 not from a house feed"] : null,
  ].filter(Boolean);

  return `<div class="ev-sum">
    <dl>${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${safeUrl(e.url)
      ? `<a class="chip" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">Open the catalogue</a>`
      : `<div class="ev-nocat">No catalogue link published for this sale yet.</div>`}
  </div>`;
}

/* One row shape for both the day detail and the forthcoming list, so the two
   cannot drift. `lead` is whatever that list puts above the house tag. */
function eventRow(e, lead) {
  const k = evKey(e);
  const open = S.calEvent === k;
  const multi = e.ends && e.ends !== e.starts;
  return `<div class="ev${open ? " open" : ""}">
    <button class="ev-hit" data-cal-ev="${esc(k)}" aria-expanded="${open}">
      ${lead || ""}
      ${houseTag(e.house)}
      <div class="ti">${esc(e.title || "Sale")}</div>
      <div class="ci">${[e.city, e.kind, multi ? `${fmtDate(e.starts)}\u2013${fmtDate(e.ends)}` : ""]
        .filter(Boolean).map(esc).join(" \u00b7 ")}</div>
      ${e.lot_count ? `<div class="nt tnum">${e.lot_count} lots${(e.names || []).length ? " \u00b7 " + esc(e.names.slice(0, 3).join(", ")) : ""}</div>` : ""}
    </button>
    <div class="rs">${I(ICON.chev, 15)}</div>
    ${open ? eventSummary(e) : ""}
  </div>`;
}

function viewCalendar() {
  const all = (REAL.events || []).slice();
  // The filter chips used to sit over an authored "fairs and previews" list.
  // The houses are read from the sales themselves, so the chips can never
  // offer a house that has nothing in the diary.
  const houses = [...new Set(all.map(e => e.house).filter(Boolean))].sort();
  const active = houses.includes(S.calFilter) ? S.calFilter : "All";
  const evs = active === "All" ? all : all.filter(e => e.house === active);

  const filterChips = houses.length > 1 ? `
    <div class="chiprow" style="padding-top:0">
      ${["All", ...houses].map(h =>
        `<button class="chip" data-cal="${esc(h)}" aria-pressed="${active === h}">${esc(h)}</button>`).join("")}
    </div>` : "";

  /* ---- the month grid ------------------------------------------------------
     Sales are not all one-day: her own September dates run two days each, so a
     sale is painted on every day it covers, not just the day it opens. */
  const houseClass = h => {
    const k = String(h || "").toLowerCase().replace(/[^a-z]/g, "");
    return ["astaguru", "saffronart", "pundoles", "giftex"].includes(k) ? "h-" + k : "h-other";
  };
  const iso = (y, m, d) =>
    `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  const byDate = {};
  evs.forEach(e => {
    if (!e.starts) return;
    const start = new Date(e.starts + "T00:00:00");
    if (isNaN(start)) return;
    let end = new Date((e.ends || e.starts) + "T00:00:00");
    // data/manual_events.json is hand-edited, and no sale runs for a month. An
    // end date typed as 2036 instead of 2026 would otherwise spin this loop
    // three thousand times; 9999 would hang the tab outright. Bound it.
    if (isNaN(end) || end < start) end = start;
    const cap = new Date(start); cap.setDate(cap.getDate() + 30);
    if (end > cap) end = cap;
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const k = iso(d.getFullYear(), d.getMonth(), d.getDate());
      (byDate[k] = byDate[k] || []).push(e);
    }
  });

  const todayKey = todayIso();
  const anchor = new Date(todayKey + "T00:00:00");
  const base = new Date(anchor.getFullYear(), anchor.getMonth() + (S.calMonth || 0), 1);
  const yr = base.getFullYear(), mo = base.getMonth();
  const monthLabel = base.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const daysInMonth = new Date(yr, mo + 1, 0).getDate();
  const startPad = (new Date(yr, mo, 1).getDay() + 6) % 7;   // weeks start Monday

  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const k = iso(yr, mo, d);
    cells.push({ d, key: k, list: byDate[k] || [] });
  }
  while (cells.length % 7) cells.push(null);

  const cellHtml = c => {
    if (!c) return `<div class="cal-cell pad"></div>`;
    const shown = c.list.slice(0, 3);
    const extra = c.list.length - shown.length;
    const cls = ["cal-cell", c.list.length ? "has" : "",
                 S.calDay === c.key ? "sel" : "", c.key === todayKey ? "today" : ""]
      .filter(Boolean).join(" ");
    const inner = `
      <div class="hd">
        <span class="dn">${c.d}</span>
        ${c.key === todayKey ? `<span class="cal-now">Today</span>` : ""}
      </div>
      ${shown.map(e => `
        <div class="cal-ev">
          <span class="cal-dot ${houseClass(e.house)}"></span>
          <span class="t">${esc(e.title || "Sale")}</span>
        </div>`).join("")}
      ${extra > 0 ? `<div class="cal-more">+${extra} more</div>` : ""}`;
    return c.list.length
      ? `<button class="${cls}" data-cal-day="${c.key}" aria-pressed="${S.calDay === c.key}">${inner}</button>`
      : `<div class="${cls}">${inner}</div>`;
  };

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

  const grid = `
    <div class="cal-head">
      <h3 class="cal-title">${esc(monthLabel)}</h3>
      <div class="cal-nav">
        <button class="chip" data-cal-nav="prev" aria-label="Previous month">\u2039</button>
        <button class="chip" data-cal-nav="today">Today</button>
        <button class="chip" data-cal-nav="next" aria-label="Next month">\u203a</button>
      </div>
    </div>
    ${filterChips}
    <div class="cal-dows">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
      .map(d => `<div class="cal-dow">${d}</div>`).join("")}</div>
    ${weeks.map(w => `<div class="cal-week">${w.map(cellHtml).join("")}</div>`).join("")}
    <div class="cal-legend">
      ${(houses.length ? houses : ["\u2014"]).map(h =>
        `<span class="k"><span class="cal-dot ${houseClass(h)}"></span>${esc(h)}</span>`).join("")}
      <span style="margin-left:auto">${evs.length} forthcoming \u00b7 tap a day for the detail</span>
    </div>`;

  /* ---- the selected day ---------------------------------------------------- */
  const selList = S.calDay ? (byDate[S.calDay] || []) : [];
  const dayDetail = !selList.length ? "" : `
    <div class="cal-day-detail">
      <div class="label">${esc(new Date(S.calDay + "T00:00:00")
        .toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</div>
      <div class="rows">${selList.map(e => eventRow(e)).join("")}</div>
    </div>`;

  const byMonth = {};
  evs.forEach(e => {
    const d = new Date(e.starts + "T00:00:00");
    const k = d.toLocaleString("en-GB", { month: "long", year: "numeric" });
    (byMonth[k] = byMonth[k] || []).push(e);
  });

  const real = Object.keys(byMonth).length ? Object.entries(byMonth).map(([m, list]) => `
    <div class="month">${esc(m)}</div>
    <div class="rows">${list.map(e => {
      const d = new Date(e.starts + "T00:00:00");
      const day = `${String(d.getDate()).padStart(2, "0")} ${MON3[d.getMonth()]}`;
      return eventRow(e, `<div class="day tnum">${esc(day)}</div>`);
    }).join("")}</div>`).join("")
    : (active === "All"
        ? '<div class="empty">No sale is currently scheduled at the houses we track. New dates appear here as the houses publish them.</div>'
        : `<div class="empty">Nothing scheduled at ${esc(active)}.</div>`);

  return `<div class="view-head"><h1>Calendar</h1>
      <p>${evs.length} forthcoming ${evs.length === 1 ? "sale" : "sales"} \u00b7 ${esc(listOf(REAL.coverage.houses))}</p></div>
    <div class="view-body">
      <div class="sec" style="margin-top:8px">${grid}${dayDetail}</div>

      <div class="sec">${sectionHead("All forthcoming", evs.length === all.length ? "" : `${evs.length} of ${all.length}`)}${real}</div>

      <div class="sec">${sectionHead("Add to her calendar")}
        <div class="btnrow" style="margin-top:16px">
          <a class="btn btn-primary" href="calendar.ics">Download .ics</a>
          <a class="btn" href="${esc(location.href.replace(/[^/]*$/, ""))}calendar.ics">Feed URL</a>
        </div>
        <div class="foot-note">Subscribe rather than download and the sales keep arriving on their own: Settings \u2192 Calendar \u2192 Accounts \u2192 Add Account \u2192 Other \u2192 Add Subscribed Calendar, and paste the feed URL. Apple re-checks it for you.</div>
      </div>

    </div>`;
}

/* This was a sheet over the page that searched artists and nothing else. The
   handoff makes it a screen with grouped, counted sections, and every group it
   asks for has a real source here except two:

     "Upcoming lots"  — no house publishes a lot list for a sale that has not
                        happened, so this searches forthcoming SALES instead.
     "User notes"     — the desk has no notes entity. What it does have is her
                        own writing: follow-up reasons and logged conversations.
                        That is the group, named for what it is.

   Both client groups are behind the desk key and simply absent without it. */
const searchHit = (q, ...vals) => {
  const hay = vals.filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
};

function searchGroups(q) {
  const g = [];
  const artists = artistKeys.filter(k =>
    searchHit(q, A(k).name, A(k).movement, A(k).years)).slice(0, 12);
  if (artists.length) g.push({ label: "Artist", n: artists.length,
    html: `<div class="rows arows">${artists.map(k => {
      const a = A(k);
      return `<button class="arow" data-open-artist="${esc(k)}">
        <span class="av">${esc(initials(a.name))}</span>
        <span class="ab"><span class="an">${esc(a.name)}</span>
          <span class="ay">${esc([a.years, a.movement].filter(Boolean).join(" · "))}</span></span>
      </button>`;
    }).join("")}</div>` });

  const news = allStories().filter(n =>
    searchHit(q, n.headline, n.source, n.why)).sort(byDateDesc).slice(0, 8);
  if (news.length) g.push({ label: "News", n: news.length,
    html: `<div class="rows">${news.map(storyCard).join("")}</div>` });

  const lots = (REAL.feed || []).filter(f =>
    searchHit(q, f.artist, f.title, f.house, f.medium)).slice(0, 8);
  if (lots.length) g.push({ label: "Auction results", n: lots.length,
    html: `<div class="rows">${lots.map(f => {
      const u = safeUrl(f.url);
      const inner = `${workThumb(f.image, [f.artist, f.title].filter(Boolean).join(" — "), "t-ares")}
        <div class="ares-b">
          <div class="ares-t">${esc(f.artist || "—")}${f.title ? " — " + esc(f.title) : ""}</div>
          <div class="ares-m">${esc(f.house || "")}${f.date ? " · " + esc(fmtDate(f.date)) : ""}</div>
        </div><div class="ares-p tnum">${esc(f.price || "—")}</div>`;
      return u ? `<a class="ares" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
               : `<div class="ares">${inner}</div>`;
    }).join("")}</div>` });

  const sales = (REAL.events || []).filter(e =>
    searchHit(q, e.title, e.house, e.city, e.kind)).slice(0, 8);
  if (sales.length) g.push({ label: "Forthcoming sales", n: sales.length,
    html: `<div class="rows">${sales.map(e => auctionCard(e, false)).join("")}</div>` });

  if (CRM.live && CRM.clients) {
    const cls = CRM.clients.filter(c =>
      searchHit(q, c.name, c.focus, c.city, c.title, (c.wants || []).join(" "))).slice(0, 10);
    if (cls.length) g.push({ label: "Clients", n: cls.length,
      html: `<div class="rows">${cls.map(c => `
        <button class="row" data-open-client="${esc(c.id)}">
          <div class="row-top"><span class="row-name">${esc(c.name)}</span>${I(ICON.chev, 16)}</div>
          <div class="row-sub">${esc([c.tier, c.city, c.focus].filter(Boolean).join(" · "))}</div>
        </button>`).join("")}</div>` });

    /* Her own writing: what is owed, and what was said. Follow-ups arrive with
       /brief on every load; the conversation log arrives with /activity. Neither
       needs a card to be open first, which the old lazy detail load did. */
    const notes = [
      ...(CRM.followups || []).filter(f => searchHit(q, f.reason, f.client_name))
        .map(f => ({ who: f.client_name, id: f.client_id, when: f.due,
                     kind: f.overdue ? "overdue" : "due", text: f.reason })),
      ...(CRM.activity || []).filter(l => searchHit(q, l.note, l.client_name, l.channel))
        .map(l => ({ who: l.client_name, id: l.client_id, when: l.happened,
                     kind: l.channel || "note", text: l.note })),
    ].slice(0, 10);
    if (notes.length) g.push({ label: "Your diary", n: notes.length,
      html: `<div class="rows">${notes.map(x => `
        <button class="log logbtn" data-open-client="${esc(x.id)}">
          <div><div class="d tnum">${esc(fmtDate(x.when))}</div><div class="ch">${esc(x.kind)}</div></div>
          <div class="nt">${esc(x.text || "")}<div class="row-sub">${esc(x.who || "")}</div></div>
        </button>`).join("")}</div>` });
  }
  return g;
}

/* The field is painted once and the results are painted into their own node,
   because re-rendering the screen on every keystroke replaces the <input> the
   caret is sitting in — the sheet learned that the hard way and this inherits
   the lesson rather than the bug. */
function renderSearchResults() {
  const el = document.getElementById("search-results");
  if (!el) return;
  const q = (S.query || "").trim().toLowerCase();
  const groups = q ? searchGroups(q) : [];
  const total = groups.reduce((a, g) => a + g.n, 0);

  const body = !q
    ? `<div class="sec">${sectionHead("Everything on the desk",
          artistKeys.length + " artists · " + REAL.coverage.lots.toLocaleString() + " lots")}
        <div class="foot-note">Artists, headlines, results, forthcoming sales${CRM.live ? ", the book and your own diary" : ""} — all at once.</div>
        <div class="chiprow" style="padding-left:0;padding-right:0;margin:14px 0 0;flex-wrap:wrap;overflow:visible">
          ${artistKeys.slice(0, 14).map(k =>
            `<button class="chip" data-open-artist="${esc(k)}">${esc(A(k).name)}</button>`).join("")}
        </div></div>`
    : !groups.length
      ? `<div class="empty">Nothing on the desk matches “${esc(S.query)}”.</div>`
      : groups.map(g => `<div class="sec">${sectionHead(g.label, String(g.n))}${g.html}</div>`).join("");

  const count = q
    ? total + (total === 1 ? " match" : " matches") + " across " + groups.length
      + (groups.length === 1 ? " section" : " sections")
    : "";
  el.innerHTML = (count ? `<div class="foot-note" style="margin:0 0 4px">${esc(count)}</div>` : "") + body;
  guard("sparks", drawSparks);
}

/* ============================================================
   VALUE A WORK — comparables from the desk's own record

   The question is "what would a work like this fetch": the answer is the
   middle half of what comparable works actually fetched, and the sales
   themselves underneath so anyone can check. Comparable means the same artist,
   the same market (canvas / paper / sculpture never mix), between half and
   twice the area, and as recent as the record allows: three years if there
   are enough, else five, else ten, else everything. Fewer than VAL_MIN
   comparables and no figure is quoted — the sales are still listed, and the
   page says which loosening would help. A decade, when given, is preferred
   but never required: only AstaGuru and the overseas houses print a year.

   The record lives in data/lots.json (every sold lot with a size and a
   medium, ~500 KB compressed), fetched the first time this screen opens.
   The form is painted once and results render into #value-results, so the
   field she is typing in is never redrawn under her.
   ============================================================ */
/* ============================================================
   ALERTS — the bell on an artist, and what it fired

   One tap on the bell watches an artist with the two things anyone wants:
   a lot coming to auction, and a result. A second tap opens the sheet to
   turn either off, set a rupee floor, or stop watching. The watch itself
   lives in D1 behind the desk key; the nightly job matches it and the
   morning roundup carries what fired. Everything here is written so the
   public site (no API) still explains itself instead of failing.
   ============================================================ */
const watchFor = key => (CRM.watches || []).find(w => w.artist_key === key) || null;
const alertsToday = () => {
  const since = new Date(Date.now() - 26 * 3600e3).toISOString();
  return ((REAL.alerts || {}).items || []).filter(i => (i.at || "") >= since).length;
};
const FLOORS = [[null, "Any price"], [1e6, "\u20b910 lakh+"], [5e6, "\u20b950 lakh+"], [1e7, "\u20b91 cr+"], [5e7, "\u20b95 cr+"]];

async function saveWatch(key, patch) {
  const a = ARTISTS[key];
  const cur = watchFor(key) || { artist_key: key, artist_name: a ? a.name : key, upcoming: 1, results: 1, min_inr: null };
  const next = { ...cur, ...patch };
  const r = await api("/watches/" + encodeURIComponent(key), {
    method: "PUT",
    body: JSON.stringify({ artist_name: next.artist_name, upcoming: !!next.upcoming, results: !!next.results, min_inr: next.min_inr }),
  });
  if (!r) throw new Error("not signed in");
  CRM.watches = (CRM.watches || []).filter(w => w.artist_key !== key).concat([r.watch]);
}
async function dropWatch(key) {
  await api("/watches/" + encodeURIComponent(key), { method: "DELETE" });
  CRM.watches = (CRM.watches || []).filter(w => w.artist_key !== key);
}

function bellButton(key) {
  const w = watchFor(key);
  return `<button class="bell-btn" data-act="bell" data-artist="${esc(key)}" aria-pressed="${!!w}" title="${w ? "Watching \u2014 tap to adjust" : "Watch this artist"}">${I(ICON.bell, 15)} ${w ? "Watching" : "Watch"}</button>`;
}

function watchSheet(key) {

  const w = watchFor(key);

const VAL_MIN = 6;
let LOTS = null, LOTS_STATE = "idle";

async function ensureLots() {
  if (LOTS || LOTS_STATE === "loading") return;
  LOTS_STATE = "loading";
  try {
    const r = await fetch("data/lots.json", { cache: "no-cache" });
    LOTS = r.ok ? await r.json() : [];
    LOTS_STATE = r.ok ? "ready" : "failed";
  } catch (e) { LOTS = []; LOTS_STATE = "failed"; }
  if (S.screen === "value") renderValueResults();
}

const pct = (xs, p) => xs.length ? xs[Math.min(xs.length - 1, Math.floor((xs.length - 1) * p))] : null;

function comparables(q) {
  const today = todayIso();
  const pool = (LOTS || []).filter(l => l.a === q.artist && l.m === q.medium && l.q && l.p);
  const inBand = l => l.q >= q.sqin / 2 && l.q <= q.sqin * 2;
  const inDecade = l => l.y && Math.abs(parseInt(l.y, 10) - q.year) <= 10;
  const tries = [];
  for (const yrs of [3, 5, 10, 0]) {
    const since = yrs ? (parseInt(today.slice(0, 4), 10) - yrs) + today.slice(4) : "";
    if (q.year) tries.push({ yrs, band: true, decade: true, f: l => l.d >= since && inBand(l) && inDecade(l) });
    tries.push({ yrs, band: true, decade: false, f: l => l.d >= since && inBand(l) });
  }
  tries.push({ yrs: 0, band: false, decade: false, f: () => true });
  for (const t of tries) {
    const rows = pool.filter(t.f);
    if (rows.length >= VAL_MIN) return { ...t, rows, pool: pool.length, enough: true };
  }
  const rows = pool.filter(l => inBand(l));
  return { yrs: 0, band: true, decade: false, rows: rows.length ? rows : pool, pool: pool.length, enough: false };
}

function viewValue() {
  ensureLots();
  const v = S.val;
  const names = Object.values(ARTISTS).map(a => a.name).sort();
  return `<div class="view-head"><h1>Value a work</h1>
      <p>What comparable works have sold for, and the sales that say so</p></div>
    <div class="view-body">
      <div class="val-form">
        <div class="fld"><div class="label">Artist</div>
          <input type="text" data-val="artist" list="val-artists" autocomplete="off" placeholder="Start typing a name" value="${esc(v.artist)}">
          <datalist id="val-artists">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
        </div>
        <div class="fld"><div class="label">Medium</div>
          <div class="chiprow">${[["c", "Canvas / board"], ["p", "Paper"], ["s", "Sculpture"]].map(([k, l]) =>
            `<button class="chip" data-act="value-medium" data-m="${k}" aria-pressed="${v.medium === k}">${l}</button>`).join("")}</div>
        </div>
        <div class="fld"><div class="label">Size</div>
          <div class="val-size">
            <input type="number" inputmode="decimal" data-val="w" placeholder="width" value="${esc(v.w)}">
            <span class="x">×</span>
            <input type="number" inputmode="decimal" data-val="h" placeholder="height" value="${esc(v.h)}">
            <span class="unit">${["in", "cm"].map(u => `<button class="chip" data-act="value-unit" data-u="${u}" aria-pressed="${v.unit === u}">${u}</button>`).join("")}</span>
          </div>
        </div>
        <div class="fld"><div class="label">Year painted <span style="text-transform:none;letter-spacing:0">(optional)</span></div>
          <input type="number" inputmode="numeric" data-val="year" placeholder="e.g. 1975" value="${esc(v.year)}" style="max-width:160px">
        </div>
      </div>
      <div id="value-results"></div>
    </div>`;
}

function valueQuery() {
  const v = S.val;
  const name = (v.artist || "").trim().toLowerCase();
  const hit = Object.values(ARTISTS).find(a => a.name.toLowerCase() === name)
    || Object.values(ARTISTS).find(a => name.length >= 4 && a.name.toLowerCase().includes(name));
  const w = parseFloat(v.w), h = parseFloat(v.h);
  const k = v.unit === "cm" ? 1 / 2.54 : 1;
  const sqin = (w > 0 && h > 0) ? w * k * h * k : null;
  const year = parseInt(v.year, 10);
  return { artist: hit ? hit.key : null, name: hit ? hit.name : null, medium: v.medium,
           sqin, year: (year >= 1800 && year <= 2100) ? year : null, w, h };
}

function renderValueResults() {
  const el = document.getElementById("value-results");
  if (!el) return;
  const q = valueQuery();
  if (!q.artist || !q.medium || !q.sqin) {
    el.innerHTML = `<div class="empty">${!q.artist && (S.val.artist || "").length >= 3 ? "No artist by that name on the desk." : "Name the artist, pick the medium and give the size."}</div>`;
    return;
  }
  if (LOTS_STATE !== "ready") {
    el.innerHTML = `<div class="empty">${LOTS_STATE === "failed" ? "The record could not be loaded." : "Reading the record\u2026"}</div>`;
    return;
  }
  const c = comparables(q);
  const prices = c.rows.map(l => l.p).sort((a, b) => a - b);
  const psi = c.rows.filter(l => l.q).map(l => l.p / l.q).sort((a, b) => a - b);
  const sized = c.band && psi.length ? Math.round(pct(psi, 0.5) * q.sqin) : null;
  const window = c.yrs ? `since ${parseInt(todayIso().slice(0, 4), 10) - c.yrs}` : "across the whole record";
  const what = q.medium === "s" ? `${q.name} in sculpture` : `${q.name} on ${q.medium === "c" ? "canvas or board" : "paper"}`;
  const sizeTxt = c.band ? `between ${Math.round(q.sqin / 2)} and ${Math.round(q.sqin * 2)} sq in (yours is ${Math.round(q.sqin)})` : "of any size";
  const decTxt = c.decade ? `, painted within ten years of ${q.year}` : "";

  const head = c.enough ? `
    <div class="val-head">
      <div class="val-range tnum">${inrShort(pct(prices, 0.25))} \u2013 ${inrShort(pct(prices, 0.75))}</div>
      <div class="val-sub">The middle half of <b>${c.rows.length} sales</b> of ${esc(what)}, ${sizeTxt}${decTxt}, ${window}. Median <b class="tnum">${inrShort(pct(prices, 0.5))}</b>; the lowest ${inrShort(prices[0])}, the highest ${inrShort(prices[prices.length - 1])}.${sized ? ` Scaled to your size by the median price per square inch: <b class="tnum">${inrShort(sized)}</b>.` : ""}</div>
      <div class="foot-note">A range from what comparable works fetched, premium included, as the houses published it. It holds artist, medium and size constant — not quality, condition, provenance or period. A significant work sits above this band and a weak one below it; the sales underneath are the evidence, and the picture of each is a tap away.</div>
    </div>` : `
    <div class="val-head">
      <div class="val-range" style="font-size:22px;color:var(--ink)">Not enough comparable sales to quote a range</div>
      <div class="val-sub">${c.rows.length} ${c.rows.length === 1 ? "sale" : "sales"} of ${esc(what)} ${sizeTxt} on the record; ${VAL_MIN} are needed. ${c.pool > c.rows.length ? `There are ${c.pool} in this medium at other sizes.` : "There are no others in this medium."} The desk does not guess.</div>
    </div>`;

  const rows = c.rows.slice().sort((a, b) => (b.d > a.d ? 1 : -1)).map(l => {
    const v = l.e ? (l.p > l.e[1] ? "above" : l.p < l.e[0] ? "below" : null) : null;
    return `<a class="rec ${l.i ? "has-pic" : ""}" href="${safeUrl(l.u) || "#"}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">
      ${workThumb(l.i, l.t || "", "t-rec")}
      <div class="rec-body">
        <div class="rec-top">${houseTag(l.h)}<span class="row-meta tnum">${esc(fmtDate(l.d))}</span></div>
        <div class="rec-work">${esc(l.t || "Untitled")}</div>
        <div class="rec-med">${esc([l.s, l.y ? "painted " + l.y : null].filter(Boolean).join(" \u00b7 "))}</div>
        <div class="rec-foot">
