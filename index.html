/* renderSheet() / renderSheetResults() lived here. Search is a screen now, with
   grouped sections over everything the desk holds rather than an overlay that
   could only find an artist. viewSearch() + renderSearchResults() replaced them,
   and kept the one thing the sheet got right: the field is never redrawn while
   she is typing in it. */

/* ============================================================
   RENDER
   ============================================================ */
function view() {
  switch (S.screen) {
    case "today": return viewToday();
    case "artists": return viewArtists();
    case "dossier": return isSplit ? viewArtists() : viewDossier(false);
    case "news": return viewNews();
    case "article": return viewArticle(false);
    case "search": return viewSearch();
    case "market": return viewMarket();
    case "clients": return viewClients();
    case "newclient": return viewNewClient();
    case "unlock": return viewUnlock();
    case "client": return isSplit ? viewClients() : viewClient(false);
    case "calendar": return viewCalendar();
    case "knowledge": return viewKnowledge();
    case "ask": return viewAsk();
    case "value": return viewValue();
    case "alerts": return viewAlerts();
    default: return viewMore();
  }
}

// A throw inside any one of these used to take the whole desk down with it:
// renderRail() ran first, so one stale reference in a nav badge left `main`
// untouched and the site opened blank. Paint the content first, then the
// chrome, and let each piece fail alone and loudly.
function guard(label, fn) {
  try { fn(); } catch (e) { console.error("render: " + label + " failed", e); }
}

/* Which record the detail column is showing, so a re-render for the same one
   keeps its place and a move to a different one starts at the top. */
let renderedScreenKey = null, renderedRecordKey = null, renderedSplit = false;
const splitRecordKey = () =>
  (S.screen === "artists" || S.screen === "dossier") ? "a:" + S.artist
  : (S.screen === "clients" || S.screen === "client") ? "c:" + S.client
  : null;

function render(keepScroll) {
  // Before anything reads S.client: a card screen must be pointed at a
  // collector the book holds, and that collector's record must be on its way.
  guard("selection", settleClientSelection);
  const main = document.getElementById("main");
  const y = keepScroll ? main.scrollTop : 0;
  const split = (S.screen === "artists" || S.screen === "dossier" || S.screen === "clients" || S.screen === "client") && isSplit;
  const askable = S.screen === "ask" && CRM.live && CRM.ai;

  /* On a split screen the scroll lives in the two columns, not in main, so
     main.scrollTop alone no longer preserves anything. Picking a second artist
     would otherwise throw the list back to the top every time — the exact thing
     independent scrolling was meant to stop. The detail deliberately resets when
     the record changes: a new dossier should start at its own beginning. */
  // The list column is navigation furniture, not content: it holds its place
  // whatever happens on the right, including a go() that asked for no scroll
  // restore. Picking a second artist must not throw the list back to the top.
  // It DOES start fresh when arriving from another screen entirely.
  const prevList = renderedSplit ? (document.querySelector(".split .list") || {}).scrollTop : 0;
  const prevDetail = keepScroll && renderedSplit ? (document.querySelector(".split .detail") || {}).scrollTop : 0;
  const sameRecord = renderedRecordKey === splitRecordKey();

  main.classList.toggle("ask-main", askable);
  main.classList.toggle("split-main", split);
  guard("main", () => {
    // Only a genuine change of screen animates. render(true) fires on every
    // keystroke and every chip, and fading the page each time would strobe.
    const arriving = S.screen !== renderedScreenKey ? " enter" : "";
    main.innerHTML = `<div class="wrap ${split ? "wide split-wrap" : ""}${askable ? " ask-wrap" : ""}${arriving}">${view()}</div>`;
    main.scrollTop = y;
    if (split) {
      const list = main.querySelector(".split .list");
      const detail = main.querySelector(".split .detail");
      if (list) list.scrollTop = prevList || 0;
      if (detail) detail.scrollTop = sameRecord ? (prevDetail || 0) : 0;
    }
  });
  renderedScreenKey = S.screen;
  renderedRecordKey = splitRecordKey();
  renderedSplit = split;
  // The field is inside `main`, so its results have to be painted after it and
  // never by it. Anything that changes what search would match \u2014 the book
  // loading, a news refresh \u2014 lands here without touching the input.
  if (S.screen === "search") guard("search", renderSearchResults);
  if (S.screen === "value") guard("value", renderValueResults);
  guard("rail", renderRail);
  guard("topbar", renderTopbar);
  guard("tabbar", renderTabbar);
  guard("fab", renderFab);
  guard("sparks", drawSparks);
  document.title = "AG Newsroom";
}

/* One question at a time, deliberately. The free tier is rate limited to about
   a request a minute, so a second question in flight would only earn a 429 and
   lose the first answer. */
/* The answer arrives with bare [3] markers. Only a number the desk actually
   sent is turned into a link; anything else stays plain text, because a citation
   we cannot resolve is a citation we should not dress up as a source. The URL
   comes from our own table, never from the model — so there is no link for it to
   have got wrong. */
function askBody(m) {
  const byN = new Map((m.cited || []).map(c => [String(c.n), c]));
  return esc(m.content).replace(/\[(\d{1,2})\]/g, (whole, n) => {
    const c = byN.get(n);
    const href = c && safeUrl(c.url);
    if (!href) return whole;
    return `<a class="ask-cite" href="${esc(href)}" target="_blank" rel="noopener noreferrer"`
         + ` title="${esc(c.source + " \u00b7 " + c.date)}">${whole}</a>`;
  });
}

/* Under the answer, the stories it actually cited — in the order it cited them,
   so the list reads with the prose rather than against it. */
function askCitedList(m) {
  const used = [...new Set((String(m.content).match(/\[(\d{1,2})\]/g) || [])
    .map(x => x.replace(/[^\d]/g, "")))];
  const rows = used.map(n => (m.cited || []).find(c => String(c.n) === n))
    .filter(c => c && safeUrl(c.url));
  if (!rows.length) return "";
  return `<div class="ask-refs">${rows.map(c => `
    <a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer">
      <span class="rn">${esc(String(c.n))}</span>
      <span class="rt">${esc(c.headline)}</span>
      <span class="rs">${esc(c.source)} \u00b7 ${esc(fmtDate(c.date))}</span>
    </a>`).join("")}</div>`;
}

function askSend() {
  if (S.askBusy) return;
  const q = (S.askInput || "").trim();
  if (!q) return;

  S.askLog = [...S.askLog, { role: "user", content: q }];
  S.askInput = "";
  S.askBusy = true;
  S.askError = null;
  render(true);
  askScroll();

  aiAsk(q)
    .then(r => {
      S.askLog = [...S.askLog, { role: "assistant", content: r.answer, model: r.model,
                                 unverified: r.unverified || [], used_book: r.used_book,
                                 sources: r.sources || [], cited: r.cited || [] }];
    })
    .catch(err => {
      // Keep her question in the thread — retyping it after a rate limit is the
      // one thing that would make her stop using this.
      S.askError = err.message || "The assistant could not be reached.";
    })
    .then(() => { S.askBusy = false; render(true); askScroll(); });
}

/* Focus is deliberately not taken on every render \u2014 only when she has just
   asked for the search screen. Stealing it on a repaint would fight the caret. */
function focusSearch() {
  requestAnimationFrame(() => {
    const inp = document.getElementById("q");
    if (!inp) return;
    inp.focus();
    try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
  });
}

function askScroll() {
  requestAnimationFrame(() => {
    const el = document.getElementById("askScroll");
    if (el) el.scrollTop = el.scrollHeight;
    const inp = document.querySelector(".ask-input");
    if (inp && !S.askBusy) inp.focus();
  });
}

function drawSparks() {
  document.querySelectorAll("[data-spark]").forEach(el => {
    const a = A(el.getAttribute("data-spark"));
    if (a) el.innerHTML = sparkline(a.index, el.clientWidth || 320);
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
function go(screen, opts) {
  Object.assign(S, opts || {});
  S.screen = screen;
  render(false);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-nav],[data-act],[data-open-artist],[data-open-client],[data-house],[data-market],[data-know],[data-cal],[data-toggle-done],[data-tpl],[data-obj],[data-pitch],[data-nc-tier],[data-clear-followup],[data-panel],[data-ed-tier],[data-ed-channel],[data-card-followup],[data-edit-row],[data-del-row],[data-cal-nav],[data-cal-day],[data-mark],[data-res],[data-feed],[data-ask-sugg],[data-cal-ev],[data-open-story],[data-news],[data-client-tab]");
  if (!t) return;

  const attr = n => t.getAttribute(n);

  if (attr("data-open-artist")) {
    return go(isSplit ? "artists" : "dossier", { artist: attr("data-open-artist"), houseFilter: "All", bioOpen: false });
  }
  if (attr("data-open-client")) {
    const ck = attr("data-open-client");
    go(isSplit ? "clients" : "client", { client: ck, openTemplate: null, clientTab: "overview" });
    ensureDetail(ck);
    return;
  }
  if (attr("data-house")) { S.houseFilter = attr("data-house"); return render(true); }
  if (attr("data-open-story")) {
    return go("article", { article: attr("data-open-story"), back: S.screen === "article" ? S.back : S.screen });
  }
  if (attr("data-news")) { S.newsTab = attr("data-news"); return render(true); }
  if (attr("data-client-tab")) { S.clientTab = attr("data-client-tab"); return render(true); }
  if (attr("data-market")) { S.marketTab = attr("data-market"); return render(true); }
  if (attr("data-cal")) { S.calFilter = attr("data-cal"); S.calDay = null; S.calEvent = null; return render(true); }
  if (attr("data-res")) {
    const [k, v] = attr("data-res").split(":");
    S[k === "house" ? "resHouse" : "resPerf"] = v;
    return render(true);
  }
  if (attr("data-feed")) {
    const [k, v] = attr("data-feed").split(":");
    S[k === "cat" ? "feedCat" : "feedScope"] = v;
    return render(true);
  }
  if (attr("data-mark")) {
    const url = attr("data-mark");
    const all = [...(((REAL.news || {}).on_market) || []), ...(((REAL.news || {}).wider) || [])];
    const n = all.find(x => markKey(x) === url) || { url };
    toggleMark(n);
    return render(true);
  }
  if (attr("data-cal-nav")) {
    const dir = attr("data-cal-nav");
    S.calMonth = dir === "today" ? 0 : (S.calMonth || 0) + (dir === "next" ? 1 : -1);
    S.calDay = null;                       // a day from another month must not stay open
    S.calEvent = null;
    return render(true);
  }
  if (attr("data-cal-ev")) {
    const k = attr("data-cal-ev");
    S.calEvent = S.calEvent === k ? null : k;   // tapping the open one closes it
    return render(true);
  }
  if (attr("data-cal-day")) {
    const k = attr("data-cal-day");
    S.calDay = S.calDay === k ? null : k;  // tapping the open day closes it
    S.calEvent = null;
    return render(true);
  }
  if (attr("data-clear-followup")) {
    const fid = attr("data-clear-followup");
    CRM.followups = CRM.followups.filter(f => f.id !== fid);
    render(true);
    api(`/followups/${encodeURIComponent(fid)}/done`, { method: "POST", body: "{}" })
      .catch(() => { loadCRM().then(() => render(true)); });   // put it back if the write failed
    return;
  }
  if (attr("data-toggle-done")) { const k = attr("data-toggle-done"); S.done[k] = !S.done[k]; persist(); return render(true); }
  if (attr("data-tpl")) { const i = +attr("data-tpl"); S.openTemplate = S.openTemplate === i ? null : i; return render(true); }
  if (attr("data-obj")) { const i = +attr("data-obj"); S.openObjection = S.openObjection === i ? null : i; return render(true); }
  if (attr("data-pitch")) {
    S.pitchClient = attr("data-pitch");
    S.aiError = null;
    ensureDetail(S.pitchClient);
    return render(true);
  }

  if (attr("data-nc-tier")) {
    S.newClient = { ...S.newClient, tier: attr("data-nc-tier") };
    return render(true);
  }

  if (attr("data-panel")) {
    const which = attr("data-panel");
    if (which === "close" || S.panel === which) {
      S.panel = null; S.draft = {}; S.draftError = null; S.confirmDelete = null;
      return render(true);
    }
    const d = CRM.detail[S.client] || {};
    S.panel = which;
    if (PANEL_TAB[which]) S.clientTab = PANEL_TAB[which];
    S.draftError = null;
    S.confirmDelete = null;
    S.draft =
      which === "client" ? {
        name: d.name || "", title: d.title || "", city: d.city || "",
        tier: d.tier || "Growth", since: d.since || "",
        lifetime_inr: d.lifetime_inr == null ? "" : String(d.lifetime_inr),
        focus: d.focus || "", wants: (d.wants || []).join(", "),
        brief: d.brief || "", next_when: d.next_when || "", next_what: d.next_what || "",
      }
      : which === "log"      ? { happened: todayIso(), channel: "Call", note: "" }
      : which === "followup" ? { due: todayIso(), reason: "" }
      : { artist_name: "", work: "", acquired: "", paid_inr: "" };
    return render(true);
  }
  if (attr("data-ed-tier"))    { S.draft = { ...S.draft, tier: attr("data-ed-tier") }; return render(true); }
  if (attr("data-ed-channel")) { S.draft = { ...S.draft, channel: attr("data-ed-channel") }; return render(true); }

  if (attr("data-edit-row")) {
    const token = attr("data-edit-row");
    const kind = token.slice(0, token.indexOf(":"));
    const rid = token.slice(token.indexOf(":") + 1);
    const d = CRM.detail[S.client] || {};
    const row = (kind === "holding" ? (d.holdings || [])
               : kind === "log"     ? (d.log || [])
               :                      (d.followups || [])).find(x => x.id === rid);
    if (!row) return;
    S.panel = `${kind}:${rid}`;
    if (PANEL_TAB[kind]) S.clientTab = PANEL_TAB[kind];
    S.confirmDelete = null;
    S.draftError = null;
    S.draft = kind === "holding"
      ? { artist_name: row.artist_name || "", work: row.work || "",
          acquired: row.acquired || "", paid_inr: row.paid_inr == null ? "" : String(row.paid_inr) }
      : kind === "log"
      ? { happened: row.happened || "", channel: row.channel || "", note: row.note || "" }
      : { due: row.due || "", reason: row.reason || "" };
    return render(true);
  }

  if (attr("data-del-row")) {
    const token = attr("data-del-row");
    // First tap arms it, second does it. Nothing is deleted on one tap.
    if (S.confirmDelete !== token) {
      S.confirmDelete = token; S.panel = null; S.draft = {}; S.draftError = null;
      const k = token.slice(0, token.indexOf(":"));
      if (PANEL_TAB[k]) S.clientTab = PANEL_TAB[k];
      return render(true);
    }
    const kind = token.slice(0, token.indexOf(":"));
    const rid = token.slice(token.indexOf(":") + 1);
    const route = kind === "holding" ? "/holdings/" : kind === "log" ? "/log/" : "/followups/";
    const cid = S.client;
    S.confirmDelete = null;
    render(true);
    api(route + encodeURIComponent(rid), { method: "DELETE" })
      .then(res => { if (!res) throw new Error("not signed in"); return refreshClient(cid); })
      .then(() => { if (S.client === cid) render(true); })
      .catch(() => { S.draftError = "Could not delete. Check you are still signed in."; render(true); });
    return;
  }

  if (attr("data-card-followup")) {
    const fid = attr("data-card-followup");
    const d = CRM.detail[S.client];
    const f = ((d && d.followups) || []).find(x => x.id === fid);
    if (!f) return;
    const was = f.done;
    f.done = was ? 0 : 1;                       // optimistic, so the tap feels instant
    render(true);
    api(`/followups/${encodeURIComponent(fid)}/done`, {
      method: "POST", body: JSON.stringify({ done: !was }),
    })
      .then(res => { if (!res) throw new Error("not signed in"); return refreshClient(S.client); })
      .then(() => render(true))
      .catch(() => { f.done = was; render(true); });   // put it back if the write failed
    return;
  }

  const act = attr("data-act");
  if (act === "retry-client") {
    const cid = attr("data-client");
    delete CRM.detailError[cid];
    ensureDetail(cid, true);
    return render(true);
  }
  if (act === "forget-key") {
    setDeskKey("");
    CRM.live = false; CRM.needsKey = true; CRM.clients = []; CRM.detail = {};
    CRM.detailBusy = {}; CRM.detailError = {}; CRM.followups = []; CRM.activity = [];
    S.client = null;
    return render(false);
  }
  if (act === "new-client") {
    return go("newclient", { newClient: {}, newClientError: null });
  }
  if (act === "save-client") {
    const f = S.newClient || {};
    if (!f.name || !f.name.trim()) {
      S.newClientError = "A client needs a name.";
      return render(true);
    }
    const btn = t;
    btn.textContent = "Saving\u2026";
    api("/clients", { method: "POST", body: JSON.stringify({ ...f, name: f.name.trim() }) })
      .then(res => {
        if (!res) throw new Error("not signed in");
        return loadCRM();
      })
      .then(() => go("clients", { newClient: {}, newClientError: null }))
      .catch(() => {
        S.newClientError = "Could not save. Check you are still signed in.";
        render(true);
      });
    return;
  }
  /* One shape for all four writes: disable the button, post, re-read the record,
     close the panel. On failure the panel stays open with the draft intact, so
     nothing she typed is lost. */
  const saveDraft = (btn, run) => {
    // Disabling the button is the whole double-submit guard. A flag on S would
    // outlive the panel it belongs to and silently swallow the next save.
    const cid = S.client, label = btn.textContent;
    btn.textContent = "Saving\u2026";
    btn.disabled = true;
    Promise.resolve(run(cid))
      .then(res => { if (!res) throw new Error("not signed in"); return refreshClient(cid); })
      .then(() => {
        if (S.client !== cid) return;      // she moved on; do not yank the card back
        S.panel = null; S.draft = {}; S.draftError = null; S.confirmDelete = null;
        render(true);
      })
      .catch(() => {
        S.draftError = "Could not save. Check you are still signed in.";
        btn.textContent = label; btn.disabled = false;
        render(true);
      });
  };

  if (act === "save-edit") {
    const f = S.draft || {};
    if (!f.name || !f.name.trim()) { S.draftError = "A client needs a name."; return render(true); }
    const body = {
      name: f.name.trim(),
      title: blankToNull(f.title), city: blankToNull(f.city),
      tier: f.tier || "Growth", since: blankToNull(f.since),
      lifetime_inr: intOrNull(f.lifetime_inr),
      focus: blankToNull(f.focus), brief: blankToNull(f.brief),
      next_when: blankToNull(f.next_when), next_what: blankToNull(f.next_what),
      wants: String(f.wants || "").split(",").map(x => x.trim()).filter(Boolean),
    };
    return saveDraft(t, cid => api(`/clients/${encodeURIComponent(cid)}`,
      { method: "PATCH", body: JSON.stringify(body) }));
  }

  if (act === "save-holding") {
    const f = S.draft || {};
    if (!f.artist_name || !f.artist_name.trim()) {
      S.draftError = "A holding needs an artist."; return render(true);
    }
    const name = f.artist_name.trim();
    return saveDraft(t, cid => api("/holdings", { method: "POST", body: JSON.stringify({
      client_id: cid,
      artist_name: name,
      artist_key: artistKeyByName(name),   // links the holding to the public dossier
      work: blankToNull(f.work),
      acquired: blankToNull(f.acquired),
      paid_inr: intOrNull(f.paid_inr),
    }) }));
  }

  if (act === "save-log") {
    const f = S.draft || {};
    if (!f.note || !f.note.trim()) { S.draftError = "A note needs something in it."; return render(true); }
    return saveDraft(t, cid => api("/log", { method: "POST", body: JSON.stringify({
      client_id: cid,
      happened: f.happened || todayIso(),
      channel: blankToNull(f.channel),
      note: f.note.trim(),
    }) }));
  }

  if (act === "save-followup") {
    const f = S.draft || {};
    if (!f.due) { S.draftError = "A follow-up needs a date."; return render(true); }
    return saveDraft(t, cid => api("/followups", { method: "POST", body: JSON.stringify({
      client_id: cid,
      due: f.due,
      reason: blankToNull(f.reason),
    }) }));
  }

  if (act === "save-row") {
    const which = S.panel || "";
    const i = which.indexOf(":");
    if (i < 0) return;
    const kind = which.slice(0, i), rid = which.slice(i + 1);
    const f = S.draft || {};
    let route, body;
    if (kind === "holding") {
      if (!f.artist_name || !f.artist_name.trim()) {
        S.draftError = "A holding needs an artist."; return render(true);
      }
      const name = f.artist_name.trim();
      route = "/holdings/";
      body = { artist_name: name, artist_key: artistKeyByName(name),
               work: blankToNull(f.work), acquired: blankToNull(f.acquired),
               paid_inr: intOrNull(f.paid_inr) };
    } else if (kind === "log") {
      if (!f.happened) { S.draftError = "A note needs a date."; return render(true); }
      if (!f.note || !f.note.trim()) { S.draftError = "A note needs something in it."; return render(true); }
      route = "/log/";
      body = { happened: f.happened, channel: blankToNull(f.channel), note: f.note.trim() };
    } else {
      if (!f.due) { S.draftError = "A follow-up needs a date."; return render(true); }
      route = "/followups/";
      body = { due: f.due, reason: blankToNull(f.reason) };
    }
    return saveDraft(t, () => api(route + encodeURIComponent(rid),
      { method: "PATCH", body: JSON.stringify(body) }));
  }

  if (act === "toggle-theme") { toggleTheme(); return; }
  if (act === "save-key") {
    const el = document.querySelector("[data-key]");
    const k = (el && el.value || "").trim();
    if (!k) { CRM.keyError = "Paste the key first."; return render(true); }
    setDeskKey(k);
    CRM.keyError = null;
    loadCRM().then(ok => {
      if (ok) { go("clients"); }
      else { setDeskKey(""); CRM.keyError = "That key was not accepted."; render(true); }
    });
    return;
  }
  if (act === "open-search") {
    if (S.screen === "search") return focusSearch();
    go("search", { query: "", back: S.screen });
    return focusSearch();
  }
  if (act === "clear-search") { S.query = ""; renderSearchResults(); return focusSearch(); }
  if (act === "bell") {
    const key = attr("data-artist");
    if (!CRM.live) { S.watchSheet = S.watchSheet === key ? null : key; return render(true); }
    if (watchFor(key)) { S.watchSheet = S.watchSheet === key ? null : key; return render(true); }
    t.disabled = true;
    saveWatch(key, {}).then(() => { S.watchSheet = key; render(true); })
      .catch(() => { t.disabled = false; alert("Could not save the watch. Are you signed in to the desk?"); });
    return;
  }
  if (act === "watch-toggle") {
    const key = attr("data-artist"), f = attr("data-field"), w = watchFor(key);
    if (!w) return;
    saveWatch(key, { [f]: w[f] ? 0 : 1 }).then(() => render(true)).catch(() => alert("Could not save."));
    return;
  }
  if (act === "watch-floor") {
    const key = attr("data-artist"), v = attr("data-floor");
    saveWatch(key, { min_inr: v ? +v : null }).then(() => render(true)).catch(() => alert("Could not save."));
    return;
  }
  if (act === "watch-stop") {
    const key = attr("data-artist");
    dropWatch(key).then(() => { S.watchSheet = null; render(true); }).catch(() => alert("Could not remove the watch."));
    return;
  }
  if (act === "watch-close") { S.watchSheet = null; return render(true); }
  if (act === "value-medium") { S.val.medium = attr("data-m"); render(true); return renderValueResults(); }
  if (act === "value-unit") { S.val.unit = attr("data-u"); render(true); return renderValueResults(); }
  if (act === "value-for") {
    const a = ARTISTS[attr("data-artist")];
    S.val = { ...S.val, artist: a ? a.name : "" };
    return go("value", { back: S.screen });
  }
  if (act === "toggle-bio") { S.bioOpen = !S.bioOpen; return render(true); }
  if (act === "pitch-for") {
    const cid = attr("data-client");
    ensureDetail(cid).then(d => { if (d) render(true); });
    return go("knowledge", { pitchClient: cid, knowTab: "pitch" });
  }

  if (attr("data-ask-sugg")) {
    S.askInput = attr("data-ask-sugg");
    if (S.screen !== "ask") go("ask", {});    // it may have been tapped from Today
    askSend();
    return;
  }
  if (act === "ask-book") { S.askBook = !S.askBook; persist(); return render(true); }
  if (act === "ask-clear") { S.askLog = []; S.askError = null; return render(true); }

  if (act === "ai-clear") {
    delete S.aiDrafts[attr("data-client")];
    S.aiError = null;
    return render(true);
  }
  if (act === "ai-pitch") {
    const cid = attr("data-client");
    if (S.aiBusy) return;                      // the free tier is one call at a time
    S.aiBusy = cid; S.aiError = null;
    render(true);

    // The comparables come from here rather than being re-derived in the Worker:
    // the artist matching lives in this file, and duplicating it server-side is
    // exactly how the news constants drifted apart. The holdings have to be on
    // hand before that match can mean anything, so wait for them.
    ensureDetail(cid)
      .then(() => {
        const held = (CRM.detail[cid] || {}).holdings || [];
        const comparables = REAL.feed
          .filter(f => held.some(h => h.artist_key && h.artist_key === f.artist_key))
          .slice(0, 4)
          .map(m => ({ artist: m.artist, title: m.title, price: m.price,
                       house: m.house, above: !!m.above }));
        return aiPitch(cid, comparables);
      })
      .then(d => { S.aiDrafts[cid] = d; })
      .catch(err => { S.aiError = err.message || "The drafter could not be reached."; })
      .then(() => { S.aiBusy = null; render(true); });
    return;
  }

  const nav = attr("data-nav");
  if (nav) {
    const know = attr("data-know");
    const opts = know ? { knowTab: know } : {};
    /* A pushed screen has to be told where it came from, and the nav is one of
       the things that opens one — News from the rail, Search from the More hub.
       Without this S.back kept whatever the last push had left in it, so the
       back chevron pointed somewhere she had never been and the tab bar lit the
       wrong tab. Arriving from another pushed screen falls back to Today rather
       than chaining, because S.back is a pointer and not a stack. */
    if (PUSHED.includes(nav)) {
      opts.back = PUSHED.includes(S.screen) ? (S.back || "today") : S.screen;
    }
    return go(nav, opts);
  }
});

document.addEventListener("input", e => {
  const q = e.target.closest("[data-q]");
  if (q) { S.query = q.value; renderSearchResults(); return; }   // never redraws the field
  const vf = e.target.closest("[data-val]");
  if (vf) { S.val = { ...S.val, [vf.getAttribute("data-val")]: vf.value }; renderValueResults(); return; }
  const nc = e.target.closest("[data-nc]");
  if (nc) { S.newClient = { ...S.newClient, [nc.getAttribute("data-nc")]: nc.value }; return; }
  const ed = e.target.closest("[data-ed]");
  if (ed) { S.draft = { ...S.draft, [ed.getAttribute("data-ed")]: ed.value }; }
  const ask = e.target.closest(".ask-input");
  if (ask) {
    S.askInput = ask.value;                 // stored, never redrawn under her
    ask.style.height = "auto";
    ask.style.height = Math.min(ask.scrollHeight, 180) + "px";
  }
});

document.addEventListener("submit", e => {
  if (e.target.closest('[data-act="ask-send"]')) { e.preventDefault(); askSend(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.screen === "search") { go(S.back || "today", { query: "" }); }
  // Enter sends, shift-Enter breaks the line — what every other chat box does.
  if (e.key === "Enter" && !e.shiftKey && e.target.closest(".ask-input")) {
    e.preventDefault(); askSend();
  }
});

padQ.addEventListener("change", ev => { isPad = ev.matches; render(false); });
splitQ.addEventListener("change", ev => { isSplit = ev.matches; render(false); });

let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawSparks, 140); });

rebuildFromReal();
render(false);

// paint from the embedded copy first so the desk is never blank, then upgrade
Promise.allSettled([loadLiveData(), loadCRM()]).then(([data]) => {
  if (data.status === "fulfilled" && data.value) rebuildFromReal();
  render(true);

  // Order matters: loadLiveData() REPLACES REAL, so asking for news first would
  // have the fetched headlines overwritten by the baked ones a moment later.
  loadNews().then(ok => { if (ok) render(true); });
});

/* Keep it current while she has the desk open — an auction morning is exactly
   when a stale headline is worst. Only while the tab is actually visible, so a
   forgotten background tab is not re-fetching all day. */
const NEWS_REFRESH_MS = 10 * 60 * 1000;
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  loadNews().then(ok => { if (ok) render(true); });
}, NEWS_REFRESH_MS);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const stamp = (REAL.news || {}).generated_at;
  const age = stamp ? Date.now() - Date.parse(stamp) : Infinity;
  if (!(age < NEWS_REFRESH_MS)) loadNews().then(ok => { if (ok) render(true); });
});
</script>
