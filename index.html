/* ------------------------------------------------------------
   The private half. /api is Access-protected and same-origin, so a 401 simply
   means she is not signed in (or this is the public GitHub Pages mirror, which
   has no API at all). Either way the desk keeps working on the sample book
   rather than breaking — the market data is the part that must never fail.
   ------------------------------------------------------------ */
const CRM = { live: false, who: null, clients: null, followups: null, diary: null,
              detail: {}, detailBusy: {}, detailError: {}, activity: null,
              guard: null, needsKey: false, keyError: null,
              ai: false };   // a Mistral key is set on this origin

const KEY_STORE = "gallery.key";
const deskKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } };
const setDeskKey = k => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} };

async function api(path, opts) {
  const key = deskKey();
  const r = await fetch("api" + path, {
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      ...(key ? { Authorization: "Bearer " + key } : {}),
    },
    ...opts,
  });
  if (r.status === 401 || r.status === 503) return null;
  if (!r.ok) throw new Error(`api ${path} -> ${r.status}`);
  return r.json();
}

async function loadCRM() {
  try {
    // /health needs no key, so an unconfigured host is distinguishable from a
    // wrong key — the difference between "no desk here" and "try again".
    const h = await fetch("api/health").then(r => r.ok ? r.json() : null).catch(() => null);
    CRM.guard = h ? h.guard : null;
    if (!h) return false;

    const me = await api("/me");
    if (!me) { CRM.needsKey = true; return false; }
    CRM.needsKey = false;
    // The drafter is optional: an origin with no MISTRAL_API_KEY is a working
    // desk, just without the button. Never let its absence fail the load.
    const [clients, brief, ai, watches] = await Promise.all([
      api("/clients"),
      api("/brief"),
      api("/ai/status").catch(() => null),
      api("/watches").catch(() => null),
    ]);
    CRM.watches = (watches && watches.watches) || [];
    CRM.ai = !!(ai && ai.configured);
    if (!clients) return false;
    CRM.live = true;
    CRM.who = me.email;
    CRM.clients = clients.clients || [];
    CRM.followups = (brief && brief.followups) || [];
    CRM.diary = (brief && brief.diary) || null;
    // /brief carries it now, so the Clients screen and Search have the whole
    // book's recent conversation without opening thirty cards to get it.
    CRM.activity = (brief && brief.activity) || [];
    return true;
  } catch (e) {
    return false;                    // sample book stands
  }
}

/* ---- writing back -------------------------------------------------------

   Every write goes the same way: post it, then re-read the record rather than
   patching the local copy by hand, so the card can never drift from what D1
   actually holds. loadCRM() comes too because a name, a tier or a follow-up
   also changes the list and the day's brief.
   ------------------------------------------------------------------------ */
const todayIso = () => new Date().toISOString().slice(0, 10);
const blankToNull = v => { const t = String(v == null ? "" : v).trim(); return t ? t : null; };
const intOrNull = v => {
  const digits = String(v == null ? "" : v).replace(/[^0-9]/g, "");
  return digits ? parseInt(digits, 10) : null;
};

/* The drafter answers with a message on every failure — a missing key, a rate
   limit, a draft rejected for quoting a figure the record does not hold — and
   each of those is worth showing her verbatim. So this does not go through
   api(), which turns a non-200 into an opaque throw. */
/* The ONE way a client card is loaded. It used to be a fire-and-forget fetch
   inside the click handler with an empty catch, so a 401, a 404 or a dropped
   connection left the card reading "Opening the card\u2026" for the rest of the
   session with nothing on screen to say why and nothing to press. Three rules
   now: one request in flight per collector, a failure is recorded rather than
   swallowed, and whatever is on screen re-renders when it settles. */
const LOCKED_OUT = "The desk key is not being accepted any more.";

function ensureDetail(cid, force) {
  if (!CRM.live || !cid) return Promise.resolve(null);
  if (CRM.detail[cid] && !force) return Promise.resolve(CRM.detail[cid]);
  if (CRM.detailBusy[cid]) return CRM.detailBusy[cid];

  delete CRM.detailError[cid];
  const req = api(`/clients/${encodeURIComponent(cid)}`)
    .then(d => {
      // api() answers null for 401 and 503 rather than throwing. Silence there
      // is what made this invisible: say so, do not keep waiting.
      if (!d) throw new Error(LOCKED_OUT);
      CRM.detail[cid] = normaliseClient(d);
      return CRM.detail[cid];
    })
    .catch(err => {
      // Only a sentence written here is shown. A browser's own wording for a
      // dropped connection ("Load failed", "Failed to fetch") tells her nothing.
      const m = String((err && err.message) || "");
      CRM.detailError[cid] =
          m === LOCKED_OUT       ? LOCKED_OUT
        : /-> 404\b/.test(m)     ? "That collector is no longer in the book."
        :                          "Could not reach the book from this device.";
      return null;
    })
    .then(d => {
      delete CRM.detailBusy[cid];
      // Repaint unconditionally. Five places read a client record and only two
      // of them are the card; guessing which screen is waiting is how the
      // pitch generator ended up drafting against a collector it had not loaded.
      render(true);
      return d;
    });

  CRM.detailBusy[cid] = req;
  return req;
}

/* The shape gate for one client record, in the spirit of rebuildFromReal():
   shape it once here rather than defend it at forty read sites. `wants` and the
   four child lists reach the card through JSON columns and JSON.parse, so any
   of them can arrive as something that is not an array \u2014 and .map on a
   string is a throw, which render() turns into a console.error and a card that
   never repaints. */
function normaliseClient(d) {
  const arr = v => Array.isArray(v) ? v : [];
  return {
    ...d,
    name: d.name == null ? "" : String(d.name),
    wants: arr(d.wants).map(w => String(w)),
    holdings: arr(d.holdings),
    referrals: arr(d.referrals),
    log: arr(d.log),
    followups: arr(d.followups),
  };
}

/* Which collector the card is showing. An id that is not in the book \u2014 a
   stale default, a record deleted on another device \u2014 is not a selection. */
function selectedClient() {
  const book = CRM.clients || [];
  if (S.client && book.some(c => c.id === S.client)) return S.client;
  return null;
}

/* One question, one call. Like aiPitch this bypasses api(), because every
   failure here carries a message worth showing her verbatim. */

async function refreshClient(cid) {
  const d = await api(`/clients/${encodeURIComponent(cid)}`);
  // Through the same shape gate as ensureDetail: a write path that skipped it
  // would put an unnormalised record straight back on the card.
  if (d) { CRM.detail[cid] = normaliseClient(d); delete CRM.detailError[cid]; }
  await loadCRM();
  return CRM.detail[cid] || null;
}

/* Live headlines. The nightly pipeline bakes a copy into app_data.json, which
   caps freshness at 24 hours — and the desk sat on six-day-old headlines while
   that cron ran green every night, because the queries were unbounded. This
   asks the edge instead, so the private site is current within its cache
   window. On GitHub Pages there is no Function, api/news 404s, and the baked
   copy stands.

   The endpoint serves her market only; the wider trade-press tier stays baked,
   because those five feeds are not worth five more fetches per cache miss. */
/* Same origin first — that is the private site, where the Function lives. On
   GitHub Pages there is no Function and api/news 404s, so it reaches across to
   the private site for the same public headlines. A published Artifact cannot
   do either: its CSP blocks cross-origin fetches, so it keeps the embedded copy
   and is a snapshot by design. */
const NEWS_ENDPOINTS = ["api/news", "https://the-gallery-ct1.pages.dev/api/news"];

async function loadNews() {
  try {
    let d = null;
    for (const url of NEWS_ENDPOINTS) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) continue;
        d = await r.json();
        if (d && Array.isArray(d.on_market) && d.on_market.length) break;
        d = null;
      } catch (e) { /* try the next one */ }
    }
    if (!d) return false;

    /* Merge, do not replace. The two layers see different things: the edge
       reads Indian art desks (galleries, shows, the scene) and is minutes old;
       the nightly Google News pass runs from GitHub Actions, where Google will
       answer, and it is the one that catches "Saffronart", "AstaGuru" and the
       record-price stories. Dropping either loses half her picture. */
    const baked = ((REAL.news || {}).on_market) || [];
    const key = h => h.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().slice(0, 60);
    const seen = new Set();
    const merged = [];
    for (const n of [...d.on_market, ...baked]) {
      if (!n || !n.headline) continue;
      const k = key(n.headline);
      if (seen.has(k)) continue;
      seen.add(k);
      merged.push(n);
    }
    /* Same day, picture first. Google-sourced stories carry no image — its
       interstitial hides the publisher URL and its og:image is Google's own
       logo — while the publisher feeds do. Sorting on date alone put the
       imageless ones on top and buried every picture below the fold. Date still
       wins across days; this only breaks ties. */
    merged.sort((a, b) => {
      const d = String(b.date).localeCompare(String(a.date));
      if (d !== 0) return d;
      return (b.image ? 1 : 0) - (a.image ? 1 : 0);
    });

    /* Reserve slots for market stories. Sorted purely by date, a run of fresh
       gallery-scene pieces evicted every auction story she actually trades on —
       measured: the Gandhi record and the AstaGuru Singapore piece both fell off
       the end. The live feeds are mostly scene; the market news comes from the
       nightly pass, and it is older by construction. */
    // "collector" alone matched a furniture showroom; a market story needs an
    // auction word or a house name, not a lifestyle noun.
    const isMarket = n => /saffronart|astaguru|pundole|sotheby|christie|bonhams|\b(auction|auctioned|auctions|sold|sells|fetches|record|hammer|consignment|crore|lakh)\b/i
      .test(n.headline + " " + (n.why || ""));
    const market = merged.filter(isMarket).slice(0, 6);
    const scene = merged.filter(n => !isMarket(n)).slice(0, 8);
    const kept = [...market, ...scene]
      .sort((a, b) => String(b.date).localeCompare(String(a.date)));

    REAL.news = {
      ...(REAL.news || {}),
      on_market: kept,
      generated_at: d.generated_at,
      live: true,
    };
    return true;
  } catch (e) {
    return false;                 // baked copy stands
  }
}

async function loadLiveData() {
  try {
    const r = await fetch("data/app_data.json", { cache: "no-cache" });
    if (!r.ok) return false;
    const d = await r.json();
    if (!d || !d.artists || !Object.keys(d.artists).length) return false;
    REAL = d;
    return true;
  } catch (e) {
    return false;                 // embedded copy stands
  }
}

/* ------------------------------------------------------------
   Theme. Three states, matching how the page is written: "system" leaves the

const THEME_KEY = "gallery.theme";

function systemPrefersDark() {
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function currentTheme() {
  const saved = (() => { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } })();
  if (saved === "dark" || saved === "light") return saved;
  // The desk is designed light — warm ivory, near-black, gold. Follow the
  // system only after she has expressed a preference; do not open dark on a
  // phone that happens to be in night mode.
  return "light";
}
function applyTheme(theme) {
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  else document.documentElement.removeAttribute("data-theme");
}
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
  renderTopbar();
}
const themeIcon = () => currentTheme() === "dark" ? ICON.sun : ICON.moon;

/* A story needs one stable identity for three different jobs \u2014 the bookmark

/* ============================================================
   HELPERS
   ============================================================ */
/* esc() stops a value breaking OUT of an attribute; it does not stop the value
   BEING a script. A URL here comes from a hand-typed data/manual_events.json,
   a house feed, or an RSS <link> we do not control — "javascript:..." in any of
   those renders as a live link that runs on click.

   Browsers strip TAB, LF and CR out of a URL before parsing it, so a scheme
   split across a newline still executes. Strip the control range first, then
   insist on http(s). Anything else returns "" and the caller renders plain text. */
const safeUrl = u => {
  const raw = String(u == null ? "" : u).replace(/[\u0000-\u0020]/g, "");
  return /^https?:\/\//i.test(raw) ? raw : "";
};

/* Order-only. The feed carries a price as the house PRINTED it ("\u20b99.98 cr"),
   with no number behind it, so ranking by value means reading the string back.
   Used to COMPARE and never to display \u2014 the printed string is always what
   reaches the page \u2014 and anything it cannot read returns null and drops out
   of the ranking rather than sorting as zero and passing for cheap. */
const LOT_UNIT = { lakh: 1e5, cr: 1e7, crore: 1e7 };
const lotValue = p => {
  const m = String(p == null ? "" : p).replace(/[\u20b9,\s]/g, "")
    .match(/^([0-9]+(?:\.[0-9]+)?)(lakh|cr|crore)?$/i);
  if (!m) return null;
  return parseFloat(m[1]) * (m[2] ? LOT_UNIT[m[2].toLowerCase()] : 1);
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* An overseas result is quoted by the trade in the currency it was set in;

  return `<div class="rec ${c.image ? "has-pic" : ""}">${workThumb(c.image, c.title || "", "t-rec")}
    <div class="rec-body">
      <div class="rec-work">${esc(c.title || "Untitled")}</div>

      <div class="rp-path">${path}</div>
      ${move}
    </div></div>`;
}

/* ---- sparkline: measured, so the endpoint dot stays round ---- */
function sparkline(values, width) {
  const w = Math.max(240, width), h = 128, padT = 12, padB = 22, padX = 5;
  const min = Math.min(...values), max = Math.max(...values), span = Math.max(1, max - min);
  const x = i => padX + (i * (w - padX * 2)) / (values.length - 1);
  const y = v => padT + (1 - (v - min) / span) * (h - padT - padB);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `M${x(0).toFixed(1)},${(h - padB).toFixed(1)} L${pts.split(" ").join(" L")} L${x(values.length - 1).toFixed(1)},${(h - padB).toFixed(1)} Z`;
  const lastX = x(values.length - 1), lastY = y(values[values.length - 1]);
  const mid = padT + (h - padT - padB) / 2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
      aria-label="Price index, 2016 base 100, rising to ${values[values.length - 1]}">
    <line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="var(--divider-soft)" stroke-width="1"/>
    <line x1="0" y1="${h - padB}" x2="${w}" y2="${h - padB}" stroke="var(--divider)" stroke-width="1"/>
    <path d="${area}" fill="var(--gold)" opacity="0.09"/>
    <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.5"/>
  </svg>`;
}

  { id: "ask",       label: "Ask AG Newsroom", icon: "ask", badge: () => "" }
];
/* Six tabs do not fit a 375px bar, so Ask lives in the More hub on a phone and
   on the rail everywhere else. It also has a card on Today, which is where she
   actually starts. */
const PHONE_TABS = ["today", "artists", "market", "clients", "more"];
const PUSHED = ["article", "search", "news", "newclient", "unlock"];
const tabForScreen = s => {
  if (s === "dossier") return "artists";
  if (s === "client") return "clients";
  /* The rail carries an entry per screen, so a screen with one lights it — News
     included, even though it is opened rather than tabbed to. The phone bar has
     only five slots, so there the same test is against those five. */
  if (isPad ? NAV.some(n => n.id === s) : PHONE_TABS.includes(s)) return s;
  /* A pushed screen highlights where it was opened from, so nothing goes blank
     while she is two screens deep. S.back is ONE value, not a stack, so
     recursing into it while it still names a pushed screen recurses for ever —
     that blanked the tab bar with a stack overflow. One hop, and a pushed screen
     opened from another lights that one only if it has a place of its own. */
  if (PUSHED.includes(s)) {
    const b = S.back;
    if (b && b !== s) {
      if (!PUSHED.includes(b)) return tabForScreen(b);
      if (isPad && NAV.some(n => n.id === b)) return b;
    }
    return isPad ? "today" : "more";
  }
  if (!isPad && (s === "calendar" || s === "knowledge" || s === "ask" || s === "value" || s === "alerts" || s === "more")) return "more";
  return s;
};

/* which screen a back chevron returns to, or null when nothing is pushed */
function backTarget() {
  // A pushed screen remembers where it was opened from — what the handoff
  // means by "a back pointer, not a full stack".
  if (S.screen === "newclient" || S.screen === "unlock") return "clients";
  if (PUSHED.includes(S.screen)) return S.back || (S.screen === "article" ? "news" : "today");
  if (!isSplit && S.screen === "dossier") return "artists";
  if (!isSplit && S.screen === "client") return "clients";
  if (!isPad && (S.screen === "calendar" || S.screen === "knowledge" || S.screen === "ask" || S.screen === "value" || S.screen === "alerts")) return "more";
  return null;
}

/* ============================================================
   SCREEN: TODAY
   ============================================================ */
function viewToday() {
  const liveDiary = CRM.live && CRM.diary && CRM.diary.configured && CRM.diary.today;
  const diary = !CRM.live
    ? `<div class="oneline">Sign in on the private site to see today\u2019s diary.</div>`
    : !liveDiary
      ? `<div class="oneline">Her calendar is not connected yet.</div>`
      : (CRM.diary.today.length
          ? `<div class="rows">` + CRM.diary.today.map(e => `
              <div class="diary">
                <div class="t tnum">${esc(e.allDay ? "all day" : (e.time || ""))}</div>
                <div><div class="ti">${esc(e.title)}</div>
                ${e.location ? `<div class="wh">${esc(e.location)}</div>` : ""}</div>
              </div>`).join("") + `</div>`
          : '<div class="oneline">Nothing in the diary today.</div>');

  const fups = !CRM.live
    ? `<div class="oneline">Follow-ups live with the client book.</div>`
    : (CRM.followups.length
        ? `<div class="rows">` + CRM.followups.map(f => `
            <div class="fu">
              <div class="row-top">
                <button class="fu-name" data-open-client="${esc(f.client_id)}">${esc(f.client_name)}</button>
                <span class="fu-age ${f.overdue ? "over" : ""}">${esc(f.age)}</span>
              </div>
              <div class="fu-why">${esc(f.reason || "")}</div>
              <div class="btnrow">
                <button class="chip" data-clear-followup="${esc(f.id)}">Mark done</button>
                <button class="btn" data-open-client="${esc(f.client_id)}">Open card</button>
              </div>
            </div>`).join("") + `</div>`
        : '<div class="oneline">Nothing owed. Rare.</div>');

  /* ---- Today, to the mockup (spec §3) ----------------------------------- */
  const ranked = allStories().filter(n => n.scope === "India")
    .sort((a, b) => b.score - a.score || byDateDesc(a, b));

  /* The top block is picture-led by design, so fill its three slots from the
     image-bearing stories first and only fall back to text when there are not
     three. Ranking still decides the order within each group — this breaks ties
     toward a story that can be seen, it does not promote a weak one. Stories
     reaching us through Google News never carry an image, so without this the
     lead frames render empty. */
  const withPic = ranked.filter(r => safeUrl(r.image));
  const noPic = ranked.filter(r => !safeUrl(r.image));
  const lead = [...withPic, ...noPic].slice(0, 3);
  const hero = lead[0];
  const seconds = lead.slice(1, 3);
  const rest = ranked.filter(r => !lead.includes(r));

  const due = CRM.live ? CRM.followups.length : 0;
  const closing = (REAL.events || []).filter(e => e.starts === todayIso()).length;
  const weekEnd = new Date(Date.parse(todayIso()) + 7 * 86400000).toISOString().slice(0, 10);
  const thisWeek = (REAL.events || []).filter(e => e.starts >= todayIso() && e.starts <= weekEnd).length;

  /* The handoff's three tiles and its Morning Brief.
     Every number is counted, not asserted, and the brief names what is actually
     in front of her — §11 forbids narrating a mood, so it does not. When there
     is genuinely nothing, it says so rather than reaching for something. */
  const marketStories = ranked.filter(r => r.reasons.some(x => x.kind === "market")).length;
  // Belt as well as braces: a key captured before a data swap is dropped here
  // rather than read off a set that no longer holds it.
  const deskArtists = [...new Set(ranked.flatMap(r => r.artists))].filter(k => ARTISTS[k]);
  const clientStories = ranked.filter(r => r.reasons.some(x => x.kind === "client"));

  const tiles = `<div class="tiles">
    <div class="tile"><div class="tv">${ranked.length}</div><div class="tl">Stories on the desk</div></div>
    <div class="tile"><div class="tv">${marketStories}</div><div class="tl">Market signals</div></div>
    <div class="tile"><div class="tv">${deskArtists.length}</div><div class="tl">Artists named</div></div>
  </div>`;

  const briefBits = [];
  if (deskArtists.length) {
    briefBits.push(listOf(deskArtists.slice(0, 3).map(k => ARTISTS[k].name))
      + (deskArtists.length > 3 ? " and others you track are" : (deskArtists.length === 1 ? " is" : " are"))
      + " named in this morning's stories.");
  }
  if (clientStories.length) {
    briefBits.push(`${clientStories.length === 1 ? "One story touches" : clientStories.length + " stories touch"} `
      + "someone in the book.");
  }
  if (thisWeek) briefBits.push(`${thisWeek} ${thisWeek === 1 ? "sale opens" : "sales open"} in the next seven days.`);
  if (due) briefBits.push(`${due} ${due === 1 ? "follow-up is" : "follow-ups are"} owed.`);
  const brief = briefBits.length ? `<div class="brief">
    <div class="bl">MORNING BRIEF</div>
    <div class="bb">${esc(briefBits.join(" "))}</div>
  </div>` : "";

  const stamp = (REAL.news || {}).generated_at || REAL.generated_at;
  const updated = stamp && String(stamp).length > 10
    ? "Updated " + String(stamp).slice(11, 16) + " UTC" : "";

  /* Hero: image with rank badge and category over it, then kicker, headline,
     summary and the reasons it ranked — the mockup's "Why it matters" line,
     except ours names the actual reason instead of promising an essay. */
  const heroCard = n => {
    if (!n) return `<div class="oneline">No headlines pulled yet.</div>`;
    const img = safeUrl(n.image), tag = newsTag(n);
    const inner = `
      ${img ? `<div class="hero-media">
          <img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.parentElement.remove()">
          <span class="rank">1</span>
          ${tag ? `<span class="hero-tag">${esc(tag)}</span>` : ""}
        </div>` : ""}
      <div class="hero-body">
        <div class="kicker">${esc(n.source)} \u00b7 ${esc(fmtDate(n.date))}</div>
        <h3 class="hero-head">${esc(n.headline)}</h3>
        ${n.why ? `<p class="hero-sum">${esc(n.why)}</p>` : ""}
        ${n.reasons.length ? `<div class="story-why">${n.reasons.map(r =>
          `<span class="why-chip ${esc(r.kind)}">${esc(r.label)}</span>`).join("")}</div>` : ""}
      </div>`;
    /* Opens the article rather than the publisher. The article screen is where
       the desk says which artists it names, what they have sold and who in the
       book collects them — and it carries the way out to the source. */
    return `<div class="hero"><button class="hero-link" data-open-story="${esc(n.key)}">${inner}</button>${markBtn(n)}</div>`;
  };

  const smallCard = (n, i) => {
    const img = safeUrl(n.image), tag = newsTag(n);
    const inner = `
      ${img ? `<div class="sc-media">
        <img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.parentElement.remove()">
        <span class="rank">${i + 2}</span>
        ${tag ? `<span class="hero-tag">${esc(tag)}</span>` : ""}
      </div>` : ""}
      <div class="sc-body">
        <div class="sc-meta">${img ? "" : `<span class="rank flat">${i + 2}</span>`}
          <span class="kicker">${esc(n.source)}</span></div>
        <h4>${esc(n.headline)}</h4>
      </div>`;
    return `<button class="sc" data-open-story="${esc(n.key)}">${inner}</button>`;
  };

  /* Market Pulse. Four tiles, all from real rows. The mockup's "7-day Indian
     Modern momentum" is not among them on purpose: rule 1 forbids indexing on
     median price without minimum comparables in both windows, and a week never
     has them. "International fairs this week" has no source. */
  const above = (REAL.feed || []).filter(f => f.vs_est && f.vs_est.dir === "above").length;
  // Every lot that carried an estimate, not every lot that missed the band —
  // a lot that sold inside its estimate did not clear the high either, and
  // leaving those out printed 52% where the record says 43%.
  const withEst = (REAL.feed || []).filter(f => f.est).length;
  /* "Top result" means the biggest price, which is what those two words say.
     It used to sort by the percentage over estimate, so the tile named a
     \u20b93.00 cr lot that beat its estimate by 651% while a \u20b99.98 cr Souza
     sat in the same feed \u2014 the top result understated by a factor of three.
     The percentage has its own place, on Market's Overview. */
  const top = (REAL.feed || []).filter(f => lotValue(f.price) != null)
    .sort((a, b) => lotValue(b.price) - lotValue(a.price))[0];
  const pulse = [
    { i: ICON.rupee,  v: top ? top.price : "\u2014", l: "Top result", s: top ? top.artist : "no results yet" },
    { i: ICON.market, v: withEst ? Math.round(above / withEst * 100) + "%" : "\u2014", l: "Above high est.", s: `of ${withEst} lots with an estimate` },
    { i: ICON.gavel,  v: String(thisWeek), l: "Sales this week", s: thisWeek ? "in the diary" : "none scheduled" },
    { i: ICON.globe,  v: String((REAL.events || []).length), l: "Sales ahead", s: "in the diary" },
  ].map(t => `<div class="pulse"><span class="pi">${I(t.i, 15)}</span>
      <div class="pv tnum">${esc(t.v)}</div>
      <div class="pl">${esc(t.l)}</div>
      <div class="ps">${esc(t.s)}</div></div>`).join("");

  /* Watchlist. Real artists, real twelve-month move, real sparkline — and where
     the comparable count is too thin to quote a move, it says so instead of
     printing a number. */
  const watch = (REAL.trending || []).map(k => ARTISTS[k]).filter(Boolean).slice(0, 3);
  const watchRows = watch.length
    ? `<div class="rows">` + watch.map(a => {
        const d = a.stats.delta;
        return `<button class="wrow" data-open-artist="${esc(a.key)}">
          <span class="wn">${esc(a.name)}<span class="wr">${d
            ? esc(d) + " over 12 months"
            : "not enough comparable lots to quote a move"}</span></span>
          <span class="wspark" data-spark="${esc(a.key)}"></span>
        </button>`;
      }).join("") + `</div>`
    : `<div class="oneline">No artist has enough comparable lots in both windows to rank a move.</div>`;

  const dayRows = [
    due ? { i: ICON.clients, n: due, t: `follow-up${due === 1 ? "" : "s"} due`, nav: "clients" } : null,
    closing ? { i: ICON.gavel, n: closing, t: `auction${closing === 1 ? "" : "s"} closing today`, nav: "calendar" } : null,
    thisWeek ? { i: ICON.calendar, n: thisWeek, t: `sale${thisWeek === 1 ? "" : "s"} this week`, nav: "calendar" } : null,
  ].filter(Boolean);
  const yourDay = dayRows.length
    ? `<div class="rows">` + dayRows.map(r => `<button class="dayrow" data-nav="${r.nav}">
        <span class="di">${I(r.i, 15)}</span><span class="dt"><b class="tnum">${r.n}</b> ${esc(r.t)}</span>${I(ICON.chev, 15)}</button>`).join("") + `</div>`
    : `<div class="oneline">Nothing owed today.${CRM.live ? "" : " Sign in for the client book."}</div>`;

  const moreRows = rest.length
    ? `<div class="rows">` + rest.map(n => {
        const img = safeUrl(n.image);
        const body = `
          <div class="mf-body">
            <div class="kicker">${esc(n.source)} \u00b7 ${esc(fmtDate(n.date))}</div>
            <h4>${esc(n.headline)}</h4>
          </div>
          ${img ? `<img class="mf-img" src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}`;
        return `<div class="mf"><button class="mf-link" data-open-story="${esc(n.key)}">${body}</button>
          ${markBtn(n)}</div>`;
      }).join("") + `</div>`
    : `<div class="oneline">Nothing further today.</div>`;

  return `
    <div class="view-head">
      <span class="date tnum">${esc(todayLong())}</span>
      <h1>Good morning, Aashna</h1>
      <p>Your art-market briefing is ready.</p>
    </div>
    <div class="view-body">
      ${tiles}${brief}
      <div class="sec">${sectionHead("Top stories", updated)}
        <button class="more-link" data-nav="news">See all news →</button>
        <div class="topblock">
          ${heroCard(hero)}
          ${seconds.length ? `<div class="scrow">${seconds.map(smallCard).join("")}</div>` : ""}
        </div>
      </div>

      <div class="sec">${sectionHead("Market pulse")}<div class="pulserow">${pulse}</div></div>

      <div class="sec">${sectionHead("Watchlist", "12-month move")}${watchRows}</div>

      ${CRM.ai ? `<div class="sec">${sectionHead("Ask AG Newsroom")}
        <div class="ask-cta">
          <p>Her diary, the client book, the headlines and the auction record, read together.</p>
          <div class="chiprow">
            ${ASK_SUGGESTIONS.slice(0, 3).map(t =>
              `<button class="chip" data-ask-sugg="${esc(t)}">${esc(t)}</button>`).join("")}
            <button class="chip" data-nav="ask">Ask something else</button>
          </div>
        </div></div>` : ""}

      <div class="sec">${sectionHead("Your day")}${yourDay}</div>

      <div class="cols two">
        <div class="col sec">${sectionHead("Today\u2019s diary")}${diary}</div>
        <div class="col sec">${sectionHead("Follow-ups due")}${fups}</div>
      </div>

      <div class="sec">${sectionHead("More from the art world", updated)}${moreRows}
        <button class="more-link" data-nav="news">Open the news desk →</button></div>
    </div>`;
}


/* ============================================================
   SCREEN: NEWS FEED
   ============================================================ */
/* The handoff's three tabs. "For You" is her market ranked by the same scorer
   that draws the chips; "All news" is everything the desk pulled, newest first,
   both pools; "Saved" is the bookmark set, which until now was write-only —
   the toggle existed on every card and there was nowhere to read the result. */
const NEWS_TABS = [["foryou", "For you"], ["all", "All news"], ["saved", "Saved"]];

function newsRows(tab) {
  const all = allStories();
  if (tab === "saved") return all.filter(isMarked).sort(byDateDesc);
  if (tab === "all") return all.slice().sort(byDateDesc);
  return all.filter(n => n.scope === "India")
            .sort((a, b) => b.score - a.score || byDateDesc(a, b));
}

function viewNews() {
  const tab = S.newsTab;
  const rows = newsRows(tab);
  const all = allStories();
  const stamp = (REAL.news || {}).generated_at || REAL.generated_at;
  const updated = stamp && String(stamp).length > 10
    ? "Updated " + String(stamp).slice(11, 16) + " UTC" : "";

  const empty =
      tab === "saved" ? `<div class="empty">Nothing saved yet. The bookmark on any
        story keeps it here, on this device.</div>`
    : `<div class="empty">No headlines pulled yet. The nightly refresh fills this.</div>`;

  const counts = { foryou: all.filter(n => n.scope === "India").length,
                   all: all.length, saved: all.filter(isMarked).length };

  return `<div class="view-head"><h1>News</h1>
      <p>${esc(all.length + (all.length === 1 ? " story" : " stories") + " on the desk")}</p></div>
    <div class="view-body">
      <div class="seg seg-tabs">
        ${NEWS_TABS.map(([k, l]) =>
          `<button data-news="${k}" aria-pressed="${tab === k}">${esc(l)}<span class="tabn tnum">${counts[k]}</span></button>`).join("")}
      </div>
      <div class="sec" style="margin-top:20px">
        ${sectionHead(tab === "saved" ? "Saved" : tab === "all" ? "Everything pulled" : "Ranked for you", updated)}
        ${rows.length ? `<div class="rows">${rows.map(storyCard).join("")}</div>` : empty}
      </div>
    </div>`;
}

/* ============================================================
   SCREEN: ARTICLE
   ============================================================ */
/* The handoff wants "What Happened" prose and a Market Impact badge. The
   pipeline stores a headline, a source, a date, a picture and a link — there is
   no body text to summarise and no impact figure to grade, and writing either
   would be the desk asserting something it cannot show. So neither is here.
   What IS here is everything the record does hold about the story: why it
   ranked, which tracked artists it names, what those artists have sold lately,
   who in the book collects them, and the way out to the publisher. */
function articleResults(keys) {
  const seen = new Set();
  const rows = [];
  for (const k of keys) {
    for (const f of (REAL.feed || [])) {
      if (f.artist_key !== k || seen.has(f.url || f.title)) continue;
      seen.add(f.url || f.title);
      rows.push({ artist: f.artist, title: f.title, house: f.house, date: f.date, price: f.price,
                  url: f.url, vs: f.vs_est, image: f.image });
      if (rows.length >= 6) return rows;
    }
    const a = ARTISTS[k];
    for (const r of ((a && a.records) || []).slice(0, 3)) {
      const id = r.url || (r.title + r.date);
      if (seen.has(id)) continue;
      seen.add(id);
      rows.push({ artist: a.name, title: r.title, house: r.house, date: r.date, price: r.price,
                  url: r.url, vs: null, image: r.image });
      if (rows.length >= 6) return rows;
    }
  }
  return rows;
}

function viewArticle(embedded) {
  const n = storyByKey(S.article);
  const head = t => `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
    <h1>${esc(t)}</h1></div>`;
  if (!n) {
    return head("Story") + `<div class="view-body"><div class="empty">That story is no
      longer in the feed. The desk keeps what the last refresh returned, not an archive.</div></div>`;
  }

  const img = safeUrl(n.image), tag = newsTag(n), out = safeUrl(n.url);
  const artists = (n.artists || []).map(k => ARTISTS[k]).filter(Boolean);
  const results = articleResults(n.artists || []);

  /* The client angle only exists when the book is open on this device, and it
     is built the same way the chip is counted — one matcher, not two. */
  const hay = ((n.headline || "") + " " + (n.why || "")).toLowerCase();
  const interested = (CRM.live && CRM.clients)
    ? CRM.clients.filter(c => wantsMatchStory(c, hay, n.artists || [])) : [];

  const signals = (n.signals || []).map(sg =>
    `<div class="sig ${sg.on ? "on" : "off"}"><span class="sd"></span>${esc(sg.label)}</div>`).join("");

  return `
    <div class="view-head article-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      ${img ? `<div class="art-media"><img src="${esc(img)}" alt="" loading="lazy"
        decoding="async" onerror="this.parentElement.remove()"></div>` : ""}
      <div class="art-kick">
        ${tag ? `<span class="hero-tag static">${esc(tag)}</span>` : ""}
        <span class="kicker">${esc(n.source || "")}${n.date ? " · " + esc(fmtDate(n.date)) : ""}</span>
        ${markBtn(n)}
      </div>
      <h1>${esc(n.headline)}</h1>
      ${n.why ? `<p class="art-sum">${esc(n.why)}</p>` : ""}
    </div>
    <div class="view-body" ${embedded ? 'style="padding-left:0"' : ""}>
      <div class="sec" style="margin-top:0">${sectionHead("Why it is on the desk", "scored " + n.score + " of 100")}
        ${(n.reasons || []).length ? `<div class="story-why">${n.reasons.map(r =>
          `<span class="why-chip ${esc(r.kind)}">${esc(r.label)}</span>`).join("")}</div>` : ""}
        <div class="sigs">${signals}</div>
        <div class="foot-note">Ranked by rule, not by opinion — recency, Indian
          relevance, auction language, the artists you track and the book. No summary
          of the piece is written here: the desk holds the headline and the link,
          not the article.</div>
      </div>

      ${artists.length ? `<div class="sec">${sectionHead("Artists named", artists.length + " on the desk")}
        <div class="chiprow" style="padding-left:0;padding-right:0;margin:10px 0 0;flex-wrap:wrap;overflow:visible">
          ${artists.map(a => `<button class="chip" data-open-artist="${esc(a.key)}">${esc(a.name)}</button>`).join("")}
        </div></div>` : ""}

      ${results.length ? `<div class="sec">${sectionHead("What they have sold", "on the record")}
        <div class="rows">${results.map(r => {
          const u = safeUrl(r.url);
          const inner = `${workThumb(r.image, [r.artist, r.title].filter(Boolean).join(" — "), "t-ares")}
            <div class="ares-b">
              <div class="ares-t">${esc(r.artist)}${r.title ? " — " + esc(r.title) : ""}</div>
              <div class="ares-m">${esc(r.house || "")}${r.date ? " · " + esc(fmtDate(r.date)) : ""}</div>
            </div>
            <div class="ares-p tnum ${r.vs && r.vs.dir === "above" ? "up" : ""}">${esc(r.price || "—")}</div>`;
          return u ? `<a class="ares" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
                   : `<div class="ares">${inner}</div>`;
        }).join("")}</div></div>` : ""}

      ${interested.length ? `<div class="sec">${sectionHead("Client angle", interested.length + " in the book")}
        <div class="accent-box">
          <div class="what">${esc(listOf(interested.slice(0, 4).map(c => c.name.split(" ")[0])))}
            ${interested.length === 1 ? "has" : "have"} asked for work in this area.</div>
        </div>
        <div class="rows">${interested.slice(0, 6).map(c => `
          <button class="row" data-open-client="${esc(c.id)}">
            <div class="row-top"><span class="row-name">${esc(c.name)}</span>${I(ICON.chev, 16)}</div>
            <div class="row-sub">${esc([c.tier, c.focus].filter(Boolean).join(" · "))}</div>
          </button>`).join("")}</div></div>` : ""}

      ${out ? `<div class="btnrow" style="margin-top:24px">
        <a class="btn btn-primary btn-block" href="${esc(out)}" target="_blank"
           rel="noopener noreferrer">Read it at ${esc(n.source || "the publisher")} →</a>
      </div>` : `<div class="foot-note">This story arrived without a usable link.</div>`}
    </div>`;
}

/* ============================================================
   SCREEN: ARTISTS + DOSSIER
   ============================================================ */
const initials = name => String(name || "").trim().split(/\s+/)
  .filter(w => /[A-Za-z]/.test(w)).slice(-2).map(w => w[0]).join("").toUpperCase() || "\u2014";

/* The handoff ranks this list by momentum and shows an arrow beside each name.
   Ours shows the twelve-month move where the record supports one and says so
   where it does not — rule 1: a move computed off too few comparables is noise,
   and delta_12mo is already null in exactly those cases. */
function artistListRows() {
  return `<div class="rows arows">` + artistKeys.map(k => {
    const a = A(k), sel = isSplit && S.artist === k;
    const d = a.stats.delta ? parseFloat(a.stats.delta) : null;
    const dir = d == null ? "" : d > 0 ? "\u2191" : d < 0 ? "\u2193" : "\u2192";
    return `<button class="arow${sel ? " on" : ""}" data-open-artist="${k}">
      <span class="av">${esc(initials(a.name))}</span>
      <span class="ab">
        <span class="an">${esc(a.name)}</span>
        <span class="ay">${[a.years, a.movement].filter(Boolean).map(esc).join(" \u00b7 ")}</span>
      </span>
      <span class="am ${d == null ? "flat" : d > 0 ? "up" : d < 0 ? "down" : "flat"}">
        ${d == null ? `<span class="none">Not enough comparables</span>`
                    : `${dir} ${esc(a.stats.delta)}`}
      </span>
    </button>`;
  }).join("") + `</div>`;
}

function viewArtists() {
  const list = `
    <div class="view-head"><h1>Artists</h1>
      <p>${Object.keys(ARTISTS).length} artists with enough depth to price</p></div>
    <div class="view-body">
      <button class="btn btn-primary btn-block" data-act="open-search" style="margin-bottom:6px">${I(ICON.search, 15)} Search the desk</button>
      <div class="sec">${sectionHead("Tracked artists", artistKeys.length + " names")}${artistListRows()}</div>
    </div>`;
  if (!isSplit) return list;
  return `<div class="split">
    <div class="list">
      <div style="padding-top:26px">
        <button class="btn btn-primary btn-block" data-act="open-search">${I(ICON.search, 15)} Search</button>
      </div>
      <div class="sec" style="margin-top:24px">${sectionHead("Artists", artistKeys.length)}${artistListRows()}</div>
    </div>
    <div class="detail">${viewDossier(true)}</div>
  </div>`;
}

function viewDossier(embedded) {
  const a = A(S.artist);
  // loadLiveData() can swap REAL mid-session now that it actually works, so a
  // key captured by an earlier render can disappear under us.
  if (!a) {
    return `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <h1>Artists</h1></div>
      <div class="view-body"><div class="empty">That artist is no longer in the tracked set.</div></div>`;
  }
  const houses = ["All"].concat(a.records.map(r => r.house).filter((h, i, arr) => arr.indexOf(h) === i));
  const rows = a.records.filter(r => S.houseFilter === "All" || r.house === S.houseFilter);

  // No sell-through tile: unsold lots are absent from public results, so the
  // figure cannot be computed honestly. "Above high est." can, and is more use.
  const st = a.stats;
  const stats = [
    { k: "Highest result", v: st.high },
    { k: "Median, 12 mo", v: st.avg },
    { k: "Lots, 12 mo", v: st.lots12 },
    { k: "Lots on record", v: st.lotsTotal || "\u2014" },
    { k: "Above high est.", v: st.above },
    { k: "\u0394 12 mo, per sq in", v: st.delta || "Not enough", gold: !!st.delta, quiet: !st.delta }
  ].map(x => `<div class="stat ${x.gold ? "gold" : ""}${x.quiet ? " quiet" : ""}">`
    + `<div class="v tnum">${esc(x.v)}</div><div class="k">${esc(x.k)}</div></div>`).join("");

  const basis = st.deltaBasis || {};
  // Always show both medians and both samples: the percentage is consignment-
  // weighted, not quality-adjusted, and must not travel on its own.
  const deltaNote = st.delta
    ? `Median \u20b9${(basis.ppsi_now || 0).toLocaleString()} per sq in on ${esc(basis.medium || "comparable")} works this year against \u20b9${(basis.ppsi_prior || 0).toLocaleString()} last, from ${basis.n_now} lots and ${basis.n_prior}. Consignment-weighted, not adjusted for quality.`
    : `Not enough comparable lots to quote a 12-month move${basis.n_now != null ? ` \u2014 ${basis.n_now} this year, ${basis.n_prior} last` : ""}. The figures above still stand.`;

  // Sell-through deliberately has no tile and no note: unsold lots are absent
  // from public results, so any figure would read near 100% and be false.
  const sellNote = "";

  /* The picture sits beside the record. Half this market's works are genuinely
     untitled, so without it the column reads "Untitled, Untitled, Untitled" and
     nothing distinguishes a ₹61.8 cr canvas from a ₹17 lakh drawing. A record
     with no picture simply has no column — the text takes the full width rather
     than sitting next to an empty frame. */
  const recs = rows.map(r => {
    const pic = workThumb(r.image, [a.name, r.work].filter(Boolean).join(" \u2014 "), "t-rec");
    return `
    <div class="rec${pic ? " has-pic" : ""}">
      ${pic}
      <div class="rec-body">
        <div class="rec-top">${houseTag(r.house)}<span class="row-meta tnum">${esc(r.date)}</span></div>
        <div class="rec-work">${esc(r.work)}</div>
        <div class="rec-med">${esc(r.medium)}${r.sale ? " \u00b7 " + esc(r.sale) : ""}${r.nat ? ' \u00b7 <span style="color:var(--gold-ink)">Art Treasure, non-exportable</span>' : ""}</div>
        <div class="rec-foot">
          <div><div class="rec-est tnum">${r.est.charAt(0) === "\u20b9" ? "Est. " + esc(r.est) : esc(r.est)}</div>
            ${r.up ? '<div class="pill up" style="margin-top:7px"><span class="dot"></span>above high estimate</div>' : ""}${r.resold ? '<div class="pill" style="margin-top:7px"><span class="dot"></span>sold more than once</div>' : ""}</div>
          <div><div class="rec-price tnum ${r.up ? "up" : ""}">${esc(r.price)}</div>${nativeTag(r.native)}</div>
        </div>
      </div>
    </div>`;
  }).join("");

  const talk = a.talking.map(t => `<div class="talk"><span class="mk">§</span><span>${esc(t)}</span></div>`).join("");

  const q = encodeURIComponent(a.name);
  const elsewhere = [
    { n: "Artprice", u: `https://www.artprice.com/artist/search?q=${q}` },
    { n: "MutualArt", u: `https://www.mutualart.com/Search?query=${q}` },
    { n: "Saffronart", u: `https://www.saffronart.com/artist/artistsearch.aspx?q=${q}` }
  ].map(x => `<a class="btn" href="${x.u}" target="_blank" rel="noopener noreferrer">${x.n}</a>`).join("");

  const holders = CRM.live
    ? CRM.clients.filter(cl => {
        const d = CRM.detail[cl.id];
        return d && (d.holdings || []).some(h => h.artist_key === S.artist);
      })
    : [];
  const collectors = holders.map(cl => `
    <button class="row" data-open-client="${esc(cl.id)}">
      <div class="row-top"><span class="row-name">${esc(cl.name)}</span>${I(ICON.chev, 16)}</div>
      <div class="row-sub">${esc([cl.tier, cl.city].filter(Boolean).join(" \u00b7 "))}</div>
    </button>`).join("");

  return `
    <div class="view-head dossier-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <div class="prof">
        <span class="pav">${esc(initials(a.name))}</span>
        <span class="pb">
          <h1>${esc(a.name)}</h1>
          <span class="py">${[a.years, a.movement].filter(Boolean).map(esc).join(" \u00b7 ")}</span>
        </span>
        ${st.delta ? `<span class="pm ${parseFloat(st.delta) >= 0 ? "up" : "down"}">
          ${parseFloat(st.delta) >= 0 ? "\u2191" : "\u2193"} ${esc(st.delta)}</span>` : ""}
      </div>
      <div style="margin-top:12px">${bellButton(S.artist)}</div>
      ${watchSheet(S.artist)}
    </div>
    <div class="view-body" ${embedded ? 'style="padding-left:0"' : ""}>
      <div class="sec">${sectionHead("Market card")}
        <div class="stats">${stats}</div>
        ${a.index.length > 1 ? `
          <div class="chart" data-spark="${esc(S.artist)}"></div>
          <div class="chart-cap">
            <span class="tnum">${a.indexYears[0]} = 100${st.indexHouses.length ? " \u00b7 " + esc(st.indexHouses.join(", ")) : ""}</span>
            <span class="tnum">${a.indexYears[a.indexYears.length - 1]} \u00b7 ${a.index[a.index.length - 1]}</span>
          </div>` : ""}
        <div class="foot-note">${deltaNote}${sellNote}</div>
      </div>

      ${a.bio ? `<div class="sec">${sectionHead("Biography")}
        <div class="bio ${S.bioOpen ? "" : "clamped"}" id="bio">${esc(a.bio)}</div>
        <button class="more-link" data-act="toggle-bio">${S.bioOpen ? "Show less" : "Read more"}</button>
        <div class="tags">${a.themes.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>` : ""}

      ${a.upcoming.length ? `<div class="sec">${sectionHead("Coming to auction", a.upcoming.length + (a.upcoming.length === 1 ? " lot" : " lots"))}
        <div class="rows">${a.upcoming.map(upcomingRow).join("")}</div>
        <div class="foot-note">Forthcoming catalogues at Christie's, Bonhams, Pundole's and AstaGuru, refreshed nightly. Saffronart does not publish its catalogues before a sale.</div>
      </div>` : ""}

      ${a.repeats.length ? `<div class="sec">${sectionHead("Sold more than once", st.repeatAnnualised != null ? `${st.repeatAnnualised >= 0 ? "+" : ""}${st.repeatAnnualised}% a year, median of ${st.repeatBasis}` : a.repeats.length + (a.repeats.length === 1 ? " work" : " works"))}
        <div class="rows">${a.repeats.map(repeatRow).join("")}</div>
        <div class="foot-note">The same physical work, matched by its picture across sales — never on title and size alone. Prices as published, premium included. ${st.repeatAnnualised == null ? "No annualised figure is quoted from fewer than three resales." : "The annualised figure is the median across these resales; each one is a single work and a single pair of dates."}</div>
      </div>` : ""}

      <div class="sec">${sectionHead("Auction record", rows.length + " of " + a.records.length)}
        <div class="chiprow">${houses.map(h => `<button class="chip" data-house="${esc(h)}" aria-pressed="${S.houseFilter === h}">${esc(h)}</button>`).join("")}</div>
        <div class="rows">${recs}</div>
        <div class="foot-note">Realised prices include buyer\u2019s premium, as the houses publish them. Source: ${esc(listOf(REAL.coverage.houses))} public results. Unsold lots are not published, so no sell-through figure is quoted anywhere on this desk.</div>
      </div>

      <div class="sec">${sectionHead("Look up elsewhere")}
        <div class="btnrow" style="margin-top:16px"><button class="btn btn-primary" data-act="value-for" data-artist="${esc(S.artist)}">${I(ICON.value, 15)} Value a ${esc(a.name.split(" ").pop())}</button>${elsewhere}</div>
        <div class="foot-note">Opens in your own subscription. Their results stay on their site \u2014 this desk holds only what the houses publish.</div>
      </div>

      <div class="cols two">
        ${a.talking.length ? `<div class="col sec">${sectionHead("Talking points")}<div class="rows">${talk}</div></div>` : ""}
        <div class="col sec">${sectionHead("On your book")}<div class="rows">${collectors || `<div class="empty">${CRM.live ? "No client on your book holds this artist." : "Sign in to see who holds this artist."}</div>`}</div></div>
      </div>
    </div>`;
}

/* ============================================================
   SCREEN: MARKET
   ============================================================ */
/* A result is a picture first. loading="lazy" because forty house-hosted JPEGs
   should not block the tab, and decoding="async" so a slow one cannot stall the
   rest of the list. Referrer stays on so the houses can see it is us — they
   serve our origin, and it is their image. */
/* Saffronart's stored URL is the _aucres variant at 109x109 — soft in an 80px
   slot on a retina screen. _thumb is 159x159 for three more kilobytes, which is
   what that slot wants, so try it and fall back to the stored one where a lot
   has no such variant. The full-size original exists too: 2800px and a megabyte.
   Never that, forty times over. */
function lotThumbFail(img) {
  const fb = img.getAttribute("data-fallback");
  if (fb && !img.src.endsWith(fb)) {
    img.removeAttribute("data-fallback");
    img.src = fb;
    return;
  }
  // Keep the size class, or the placeholder collapses to a different box than
  // the picture it is standing in for.
  const size = [...img.classList].find(c => c.startsWith("t-")) || "";
  img.replaceWith(Object.assign(document.createElement("div"),
    { className: `thumb ${size} ph`, textContent: "no image" }));
}

/* loading="lazy" because forty house-hosted JPEGs should not block the tab, and
   decoding="async" so one slow image cannot stall the list. */
/* One implementation, three call sites: the results feed, an artist's auction
   record, and the result rows on an article or a search. They must not drift —
   the Saffronart variant swap and the fallback are easy to get subtly wrong
   twice. `cls` only sizes the box; the fit is always contain.

   Where there is no picture this renders NOTHING, not a frame saying so, except
   in the results feed where the card's grid reserves the column and an empty
   cell would read as a broken image. */
/* The houses that can serve a small picture, and how to ask for one. A URL
   that matches nothing is returned as it came. */
function thumbUrl(u) {
  if (u.includes("_aucres.")) return u.replace("_aucres.", "_thumb.");
  if (u.startsWith("https://www.christies.com/img/lotimages/")) return u + (u.includes("?") ? "&" : "?") + "w=400";
  if (u.startsWith("https://images1.bonhams.com/image?")) return u + "&width=400";
  return u;
}

function workThumb(image, alt, cls, placeholder) {
  const orig = safeUrl(image);
  if (!orig) return placeholder ? `<div class="thumb ${cls} ph">no image</div>` : "";
  const shown = thumbUrl(orig);
  /* Saffronart publishes a thumbnail (_thumb, 159px, ~15 KB) and Christie's and
     Bonhams resize on request (measured 2026-09-11: 400px for ~14 KB). AstaGuru
     and Pundole's serve the print scan and nothing else — measured: ~195 KB and
     ~1.1 MB a picture, no size variant, no resize parameter, no WebP
     negotiation. So these must never compete with the page: lazy keeps them off
     the wire until she scrolls to them, async keeps the decode off the main
     thread, and low priority keeps them behind everything that matters. */
  return `<img class="thumb ${cls}" src="${esc(shown)}" alt="${esc(alt || "")}"
    ${shown !== orig ? `data-fallback="${esc(orig)}"` : ""}
    loading="lazy" decoding="async" fetchpriority="low" onerror="lotThumbFail(this)">`;
}

function lotThumb(f) {
  return workThumb(f.image, [f.artist, f.title].filter(Boolean).join(" \u2014 ") || "Lot",
                   "t-lot", true);
}

function marketResults() {
  if (!REAL.feed.length) return `<div class="oneline">No results yet.</div>`;

  /* The mockup's two dropdowns, as chips. Both filter on values that exist in
     the row — house, and where the hammer landed against the estimate. There is
     no category filter because the feed carries no category; a control that
     cannot filter anything is worse than no control. */
  const houses = ["All", ...new Set(REAL.feed.map(f => f.house).filter(Boolean))];
  const perfs = [["All", "All lots"], ["above", "Above estimate"], ["below", "Below estimate"]];
  const rows = REAL.feed.filter(f =>
    (S.resHouse === "All" || f.house === S.resHouse) &&
    (S.resPerf === "All" || (f.vs_est && f.vs_est.dir === S.resPerf)));

  const filters = `<div class="filterbar">
    <div class="fgroup">${houses.map(h =>
      `<button class="fchip" data-res="house:${esc(h)}" aria-pressed="${S.resHouse === h}">${esc(h === "All" ? "All houses" : h)}</button>`).join("")}</div>
    <div class="fgroup">${perfs.map(([k, l]) =>
      `<button class="fchip" data-res="perf:${esc(k)}" aria-pressed="${S.resPerf === k}">${esc(l)}</button>`).join("")}</div>
  </div>`;

  if (!rows.length) return filters + `<div class="oneline">No lots match that filter.</div>`;

  return filters + `<div class="rows">` + rows.map(f => {
    const k = f.artist_key && ARTISTS[f.artist_key] ? f.artist_key : null;
    const v = f.vs_est;
    const lot = safeUrl(f.url);

    /* Half this market's works genuinely have no title — Saffronart publishes
       none at all for the StoryLTD online sales, and AstaGuru's own lot page
       for one of these is headed "Untitled". Printing the word twenty times in
       a column is noise, not information. Where there is a medium and a size,
       show those instead; where there is nothing, let the picture do the work
       and say nothing. A real title is always shown. */
    const titled = (f.title || "").trim() && (f.title || "").trim().toLowerCase() !== "untitled";
    const meta = [f.medium, f.size].filter(Boolean).join(" \u00b7 ");
    const desc = titled
      ? `<div class="lot-title">${esc(f.title)}</div>${meta ? `<div class="lot-meta">${esc(meta)}</div>` : ""}`
      : meta
        ? `<div class="lot-meta">${esc(meta)}</div>`
        : "";

    const inner = `
      ${lotThumb(f)}
      <div>
        <div class="lot-top">${houseTag(f.house)}<span class="row-meta tnum">${esc(fmtDate(f.date))}</span></div>
        <div class="lot-artist">${esc(f.artist || "\u2014")}</div>
        ${desc}
        <div class="lot-foot">
          <div class="lot-est">${f.est ? `Est. <span class="tnum">${esc(f.est)}</span>` : ""}</div>
          <div>
            <div class="lot-price tnum">${esc(f.price || "\u2014")}</div>${nativeTag(f.native)}
            ${v ? `<div class="lot-vs ${v.dir} tnum">${v.dir === "above" ? "\u2191" : "\u2193"} ${v.pct}% ${v.dir === "above" ? "above high est." : "below low est."}</div>` : ""}
          </div>
        </div>
      </div>`;

    /* The card opens the lot at the house — AstaGuru lands on the work itself,
       Saffronart on the catalogue that holds it. The dossier link has to sit
       OUTSIDE that anchor: a button inside an <a> is invalid and swallows the
       tap. It only appears for the artists the desk actually tracks. */
    const card = lot
      ? `<a class="lotcard" href="${esc(lot)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<div class="lotcard">${inner}</div>`;

    return k
      ? `<div class="lotwrap">${card}
           <button class="chip lot-dossier" data-open-artist="${esc(k)}">${esc(f.artist)} on the desk \u2192</button>
         </div>`
      : card;
  }).join("") + `</div>`;
}

function marketTrending() {
  const rows = REAL.trending.map(k => ARTISTS[k]).filter(Boolean);
  if (!rows.length) return '<div class="empty">No artist has enough comparable lots in both windows to rank a move.</div>';
  return `<div class="rows">` + rows.map((a, i) => {
    const b = a.stats.deltaBasis || {};
    return `<button class="trend" data-open-artist="${esc(a.key || REAL.trending[i])}">
      <span class="rk tnum">${String(i + 1).padStart(2, "0")}</span>
      <span><span class="nm">${esc(a.name)}</span>
        <span class="mt tnum" style="display:block">${esc(b.medium || "")}, ${b.n_now} v ${b.n_prior} lots</span></span>
      <span><span class="dl tnum ${parseFloat(a.stats.delta) >= 15 ? "hot" : ""}">${esc(a.stats.delta)}</span>
        <span class="av tnum" style="display:block">med ${esc(a.stats.avg)}</span></span>
    </button>`;
  }).join("") + `</div>`;
}

function marketFx() {
  return `<div class="rows fx-list">` + FX.map(f => `
    <div class="fxr tnum"><span class="p">${esc(f.pair)}</span>
      <span><span class="r">${esc(f.rate)}</span></span></div>`).join("")
    + (FX_AS_OF ? `<div class="fxr tnum"><span class="p">as of</span><span class="r" style="font-size:14.7px">${esc(FX_AS_OF)}</span></div>` : "")
    + `</div>`;
}

/* The handoff's Overview leads on "₹56.8 Cr ↑22%, total auction turnover vs the
   previous 30 days" over a sparkline. Neither figure is built here, and not for
   want of trying:

     the total  — a house's results page lists the lots that SOLD. A turnover
                  summed from that is a sum of part of the market printed as all
                  of it, and the desk carries prices as they were published
                  ("₹53.5 cr"), not as numbers to add up.
     the move   — two thirty-day windows in this market routinely hold one sale
                  against three. A percentage across them measures the auction
                  calendar, not the market. Same rule that keeps a 7-day
                  momentum tile off Today and a delta off a thin artist.

   Counts survive both objections, so counts are what this is. Everything below
   is countable from rows the desk stores. */
function marketOverview() {
  const feed = REAL.feed || [];
  /* The denominator is every lot that CARRIED an estimate, not every lot that
     missed the band. `vs_est` is null for a lot that landed inside its estimate
     — the pipeline says so in as many words — and those lots were estimated and
     did not clear the high, so dropping them from the bottom of the fraction
     only makes the market look hotter than it was. Seven of forty landed inside
     the band here: 17 of 33 reads 52%, 17 of 40 reads 43%.
     `_above_rate()` in build_desk.py has always divided by the estimated set;
     this now agrees with it. */
  const estimated = feed.filter(f => f.est);
  const priced = feed.filter(f => f.vs_est);
  const above = priced.filter(f => f.vs_est.dir === "above");
  const below = priced.filter(f => f.vs_est.dir === "below");
  const houses = [...new Set(feed.map(f => f.house).filter(Boolean))];
  const dates = feed.map(f => f.date).filter(Boolean).sort();
  const span = dates.length
    ? (dates[0] === dates[dates.length - 1] ? fmtDate(dates[0])
       : fmtDate(dates[0]) + " – " + fmtDate(dates[dates.length - 1]))
    : "";

  const tiles = `<div class="tiles three">
    <div class="tile"><div class="tv">${feed.length}</div><div class="tl">Lots in the latest results</div></div>
    <div class="tile"><div class="tv">${above.length}<span class="of"> of ${estimated.length}</span></div>
      <div class="tl">Cleared the high estimate</div></div>
    <div class="tile"><div class="tv">${houses.length}</div><div class="tl">Houses reporting</div></div>
  </div>${span ? `<div class="foot-note" style="margin-top:10px">${esc(span)} · ${esc(listOf(houses))}</div>` : ""}`;

  /* Ordered on the percentage the pipeline already computed against the
     estimate. An integer comparison — no money is parsed or re-formatted here,
     which is where the two formatters have disagreed before. */
  const estRow = (rows, dir) => rows.length
    ? `<div class="rows">` + rows.slice().sort((a, b) => b.vs_est.pct - a.vs_est.pct).slice(0, 3)
        .map(f => {
          const u = safeUrl(f.url);
          const inner = `${workThumb(f.image, [f.artist, f.title].filter(Boolean).join(" — "), "t-ares")}
            <div class="ares-b">
              <div class="ares-t">${esc(f.artist || "—")}${f.title ? " — " + esc(f.title) : ""}</div>
              <div class="ares-m">${esc(f.house || "")} · ${esc(fmtDate(f.date))} · Est. ${esc(f.est || "—")}</div>
            </div>
            <div class="ares-p tnum ${dir}">${dir === "up" ? "↑" : "↓"} ${f.vs_est.pct}%</div>`;
          return u ? `<a class="ares" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
                   : `<div class="ares">${inner}</div>`;
        }).join("") + `</div>`
    : `<div class="oneline">None in the latest results.</div>`;

  const momentum = (REAL.trending || []).map(k => ARTISTS[k]).filter(Boolean).slice(0, 5);
  const momentumRows = momentum.length
    ? `<div class="rows">` + momentum.map((a, i) => {
        const d = parseFloat(a.stats.delta);
        const b = a.stats.deltaBasis || {};
        return `<button class="mrow" data-open-artist="${esc(a.key)}">
          <span class="rk tnum">${String(i + 1).padStart(2, "0")}</span>
          <span class="mb"><span class="mn">${esc(a.name)}</span>
            <span class="mm">${esc(b.medium || "comparable")} · ${b.n_now} v ${b.n_prior} lots</span></span>
          <span class="md tnum ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "↑" : d < 0 ? "↓" : "→"} ${esc(a.stats.delta)}</span>
        </button>`;
      }).join("") + `</div>`
    : `<div class="oneline">No artist has enough comparable lots in both windows to rank a move.</div>`;

  const next = (REAL.events || []).slice(0, 3);
  const nextRows = next.length
    ? `<div class="rows">` + next.map(auctionCard).join("") + `</div>`
    : `<div class="oneline">Nothing forthcoming in the diary.</div>`;

  return `
    ${tiles}
    <div class="sec">${sectionHead("Market momentum", "Δ 12 mo, per sq in")}
      ${momentumRows}
      <button class="more-link" data-market="artists">See every artist →</button></div>
    <div class="sec">${sectionHead("Furthest above estimate", "latest results")}${estRow(above, "up")}</div>
    <div class="sec">${sectionHead("Furthest below estimate", "latest results")}${estRow(below, "down")}</div>
    <div class="sec">${sectionHead("Next sales")}
      ${nextRows}
      <button class="more-link" data-market="auctions">Every sale →</button></div>
    <div class="foot-note">No turnover total and no thirty-day move on this desk.
      Public results list the lots that sold, so a total would be part of the market
      printed as all of it; and two thirty-day windows here often hold one sale
      against three, so a percentage between them measures the calendar. The counts
      above are counts.</div>`;
}

/* One card for a sale, forthcoming or closed. The handoff puts "N clients
   interested" on this card. Nothing on the record says who is interested in a
   sale: forthcoming sales arrive as a house, a title and a date, with no lot
   list to match a collector against. So the card carries what is published —
   including the catalogue, which is a page and never a PDF — and claims nothing. */
function auctionCard(e, closed) {
  const u = safeUrl(e.url);
  const when = closed
    ? fmtDate(e.start_date)
    : (e.starts === e.ends || !e.ends) ? fmtDate(e.starts) : fmtDate(e.starts) + " – " + fmtDate(e.ends);
  const meta = [e.city, e.kind, e.lot_count ? e.lot_count + " lots" : "", (e.names || []).slice(0, 3).join(", ")].filter(Boolean);
  const inner = `
    <div class="auc-top">${houseTag(e.house)}
      <span class="auc-status ${closed ? "closed" : "open"}">${closed ? "Closed" : "Forthcoming"}</span></div>
    <div class="auc-name">${esc(e.title || e.name || "Sale")}</div>
    <div class="auc-meta tnum">${esc(when)}${meta.length ? " · " + esc(meta.join(" · ")) : ""}</div>
    ${u ? `<div class="auc-link">${closed ? "Results" : "Catalogue"} →</div>` : ""}`;
  return u ? `<a class="auc" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
           : `<div class="auc">${inner}</div>`;
}

function marketAuctions() {
  const up = REAL.events || [];
  /* `recent_sales` is not a list of closed sales. It is the last 40 rows of the
     `sale` table by date, and that table carries Saffronart's forthcoming sales
     too — so eleven of sixteen here had not happened yet, seven of them were
     already listed above under Forthcoming, and four carried a 31-December
     placeholder date. All eleven were being labelled "Closed" with a link
     offering "Results". A sale is closed when its date has passed. */
  const today = todayIso();
  const done = (REAL.recent_sales || []).filter(e => e.start_date && e.start_date < today);
  return `
    <div class="sec" style="margin-top:0">${sectionHead("Forthcoming", up.length + " in the diary")}
      ${up.length ? `<div class="rows">${up.map(e => auctionCard(e, false)).join("")}</div>`
                  : `<div class="oneline">Nothing forthcoming in the diary.</div>`}</div>
    <div class="sec">${sectionHead("Recently closed", done.length + (done.length === 1 ? " sale" : " sales"))}
      ${done.length ? `<div class="rows">${done.map(e => auctionCard(e, true)).join("")}</div>`
                    : `<div class="oneline">No sale on the record has closed yet.</div>`}</div>
    <div class="foot-note">No sale total is quoted. Neither house publishes a
      turnover figure, and one summed from the lots on the results page would leave
      out everything that did not sell.</div>`;
}

function marketArtists() {
  return artistListRows();
}

function viewMarket() {
  const head = `<div class="view-head"><h1>Market</h1>
    <p>${REAL.coverage.lots.toLocaleString()} lots \u00b7 ${esc(listOf(REAL.coverage.houses))} \u00b7 ${esc(REAL.coverage.from.slice(0, 4))}\u2013${esc(REAL.coverage.to.slice(0, 4))}</p></div>`;

  const body = S.marketTab === "results"  ? marketResults()
    : S.marketTab === "artists"  ? marketArtists()
    : S.marketTab === "auctions" ? marketAuctions()
    : marketOverview();

  const tabs = `<div class="seg seg-tabs">
    ${MARKET_TABS.map(([k, l]) =>
      `<button data-market="${k}" aria-pressed="${S.marketTab === k}">${esc(l)}</button>`).join("")}
  </div>`;

  /* Wide screens get the currency block beside the tab, because it is a
     reference the rest of the screen never scrolls past. The tabs stay: four
     views of the same market do not want to be four stacked screens. */
  if (isSplit) {
    return head + `<div class="view-body">
      ${tabs}
      <div class="market-grid" style="margin-top:22px">
        <div class="main-col"><div class="sec" style="margin-top:0">${body}</div></div>
        <div class="rail-col">
          <div class="sec" style="margin-top:0">${sectionHead("Currency", "against INR")}${marketFx()}</div>
          <div class="sec">${sectionHead("The feed")}
            <button class="more-link" data-nav="news">Open the news desk →</button></div>
        </div>
      </div>
    </div>`;
  }

  return head + `<div class="view-body">
    ${tabs}
    <div class="sec" style="margin-top:22px">${body}</div>
  </div>`;
}

const MARKET_TABS = [["overview", "Overview"], ["results", "Results"],
                     ["artists", "Artists"], ["auctions", "Auctions"]];

/* ============================================================
   SCREEN: CLIENTS + CARD
   ============================================================ */
/* Entered once per device and kept in this browser's storage — not per login. */
function viewUnlock() {
  return `<div class="view-head"><h1>Unlock the book</h1>
      <p>Once per device</p></div>
    <div class="view-body">
      <div class="sec" style="margin-top:0">
        <div class="label">Desk key</div>
        <input data-key type="password" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="paste the key">
      </div>
      <div class="btnrow" style="margin-top:22px">
        <button class="btn btn-primary" data-act="save-key">Unlock</button>
      </div>
      ${CRM.keyError ? `<div class="foot-note" style="color:var(--gold-ink)">${esc(CRM.keyError)}</div>` : ""}
      <div class="foot-note">This stays on this device. The market data needs no
        key \u2014 only the client book and her diary do.</div>
    </div>`;
}

function clientListRows() {
  if (CRM.needsKey) {
    return `<div class="empty">Locked. <button class="more-link" data-nav="unlock"
      style="display:inline">Enter the desk key</button></div>`;
  }
  if (!CRM.live) {
    return `<div class="empty">The client book is private. Open the desk on the
      signed-in site and it loads here.</div>`;
  }
  if (!CRM.clients.length) {
    return `<div class="empty">No clients yet. Add the first one below.</div>`;
  }
  return `<div class="rows">` + CRM.clients.map(c => {
    const sel = isSplit && selectedClient() === c.id;
    return `<button class="row" data-open-client="${esc(c.id)}" ${sel ? 'style="background:var(--gold-tint)"' : ""}>
      <div class="row-top"><span class="row-name">${esc(c.name)}</span>
        <span class="cl-tier ${c.tier === "Principal" ? "principal" : ""}">${esc(c.tier || "")}</span></div>
      <div class="row-sub">${[c.city, c.focus].filter(Boolean).map(esc).join(" \u00b7 ")}${c.open_followups ? ` \u00b7 <span style="color:var(--gold-ink)">${c.open_followups} due</span>` : ""}</div>
    </button>`;
  }).join("") + `</div>`;
}

/* The handoff opens Clients on follow-ups, forthcoming sales and recent
   activity rather than on the roster. It is the right order — she comes here to
   act, not to browse — but the roster cannot go: thirty collectors have to stay
   reachable. So the three sections lead and the book sits under them.

   The handoff also puts "N clients interested" on each sale. Nothing on the
   record says that: a forthcoming sale arrives as a house, a title and a date,
   with no lot list to match a collector against. The sales are listed plainly. */
/* `compact` is the split view's list column, which is 284px of content. A sale
   card does not fit that and does not need to: the calendar is one tap away and
   Market carries every sale. Follow-ups and what was said last do fit, and they
   are the two she comes to this screen for. */
function clientsBrief(compact) {
  const fups = CRM.followups || [];
  const due = fups.length
    ? `<div class="rows">` + fups.slice(0, 8).map(f => `
        <button class="curow" data-open-client="${esc(f.client_id)}">
          <span class="cav">${esc(initials(f.client_name))}</span>
          <span class="cub"><span class="cun">${esc(f.client_name)}</span>
            <span class="cui">${esc(f.reason || "Follow up")}</span></span>
          <span class="cud ${f.overdue ? "over" : ""}">${esc(f.age || "")}</span>
        </button>`).join("") + `</div>`
    : `<div class="oneline">Nothing owed. Rare.</div>`;

  const next = (REAL.events || []).slice(0, 4);
  const sales = next.length
    ? `<div class="rows">${next.map(e => auctionCard(e, false)).join("")}</div>`
    : `<div class="oneline">Nothing forthcoming in the diary.</div>`;

  const acts = CRM.activity || [];
  const activity = acts.length
    ? `<div class="rows">` + acts.slice(0, 8).map(l => `
        <button class="log logbtn" data-open-client="${esc(l.client_id)}">
          <div><div class="d tnum">${esc(fmtDate(l.happened))}</div>
            <div class="ch">${esc(l.channel || "note")}</div></div>
          <div class="nt">${esc(l.note || "")}<div class="row-sub">${esc(l.client_name || "")}</div></div>
        </button>`).join("") + `</div>`
    : `<div class="oneline">Nothing logged yet. A conversation logged on a card appears here.</div>`;

  return `
    <div class="sec" style="margin-top:0">${sectionHead("Follow-ups due", fups.length ? String(fups.length) : "")}${due}</div>
    <div class="sec">${sectionHead("Sales ahead", (REAL.events || []).length + " in the diary")}
      ${compact ? "" : sales}
      <button class="more-link" data-nav="calendar">The whole diary →</button></div>
    <div class="sec">${sectionHead("Recent activity", acts.length ? String(acts.length) : "")}${activity}</div>`;
}

function viewClients() {
  const count = CRM.live ? CRM.clients.length : 0;
  const addBtn = CRM.live
    ? `<button class="btn btn-primary btn-block" data-act="new-client" style="margin-bottom:6px">+ Add a client</button>`
    : "";
  const brief = CRM.live ? clientsBrief(false) : "";
  const briefCompact = CRM.live ? clientsBrief(true) : "";

  const list = `
    <div class="view-head"><h1>Clients</h1>
      <p>${CRM.live ? `${count} active` : (CRM.needsKey ? "locked" : "private")}</p></div>
    <div class="view-body">
      ${brief}
      <div class="sec">${sectionHead("The book", CRM.live ? count + " active" : "")}
        ${addBtn}${clientListRows()}</div>
    </div>`;
  if (!isSplit) return list;
  return `<div class="split">
    <div class="list"><div class="sec" style="margin-top:26px">
      ${addBtn}${sectionHead("Book", CRM.live ? count + " active" : "")}${clientListRows()}
      ${briefCompact}
    </div></div>
    <div class="detail">${CRM.live && CRM.clients.length ? viewClient(true) : ""}</div>
  </div>`;
}

/* Called before every paint of a screen that shows a card. Two jobs, both of
   them the reason the card used to hang: make sure the chosen collector is one
   the book actually holds, and make sure something is fetching their record.
   The card no longer depends on a tap having happened to load itself. */
function settleClientSelection() {
  if (!CRM.live) return;
  if (S.screen !== "clients" && S.screen !== "client") return;
  const book = CRM.clients || [];
  if (!selectedClient() && isSplit && book.length) S.client = book[0].id;
  const cid = selectedClient();
  if (cid && !CRM.detail[cid] && !CRM.detailBusy[cid] && !CRM.detailError[cid]) ensureDetail(cid);
}

/* The form for putting a real collector in the book. Deliberately short: a name
   is all that is required, because the moment of adding someone is usually
   mid-conversation and the rest can be filled in afterwards. */
function viewNewClient() {
  const f = S.newClient || {};
  const field = (k, label, ph, long) => `
    <div class="sec" style="margin-top:22px">
      <div class="label">${esc(label)}</div>
      ${long
        ? `<textarea data-nc="${k}" rows="4" placeholder="${esc(ph)}">${esc(f[k] || "")}</textarea>`
        : `<input data-nc="${k}" type="text" placeholder="${esc(ph)}" value="${esc(f[k] || "")}">`}
    </div>`;

  return `<div class="view-head"><h1>Add a client</h1>
      <p>Only the name is required</p></div>
    <div class="view-body">
      ${field("name", "Name", "Full name")}
      ${field("title", "Title", "Trustee, Nanda Family Collection")}
      ${field("city", "City", "Mumbai")}
      <div class="sec" style="margin-top:22px">
        <div class="label">Tier</div>
        <div class="chiprow" style="padding-left:0;padding-right:0;margin:10px 0 0">
          ${["Principal", "Senior", "Growth"].map(x =>
            `<button class="chip" data-nc-tier="${x}" aria-pressed="${(f.tier || "Growth") === x}">${x}</button>`).join("")}
        </div>
      </div>
      ${field("focus", "Collecting focus", "Moderns, trophy")}
      ${field("brief", "Collecting brief", "How they buy, and what they will not consider.", true)}
      ${field("next_what", "Next action", "What you owe them next")}

      <div class="btnrow" style="margin-top:26px">
        <button class="btn btn-primary" data-act="save-client">Save to the book</button>
        <button class="btn" data-nav="clients">Cancel</button>
      </div>
      ${S.newClientError ? `<div class="foot-note" style="color:var(--gold-ink)">${esc(S.newClientError)}</div>` : ""}
    </div>`;
}

function viewClient(embedded) {
  const cid = selectedClient();
  const d = CRM.live ? CRM.detail[cid] : null;

  // Map the live record onto the shape the card already renders, so there is one
  // template rather than two that can drift apart.
  const c = d ? {
    name: d.name, title: d.title || "", city: d.city || "", tier: d.tier || "",
    since: d.since || "", lifetime: d.lifetime_inr ? inrShort(d.lifetime_inr) : "—",
    focus: d.focus || "", brief: d.brief || "", wants: d.wants || [],
    holdings: (d.holdings || []).map(h => ({
      id: h.id, artist: h.artist_name, work: h.work || "", acquired: h.acquired || "" })),
    referrals: (d.referrals || []).map(r => ({ name: r.name, tie: r.tie || "" })),
    next: { when: d.next_when || "", what: d.next_what || "" },
