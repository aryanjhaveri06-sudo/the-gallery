function artistListRows() {
  return `<div class="rows">` + artistKeys.map(k => {
    const a = A(k), sel = isSplit && S.artist === k;
    return `<button class="row" data-open-artist="${k}" ${sel ? 'style="background:var(--gold-tint)"' : ""}>
      <div class="row-top">
        <span class="row-name">${esc(a.name)}</span>
        <span class="row-meta tnum" style="${a.stats.delta && parseFloat(a.stats.delta) >= 15 ? "color:var(--gold-ink)" : ""}">${esc(a.stats.delta || a.stats.high)}</span>
      </div>
      <div class="row-sub">${a.years ? `<span class="tnum">${esc(a.years)}</span> \u00b7 ` : ""}${esc(a.movement)}</div>
    </button>`;
  }).join("") + `</div>`;
}

function viewArtists() {
  const list = `
    <div class="view-head"><h1>Artists</h1>
      <p>${Object.keys(ARTISTS).length} artists with enough depth to price</p></div>
    <div class="view-body">
      <button class="btn btn-primary btn-block" data-act="open-search" style="margin-bottom:6px">${I(ICON.search, 15)} Search an artist</button>
      <div class="sec">${sectionHead("Tracked artists", artistKeys.length + " names")}${artistListRows()}</div>
    </div>`;
  if (!isSplit) return list;
  return `<div class="split">
    <div class="list">
      <div style="padding-top:26px">
        <button class="btn btn-primary btn-block" data-act="open-search">${I(ICON.search, 15)} Search</button>
      </div>
      <div class="sec" style="margin-top:24px">${sectionHead("Artists", artistKeys.length)}${artistListRows()}</div>
    </div>
    <div class="detail">${viewDossier(true)}</div>
  </div>`;
}

function viewDossier(embedded) {
  const a = A(S.artist);
  // loadLiveData() can swap REAL mid-session now that it actually works, so a
  // key captured by an earlier render can disappear under us.
  if (!a) {
    return `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <h1>Artists</h1></div>
      <div class="view-body"><div class="empty">That artist is no longer in the tracked set.</div></div>`;
  }
  const houses = ["All"].concat(a.records.map(r => r.house).filter((h, i, arr) => arr.indexOf(h) === i));
  const rows = a.records.filter(r => S.houseFilter === "All" || r.house === S.houseFilter);

  // No sell-through tile: unsold lots are absent from public results, so the
  // figure cannot be computed honestly. "Above high est." can, and is more use.
  const st = a.stats;
  const stats = [
    { k: "Highest result", v: st.high },
    { k: "Median, 12 mo", v: st.avg },
    { k: "Lots, 12 mo", v: st.lots12 },
    { k: "Above high est.", v: st.above },
    { k: "Sell-through", v: st.sellThrough == null ? "\u2014" : st.sellThrough + "%" },
    { k: "\u0394 12 mo, per sq in", v: st.delta || "\u2014", gold: !!st.delta }
  ].map(x => `<div class="stat ${x.gold ? "gold" : ""}"><div class="k">${esc(x.k)}</div><div class="v tnum">${esc(x.v)}</div></div>`).join("");

  const basis = st.deltaBasis || {};
  // Always show both medians and both samples: the percentage is consignment-
  // weighted, not quality-adjusted, and must not travel on its own.
  const deltaNote = st.delta
    ? `Median \u20b9${(basis.ppsi_now || 0).toLocaleString()} per sq in on ${esc(basis.medium || "comparable")} works this year against \u20b9${(basis.ppsi_prior || 0).toLocaleString()} last, from ${basis.n_now} lots and ${basis.n_prior}. Consignment-weighted, not adjusted for quality.`
    : `Not enough comparable lots to quote a 12-month move${basis.n_now != null ? ` \u2014 ${basis.n_now} this year, ${basis.n_prior} last` : ""}. The figures above still stand.`;

  const sb = st.sellBasis || {};
  const sellNote = st.sellThrough != null
    ? ` Sell-through is ${sb.sold} of ${sb.offered} lots at ${esc((sb.houses || []).join(", "))}, the only house here that publishes what went unsold.`
    : "";

  const recs = rows.map(r => `
    <div class="rec">
      <div class="rec-top">${houseTag(r.house)}<span class="row-meta tnum">${esc(r.date)}</span></div>
      <div class="rec-work">${esc(r.work)}</div>
      <div class="rec-med">${esc(r.medium)}${r.sale ? " \u00b7 " + esc(r.sale) : ""}${r.nat ? ' \u00b7 <span style="color:var(--gold-ink)">Art Treasure, non-exportable</span>' : ""}</div>
      <div class="rec-foot">
        <div><div class="rec-est tnum">${r.est.charAt(0) === "\u20b9" ? "Est. " + esc(r.est) : esc(r.est)}</div>
          ${r.up ? '<div class="pill up" style="margin-top:7px"><span class="dot"></span>above high estimate</div>' : ""}</div>
        <div class="rec-price tnum ${r.up ? "up" : ""}">${esc(r.price)}</div>
      </div>
    </div>`).join("");

  const talk = a.talking.map(t => `<div class="talk"><span class="mk">§</span><span>${esc(t)}</span></div>`).join("");

  const q = encodeURIComponent(a.name);
  const elsewhere = [
    { n: "Artprice", u: `https://www.artprice.com/artist/search?q=${q}` },
    { n: "MutualArt", u: `https://www.mutualart.com/Search?query=${q}` },
    { n: "Saffronart", u: `https://www.saffronart.com/artist/artistsearch.aspx?q=${q}` }
  ].map(x => `<a class="btn" href="${x.u}" target="_blank" rel="noopener noreferrer">${x.n}</a>`).join("");

  const holders = CRM.live
    ? CRM.clients.filter(cl => {
        const d = CRM.detail[cl.id];
        return d && (d.holdings || []).some(h => h.artist_key === S.artist);
      })
    : [];
  const collectors = holders.map(cl => `
    <button class="row" data-open-client="${esc(cl.id)}">
      <div class="row-top"><span class="row-name">${esc(cl.name)}</span>${I(ICON.chev, 16)}</div>
      <div class="row-sub">${esc([cl.tier, cl.city].filter(Boolean).join(" \u00b7 "))}</div>
    </button>`).join("");

  return `
    <div class="view-head dossier-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <span class="kicker">${esc(a.movement)}</span>
      <h1>${esc(a.name)}</h1>
      ${a.years ? `<div class="yrs tnum">${esc(a.years)}</div>` : ""}
    </div>
    <div class="view-body" ${embedded ? 'style="padding-left:0"' : ""}>
      <div class="sec">${sectionHead("Market card")}
        <div class="stats">${stats}</div>
        ${a.index.length > 1 ? `
          <div class="chart" data-spark="${esc(S.artist)}"></div>
          <div class="chart-cap">
            <span class="tnum">${a.indexYears[0]} = 100${st.indexHouses.length ? " \u00b7 " + esc(st.indexHouses.join(", ")) : ""}</span>
            <span class="tnum">${a.indexYears[a.indexYears.length - 1]} \u00b7 ${a.index[a.index.length - 1]}</span>
          </div>` : ""}
        <div class="foot-note">${deltaNote}${sellNote}</div>
      </div>

      ${a.bio ? `<div class="sec">${sectionHead("Biography")}
        <div class="bio ${S.bioOpen ? "" : "clamped"}" id="bio">${esc(a.bio)}</div>
        <button class="more-link" data-act="toggle-bio">${S.bioOpen ? "Show less" : "Read more"}</button>
        <div class="tags">${a.themes.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>` : ""}

      <div class="sec">${sectionHead("Auction record", rows.length + " of " + a.records.length)}
        <div class="chiprow">${houses.map(h => `<button class="chip" data-house="${esc(h)}" aria-pressed="${S.houseFilter === h}">${esc(h)}</button>`).join("")}</div>
        <div class="rows">${recs}</div>
        <div class="foot-note">Realised prices include buyer\u2019s premium, as the houses publish them. Source: ${esc(listOf(REAL.coverage.houses))} public results. ${esc(REAL.caveats.sell_through || "")}</div>
      </div>

      <div class="sec">${sectionHead("Look up elsewhere")}
        <div class="btnrow" style="margin-top:16px">${elsewhere}</div>
        <div class="foot-note">Opens in your own subscription. Their results stay on their site \u2014 this desk holds only what the houses publish.</div>
      </div>

      <div class="cols two">
        ${a.talking.length ? `<div class="col sec">${sectionHead("Talking points")}<div class="rows">${talk}</div></div>` : ""}
        <div class="col sec">${sectionHead("On your book")}<div class="rows">${collectors || `<div class="empty">${CRM.live ? "No client on your book holds this artist." : "Sign in to see who holds this artist."}</div>`}</div></div>
      </div>
    </div>`;
}

/* ============================================================
   SCREEN: MARKET
   ============================================================ */
/* A result is a picture first. loading="lazy" because forty house-hosted JPEGs
   should not block the tab, and decoding="async" so a slow one cannot stall the
   rest of the list. Referrer stays on so the houses can see it is us — they
   serve our origin, and it is their image. */
/* Saffronart's stored URL is the _aucres variant at 109x109 — soft in an 80px
   slot on a retina screen. _thumb is 159x159 for three more kilobytes, which is
   what that slot wants, so try it and fall back to the stored one where a lot
   has no such variant. The full-size original exists too: 2800px and a megabyte.
   Never that, forty times over. */
function lotThumbFail(img) {
  const fb = img.getAttribute("data-fallback");
  if (fb && !img.src.endsWith(fb)) {
    img.removeAttribute("data-fallback");
    img.src = fb;
    return;
  }
  img.replaceWith(Object.assign(document.createElement("div"),
    { className: "thumb ph", textContent: "no image" }));
}

/* loading="lazy" because forty house-hosted JPEGs should not block the tab, and
   decoding="async" so one slow image cannot stall the list. */
function lotThumb(f) {
  const orig = safeUrl(f.image);
  if (!orig) return `<div class="thumb ph">no image</div>`;
  const shown = orig.replace("_aucres.", "_thumb.");
  const alt = [f.artist, f.title].filter(Boolean).join(" \u2014 ") || "Lot";
  return `<img class="thumb" src="${esc(shown)}" alt="${esc(alt)}"
    ${shown !== orig ? `data-fallback="${esc(orig)}"` : ""}
    loading="lazy" decoding="async" onerror="lotThumbFail(this)">`;
}

function marketResults() {
  if (!REAL.feed.length) return `<div class="oneline">No results yet.</div>`;

  /* The mockup's two dropdowns, as chips. Both filter on values that exist in
     the row — house, and where the hammer landed against the estimate. There is
     no category filter because the feed carries no category; a control that
     cannot filter anything is worse than no control. */
  const houses = ["All", ...new Set(REAL.feed.map(f => f.house).filter(Boolean))];
  const perfs = [["All", "All lots"], ["above", "Above estimate"], ["below", "Below estimate"]];
  const rows = REAL.feed.filter(f =>
    (S.resHouse === "All" || f.house === S.resHouse) &&
    (S.resPerf === "All" || (f.vs_est && f.vs_est.dir === S.resPerf)));

  const filters = `<div class="filterbar">
    <div class="fgroup">${houses.map(h =>
      `<button class="fchip" data-res="house:${esc(h)}" aria-pressed="${S.resHouse === h}">${esc(h === "All" ? "All houses" : h)}</button>`).join("")}</div>
    <div class="fgroup">${perfs.map(([k, l]) =>
      `<button class="fchip" data-res="perf:${esc(k)}" aria-pressed="${S.resPerf === k}">${esc(l)}</button>`).join("")}</div>
  </div>`;

  if (!rows.length) return filters + `<div class="oneline">No lots match that filter.</div>`;

  return filters + `<div class="rows">` + rows.map(f => {
    const k = f.artist_key && ARTISTS[f.artist_key] ? f.artist_key : null;
    const v = f.vs_est;
    const lot = safeUrl(f.url);

    /* Half this market's works genuinely have no title — Saffronart publishes
       none at all for the StoryLTD online sales, and AstaGuru's own lot page
       for one of these is headed "Untitled". Printing the word twenty times in
       a column is noise, not information. Where there is a medium and a size,
       show those instead; where there is nothing, let the picture do the work
       and say nothing. A real title is always shown. */
    const titled = (f.title || "").trim() && (f.title || "").trim().toLowerCase() !== "untitled";
    const meta = [f.medium, f.size].filter(Boolean).join(" \u00b7 ");
    const desc = titled
      ? `<div class="lot-title">${esc(f.title)}</div>${meta ? `<div class="lot-meta">${esc(meta)}</div>` : ""}`
      : meta
        ? `<div class="lot-meta">${esc(meta)}</div>`
        : "";

    const inner = `
      ${lotThumb(f)}
      <div>
        <div class="lot-top">${houseTag(f.house)}<span class="row-meta tnum">${esc(fmtDate(f.date))}</span></div>
        <div class="lot-artist">${esc(f.artist || "\u2014")}</div>
        ${desc}
        <div class="lot-foot">
          <div class="lot-est">${f.est ? `Est. <span class="tnum">${esc(f.est)}</span>` : ""}</div>
          <div>
            <div class="lot-price tnum">${esc(f.price || "\u2014")}</div>
            ${v ? `<div class="lot-vs ${v.dir} tnum">${v.dir === "above" ? "\u2191" : "\u2193"} ${v.pct}% ${v.dir === "above" ? "above high est." : "below low est."}</div>` : ""}
          </div>
        </div>
      </div>`;

    /* The card opens the lot at the house — AstaGuru lands on the work itself,
       Saffronart on the catalogue that holds it. The dossier link has to sit
       OUTSIDE that anchor: a button inside an <a> is invalid and swallows the
       tap. It only appears for the artists the desk actually tracks. */
    const card = lot
      ? `<a class="lotcard" href="${esc(lot)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<div class="lotcard">${inner}</div>`;

    return k
      ? `<div class="lotwrap">${card}
           <button class="chip lot-dossier" data-open-artist="${esc(k)}">${esc(f.artist)} on the desk \u2192</button>
         </div>`
      : card;
  }).join("") + `</div>`;
}

function marketTrending() {
  const rows = REAL.trending.map(k => ARTISTS[k]).filter(Boolean);
  if (!rows.length) return '<div class="empty">No artist has enough comparable lots in both windows to rank a move.</div>';
  return `<div class="rows">` + rows.map((a, i) => {
    const b = a.stats.deltaBasis || {};
    return `<button class="trend" data-open-artist="${esc(a.key || REAL.trending[i])}">
      <span class="rk tnum">${String(i + 1).padStart(2, "0")}</span>
      <span><span class="nm">${esc(a.name)}</span>
        <span class="mt tnum" style="display:block">${esc(b.medium || "")}, ${b.n_now} v ${b.n_prior} lots</span></span>
      <span><span class="dl tnum ${parseFloat(a.stats.delta) >= 15 ? "hot" : ""}">${esc(a.stats.delta)}</span>
        <span class="av tnum" style="display:block">med ${esc(a.stats.avg)}</span></span>
    </button>`;
  }).join("") + `</div>`;
}

function marketNews() {
  const d = REAL.news || {};
  const pool = S.feedScope === "Wider" ? (d.wider || []) : (d.on_market || []);
  const cats = ["All", ...new Set(pool.map(newsTag).filter(Boolean))];
  const rows = pool.filter(n => S.feedCat === "All" || newsTag(n) === S.feedCat);

  /* Scope is real: "Her market" is what the India-targeted feeds and queries
     return, "Wider" is the international trade press, and the two are kept in
     separate buckets by the pipeline rather than mixed and guessed at. */
  const filters = `<div class="filterbar">
    <div class="fgroup">${cats.map(c =>
      `<button class="fchip" data-feed="cat:${esc(c)}" aria-pressed="${S.feedCat === c}">${esc(c === "All" ? "All categories" : c)}</button>`).join("")}</div>
    <div class="fgroup">${[["India", "Her market"], ["Wider", "Wider art world"]].map(([k, l]) =>
      `<button class="fchip" data-feed="scope:${esc(k)}" aria-pressed="${S.feedScope === k}">${esc(l)}</button>`).join("")}</div>
  </div>`;

  if (!rows.length) return filters + `<div class="oneline">Nothing in that category today.</div>`;
  return filters + `<div class="rows">` + rows.map(newsRow).join("") + `</div>`;
}

function marketFx() {
  return `<div class="rows fx-list">` + FX.map(f => `
    <div class="fxr tnum"><span class="p">${esc(f.pair)}</span>
      <span><span class="r">${esc(f.rate)}</span></span></div>`).join("")
    + (FX_AS_OF ? `<div class="fxr tnum"><span class="p">as of</span><span class="r" style="font-size:14.7px">${esc(FX_AS_OF)}</span></div>` : "")
    + `</div>`;
}

function viewMarket() {
  const head = `<div class="view-head"><h1>Market</h1>
    <p>${REAL.coverage.lots.toLocaleString()} lots \u00b7 ${esc(listOf(REAL.coverage.houses))} \u00b7 ${esc(REAL.coverage.from.slice(0, 4))}\u2013${esc(REAL.coverage.to.slice(0, 4))}</p></div>`;

  if (isSplit) {
    return head + `<div class="view-body market-grid">
      <div class="main-col">
        <div class="sec">${sectionHead("Latest results")}${marketResults()}</div>
        <div class="sec">${sectionHead("Trending artists", "Δ vs prior year")}${marketTrending()}</div>
      </div>
      <div class="rail-col">
        <div class="sec">${sectionHead("The feed")}${marketNews()}</div>
        <div class="sec">${sectionHead("Currency", "against INR")}${marketFx()}</div>
      </div>
    </div>`;
  }

  const body = S.marketTab === "results" ? marketResults()
    : S.marketTab === "trending" ? marketTrending()

  return head + `<div class="view-body">
    <div class="seg">

      <button data-market="trending" aria-pressed="${S.marketTab === "trending"}">Trending</button>
      <button data-market="news" aria-pressed="${S.marketTab === "news"}">The feed</button>
    </div>
    <div class="sec" style="margin-top:22px">${body}</div>
  </div>`;
}

function viewClient(embedded) {
  const d = CRM.live ? CRM.detail[S.client] : null;

  // Map the live record onto the shape the card already renders, so there is one
  // template rather than two that can drift apart.
  const c = d ? {
    name: d.name, title: d.title || "", city: d.city || "", tier: d.tier || "",
    since: d.since || "", lifetime: d.lifetime_inr ? inrShort(d.lifetime_inr) : "—",
    focus: d.focus || "", brief: d.brief || "", wants: d.wants || [],
    holdings: (d.holdings || []).map(h => ({
      id: h.id, artist: h.artist_name, work: h.work || "", acquired: h.acquired || "" })),
    referrals: (d.referrals || []).map(r => ({ name: r.name, tie: r.tie || "" })),
    next: { when: d.next_when || "", what: d.next_what || "" },
    log: (d.log || []).map(l => ({ id: l.id, date: fmtDate(l.happened), channel: l.channel || "", note: l.note || "" })),
    followups: d.followups || [],
  } : null;

  if (CRM.live && !d) {
    return `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <h1>${esc((CRM.clients.find(x => x.id === S.client) || {}).name || "Client")}</h1></div>
      <div class="view-body"><div class="empty">Opening the card\u2026</div></div>`;
  }

  // Reachable only if the book goes offline mid-session; say so rather than throw.
  if (!c) {
    return `<div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <h1>Client</h1></div>
      <div class="view-body"><div class="empty">The client book is not open on this device.</div></div>`;
  }

  const first = c.name.split(" ")[0];

  const refs = c.referrals.map(r => `<div class="ref"><b>${esc(r.name)}</b><br><span>${esc(r.tie)}</span></div>`).join("");

  const tpls = TEMPLATES.map((t, i) => {
    const open = S.openTemplate === i;
    // A prospect has no holdings, so there may be no artist to name — and the
    // estimate and the movement are per-lot facts this app does not hold. Leave
    // a blank she fills rather than a number she might paste into a client email.
    const blank = "\u2014\u2014\u2014\u2014";
    const body = t.body
      .replace(/\{\{first\}\}/g, first)
      .replace(/\{\{artist\}\}/g, (c.holdings[0] && c.holdings[0].artist) || blank)
      .replace(/\{\{estimate\}\}/g, blank)
      .replace(/\{\{delta\}\}/g, blank);
    return `<div class="tpl">
      <button class="tpl-hd" data-tpl="${i}" aria-expanded="${open}">
        <span class="n">${esc(t.name)}</span><span class="ac">${open ? "Close" : "Preview"}</span></button>
      ${open ? `<div class="tpl-body">${esc(body)}</div>` : ""}
    </div>`;
  }).join("");

  /* ---- inline editors -----------------------------------------------------
     Each one opens where the thing it edits already lives, so the record stays
     on screen while it is being changed. One panel at a time; cancelling throws
     the draft away without touching the record. */
  const g = S.draft || {};
  const fld = (k, label, ph, long) => `
    <div class="fld">
      <div class="label">${esc(label)}</div>
      ${long
        ? `<textarea data-ed="${k}" rows="4" placeholder="${esc(ph)}">${esc(g[k] == null ? "" : g[k])}</textarea>`
        : `<input data-ed="${k}" type="text" placeholder="${esc(ph)}" value="${esc(g[k] == null ? "" : g[k])}">`}
    </div>`;
  const dateFld = (k, label) => `
    <div class="fld">
      <div class="label">${esc(label)}</div>
      <input data-ed="${k}" type="date" value="${esc(g[k] || "")}">
    </div>`;
  const chips = (k, label, opts, attr) => `
    <div class="fld">
      <div class="label">${esc(label)}</div>
      <div class="chiprow">${opts.map(o =>
        `<button class="chip" ${attr}="${esc(o)}" aria-pressed="${(g[k] || "") === o}">${esc(o)}</button>`).join("")}</div>
    </div>`;

  const panel = (which, saveAct, saveLabel, fields) => S.panel !== which ? "" : `
    <div class="panel">
      ${fields}
      <div class="btnrow" style="margin-top:20px">
        <button class="btn btn-primary" data-act="${saveAct}">${esc(saveLabel)}</button>
        <button class="btn" data-panel="close">Cancel</button>
      </div>
      ${S.draftError ? `<div class="foot-note" style="color:var(--gold-ink)">${esc(S.draftError)}</div>` : ""}
    </div>`;

  // Editing an existing row reuses the same fields as adding one; only where the
  // panel appears and where it posts differ. S.panel carries "<kind>:<id>".
  const rowFields = kind =>
      kind === "holding" ? fld("artist_name", "Artist", "V. S. Gaitonde")
                         + fld("work", "Work", "Untitled, 1974")
                         + dateFld("acquired", "Acquired")
                         + fld("paid_inr", "Paid (\u20b9)", "Whole rupees; leave blank if not known")
    : kind === "log"     ? dateFld("happened", "When")
                         + chips("channel", "Channel", ["Call", "Email", "Viewing", "Meeting", "Sale", "Lunch", "WhatsApp"], "data-ed-channel")
                         + fld("note", "What was said", "Keep it factual \u2014 this is the record.", true)
    :                      dateFld("due", "Due")
                         + fld("reason", "What is owed", "Send the November comparables.", true);

  const rowPanel = (kind, rid) => S.panel !== `${kind}:${rid}` ? "" : `
    <div class="panel">
      ${rowFields(kind)}
      <div class="btnrow" style="margin-top:20px">
        <button class="btn btn-primary" data-act="save-row">Save changes</button>
        <button class="btn" data-panel="close">Cancel</button>
      </div>
      ${S.draftError ? `<div class="foot-note" style="color:var(--gold-ink)">${esc(S.draftError)}</div>` : ""}
    </div>`;

  // Two taps to delete: the first arms the chip, the second does it. Cheaper
  // than a modal and it cannot be triggered by one stray tap on a small screen.
  const rowActions = (kind, rid) => {
    const armed = S.confirmDelete === `${kind}:${rid}`;
    return `<div class="btnrow row-actions">
      <button class="chip" data-edit-row="${kind}:${esc(rid)}">Edit</button>
      <button class="chip${armed ? " danger" : ""}" data-del-row="${kind}:${esc(rid)}">${armed ? "Really delete?" : "Delete"}</button>
    </div>${rowPanel(kind, rid)}`;
  };

  const editPanel = panel("client", "save-edit", "Save changes",
      fld("name", "Name", "Full name")
    + fld("title", "Title", "Trustee, Nanda Family Collection")
    + fld("city", "City", "Mumbai")
    + chips("tier", "Tier", ["Principal", "Senior", "Growth"], "data-ed-tier")
    + fld("since", "Client since", "2019")
    + fld("lifetime_inr", "Lifetime with the house (\u20b9)", "Whole rupees; leave blank if unknown")
    + fld("focus", "Collecting focus", "Moderns, trophy")
    + fld("wants", "Looking for", "Comma separated \u2014 Gaitonde, works on paper")
    + fld("brief", "Collecting brief", "How they buy, and what they will not consider.", true)
    + fld("next_when", "Next action \u2014 when", "Before the November sale")
    + fld("next_what", "Next action \u2014 what", "What you owe them next"));

  const holdingPanel = panel("holding", "save-holding", "Add holding",
      fld("artist_name", "Artist", "V. S. Gaitonde")
    + fld("work", "Work", "Untitled, 1974")
    + dateFld("acquired", "Acquired")
    + fld("paid_inr", "Paid (\u20b9)", "Whole rupees; leave blank if not known"));

  const logPanel = panel("log", "save-log", "Save note",
      dateFld("happened", "When")
    + chips("channel", "Channel", ["Call", "Email", "Viewing", "Meeting", "Sale", "Lunch", "WhatsApp"], "data-ed-channel")
    + fld("note", "What was said", "Keep it factual \u2014 this is the record.", true));

  const followupPanel = panel("followup", "save-followup", "Set follow-up",
      dateFld("due", "Due")
    + fld("reason", "What is owed", "Send the November comparables.", true));

  /* The row lists are built here, below rowActions, because they use it. A row
     cannot be a <button> wrapping more <button>s, so the actions sit beside the
     row rather than inside it. */
  const holdings = c.holdings.map(h => {
    const ak = artistKeyByName(h.artist);
    return `<div>
      <button class="row hold" ${ak ? `data-open-artist="${ak}"` : ""}>
        <div class="row-top"><span class="a">${esc(h.artist)}</span>${ak ? I(ICON.chev, 15) : ""}</div>
        <div class="w"><em>${esc(h.work)}</em> \u00b7 <span class="tnum">${esc(h.acquired)}</span></div>
      </button>
      ${rowActions("holding", h.id)}
    </div>`;
  }).join("");

  const log = c.log.map(l => `<div class="log">
    <div><div class="d tnum">${esc(l.date)}</div><div class="ch">${esc(l.channel)}</div></div>
    <div class="nt">${esc(l.note)}${rowActions("log", l.id)}</div></div>`).join("");

  const today = todayIso();
  const fuRows = c.followups.length
    ? `<div class="rows">` + c.followups.map(f => `
        <div class="log">
          <div>
            <div class="d tnum">${esc(fmtDate(f.due))}</div>
            <div class="ch">${f.done ? "done" : (f.due < today ? "overdue" : "open")}</div>
          </div>
          <div class="nt">${esc(f.reason || "")}
            <div class="btnrow row-actions">
              <button class="chip" data-card-followup="${esc(f.id)}">${f.done ? "Reopen" : "Mark done"}</button>
              <button class="chip" data-edit-row="followup:${esc(f.id)}">Edit</button>
              <button class="chip${S.confirmDelete === `followup:${f.id}` ? " danger" : ""}" data-del-row="followup:${esc(f.id)}">${S.confirmDelete === `followup:${f.id}` ? "Really delete?" : "Delete"}</button>
            </div>
            ${rowPanel("followup", f.id)}
          </div>
        </div>`).join("") + `</div>`
    : `<div class="empty">Nothing owed.</div>`;

  return `
    <div class="view-head" ${embedded ? 'style="padding-left:0;padding-right:0"' : ""}>
      <div class="card-head">
        <span class="kicker">${[c.tier, c.since ? "since " + c.since : ""].filter(Boolean).map(esc).join(" · ")}</span>
        <h1>${esc(c.name)}</h1>
        <div class="ti">${[c.title, c.city].filter(Boolean).map(esc).join(" · ")}</div>
        <div class="lv"><span class="amt tnum">${esc(c.lifetime)}</span><span class="cap">lifetime with the house</span></div>
      </div>
    </div>
    <div class="view-body" ${embedded ? 'style="padding-left:0"' : ""}>
      ${(c.next.when || c.next.what) ? `
      <div class="accent-box">
        ${c.next.when ? `<div class="when">${esc(c.next.when)}</div>` : ""}
        ${c.next.what ? `<div class="what">${esc(c.next.what)}</div>` : ""}
      </div>` : ""}
      <div class="btnrow">
        <button class="btn btn-primary" data-act="pitch-for" data-client="${S.client}">Draft a pitch</button>
        <button class="btn" data-panel="client">Edit card</button>
        <button class="btn" data-nav="knowledge" data-know="scripts">Objection scripts</button>
      </div>
      ${editPanel}

      <div class="cols two">
        <div class="col sec">${sectionHead("Collecting brief")}
          <div class="brief-p">${esc(c.brief)}</div>
          <div class="tags">${c.wants.map(w => `<span class="tag">${esc(w)}</span>`).join("")}</div>
        </div>
        <div class="col sec">${sectionHead("Holdings", c.holdings.length + " works")}
          <div class="rows">${holdings}</div>
          ${c.holdings.length ? "" : `<div class="empty">Nothing recorded yet.</div>`}
          <div class="btnrow"><button class="chip" data-panel="holding">Add a holding</button></div>
          ${holdingPanel}
          <div class="sec">${sectionHead("Referral web")}<div class="rows">${refs}</div>
            ${c.referrals.length ? "" : `<div class="empty">No referrals recorded.</div>`}</div>
        </div>
      </div>

      <div class="cols two">
        <div class="col sec">${sectionHead("Conversation log", c.log.length + " entries")}
          <div class="rows">${log}</div>
          ${c.log.length ? "" : `<div class="empty">Nothing logged yet.</div>`}
          <div class="btnrow"><button class="chip" data-panel="log">Log a conversation</button></div>
          ${logPanel}
        </div>
        <div class="col sec">${sectionHead("Follow-ups", c.followups.filter(f => !f.done).length + " open")}
          ${fuRows}
          <div class="btnrow"><button class="chip" data-panel="followup">Set a follow-up</button></div>
          ${followupPanel}
        </div>
      </div>

      <div class="sec">${sectionHead("Message templates")}<div class="rows">${tpls}</div></div>
    </div>`;
}

function viewKnowledge() {
  const scripts = `<div class="rows">` + OBJECTIONS.map((o, i) => {
    const open = S.openObjection === i;
    return `<div>
      <button class="obj-q" data-obj="${i}" aria-expanded="${open}">
        <span class="q">“${esc(o.q)}”</span><span class="mk">${open ? "−" : "+"}</span></button>
      ${open ? `<div class="obj-a"><p>${esc(o.answer)}</p><div class="proof">Proof to hand: ${esc(o.proof)}</div></div>` : ""}
    </div>`;
  }).join("") + `</div>`;

  const pitch = !CRM.live
    ? `<div class="empty">The pitch generator drafts against a named collector, so
        it needs the client book. Sign in on the private site.</div>`
    : !CRM.clients.length
      ? `<div class="empty">Add a client first, then a pitch can be drafted for them.</div>`
      : (() => {
          const c = CRM.clients.find(x => x.id === S.pitchClient) || CRM.clients[0];
          const held = (CRM.detail[c.id] || {}).holdings || [];
          const wants = (c.wants || []).join(", ");
          const matched = REAL.feed.filter(f =>
            held.some(h => h.artist_key && h.artist_key === f.artist_key)).slice(0, 3);

          /* The template is the default and stays the default: it is built from
             records and cannot say anything the desk does not hold. Mistral is
             an optional second pass over the same facts, kept for this session
             only — nothing generated is written to D1. */
          const written = S.aiDrafts[c.id];
          const busy = S.aiBusy === c.id;

          const body = written
            ? esc(written.draft)
            : `Dear ${esc(c.name.split(" ")[0])},

${c.brief ? esc(c.brief.split(".")[0]) + "." : "A short note on the market you collect."}

${matched.length
  ? "Recent results in the names you already hold:\n" + matched.map(m =>
      `\u00b7 ${esc(m.artist)} \u2014 ${esc(m.title || "Untitled")}, ${esc(m.price)}${m.above ? " (above high estimate)" : ""}`).join("\n")
  : "I will send comparables as soon as the next relevant lots are catalogued."}
${wants ? "\nStill looking for: " + esc(wants) + "." : ""}`;

          const drafter = !CRM.ai ? "" : `
            <div class="ai-bar">
              <button class="btn btn-primary" data-act="ai-pitch" data-client="${esc(c.id)}"
                      ${busy ? "disabled" : ""}>
                ${busy ? "Drafting\u2026" : written ? "Draft again" : "Write it out"}</button>
              ${written ? `<button class="btn" data-act="ai-clear" data-client="${esc(c.id)}">Back to the template</button>` : ""}
            </div>
            ${S.aiError && S.aiBusy !== c.id ? `<div class="ai-note ai-bad">${esc(S.aiError)}</div>` : ""}`;

          return `
            <div class="chiprow">${CRM.clients.map(x =>
              `<button class="chip" data-pitch="${esc(x.id)}" aria-pressed="${c.id === x.id}">${esc(x.name)}</button>`).join("")}</div>
            ${drafter}
            <div class="pitch">
              <span class="kicker">${written ? `Written for ${esc(c.name)}` : `Drafted for ${esc(c.name)}`}</span>
              <h3>${esc(c.focus ? `Where the ${c.focus.split(",")[0].trim()} market has moved` : "What has moved since we last spoke")}</h3>
              <div class="bd">${body}</div>
              <div class="foot-note">${written
                ? `Written by ${esc(written.model)} from the record, and every figure in it checked back against the record \u2014 read it before you send it.`
                : "Drafted from the live record \u2014 read it before you send it."}</div>
            </div>`;
        })();

  const head = `<div class="view-head"><h1>Knowledge</h1>
    <p>Scripts, and a pitch drafted per collector</p></div>`;

  if (isSplit) {
    return head + `<div class="view-body"><div class="cols two">
      <div class="col sec">${sectionHead("Objection handling", OBJECTIONS.length + " scripts")}${scripts}</div>
      <div class="col sec">${sectionHead("Pitch generator")}${pitch}</div>
    </div></div>`;
  }

  return head + `<div class="view-body">
    <div class="seg">
      <button data-know="scripts" aria-pressed="${S.knowTab === "scripts"}">Objection scripts</button>
      <button data-know="pitch" aria-pressed="${S.knowTab === "pitch"}">Pitch generator</button>
    </div>
    <div class="sec" style="margin-top:22px">
      ${S.knowTab === "scripts"
        ? sectionHead("Objection handling", OBJECTIONS.length + " scripts") + scripts
        : sectionHead("Pitch generator") + pitch}
    </div>
  </div>`;
}

/* ============================================================
   SCREEN: CALENDAR
   ============================================================ */
function viewCalendar() {
  const all = (REAL.events || []).slice();
  // The filter chips used to sit over an authored "fairs and previews" list.
  // The houses are read from the sales themselves, so the chips can never
  // offer a house that has nothing in the diary.
  const houses = [...new Set(all.map(e => e.house).filter(Boolean))].sort();
  const active = houses.includes(S.calFilter) ? S.calFilter : "All";
  const evs = active === "All" ? all : all.filter(e => e.house === active);

  const filterChips = houses.length > 1 ? `
    <div class="chiprow" style="padding-top:0">
      ${["All", ...houses].map(h =>
        `<button class="chip" data-cal="${esc(h)}" aria-pressed="${active === h}">${esc(h)}</button>`).join("")}
    </div>` : "";

  /* ---- the month grid ------------------------------------------------------
     Sales are not all one-day: her own September dates run two days each, so a
     sale is painted on every day it covers, not just the day it opens. */
  const houseClass = h => {
    const k = String(h || "").toLowerCase().replace(/[^a-z]/g, "");
    return ["astaguru", "saffronart", "pundoles", "giftex"].includes(k) ? "h-" + k : "h-other";
  };
  const iso = (y, m, d) =>
    `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  const byDate = {};
  evs.forEach(e => {
    if (!e.starts) return;
    const start = new Date(e.starts + "T00:00:00");
    if (isNaN(start)) return;
    let end = new Date((e.ends || e.starts) + "T00:00:00");
    // data/manual_events.json is hand-edited, and no sale runs for a month. An
    // end date typed as 2036 instead of 2026 would otherwise spin this loop
    // three thousand times; 9999 would hang the tab outright. Bound it.
    if (isNaN(end) || end < start) end = start;
    const cap = new Date(start); cap.setDate(cap.getDate() + 30);
    if (end > cap) end = cap;
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const k = iso(d.getFullYear(), d.getMonth(), d.getDate());
      (byDate[k] = byDate[k] || []).push(e);
    }
  });

  const todayKey = todayIso();
  const anchor = new Date(todayKey + "T00:00:00");
  const base = new Date(anchor.getFullYear(), anchor.getMonth() + (S.calMonth || 0), 1);
  const yr = base.getFullYear(), mo = base.getMonth();
  const monthLabel = base.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const daysInMonth = new Date(yr, mo + 1, 0).getDate();
  const startPad = (new Date(yr, mo, 1).getDay() + 6) % 7;   // weeks start Monday

  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const k = iso(yr, mo, d);
    cells.push({ d, key: k, list: byDate[k] || [] });
  }
  while (cells.length % 7) cells.push(null);

  const cellHtml = c => {
    if (!c) return `<div class="cal-cell pad"></div>`;
    const shown = c.list.slice(0, 3);
    const extra = c.list.length - shown.length;
    const cls = ["cal-cell", c.list.length ? "has" : "",
                 S.calDay === c.key ? "sel" : "", c.key === todayKey ? "today" : ""]
      .filter(Boolean).join(" ");
    const inner = `
      <div class="hd">
        <span class="dn">${c.d}</span>
        ${c.key === todayKey ? `<span class="cal-now">Today</span>` : ""}
      </div>
      ${shown.map(e => `
        <div class="cal-ev">
          <span class="cal-dot ${houseClass(e.house)}"></span>
          <span class="t">${esc(e.title || "Sale")}</span>
        </div>`).join("")}
      ${extra > 0 ? `<div class="cal-more">+${extra} more</div>` : ""}`;
    return c.list.length
      ? `<button class="${cls}" data-cal-day="${c.key}" aria-pressed="${S.calDay === c.key}">${inner}</button>`
      : `<div class="${cls}">${inner}</div>`;
  };

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

  const grid = `
    <div class="cal-head">
      <h3 class="cal-title">${esc(monthLabel)}</h3>
      <div class="cal-nav">
        <button class="chip" data-cal-nav="prev" aria-label="Previous month">\u2039</button>
        <button class="chip" data-cal-nav="today">Today</button>
        <button class="chip" data-cal-nav="next" aria-label="Next month">\u203a</button>
      </div>
    </div>
    ${filterChips}
    <div class="cal-dows">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
      .map(d => `<div class="cal-dow">${d}</div>`).join("")}</div>
    ${weeks.map(w => `<div class="cal-week">${w.map(cellHtml).join("")}</div>`).join("")}
    <div class="cal-legend">
      ${(houses.length ? houses : ["\u2014"]).map(h =>
        `<span class="k"><span class="cal-dot ${houseClass(h)}"></span>${esc(h)}</span>`).join("")}
      <span style="margin-left:auto">${evs.length} forthcoming \u00b7 tap a day for the detail</span>
    </div>`;

  /* ---- the selected day ---------------------------------------------------- */
  const selList = S.calDay ? (byDate[S.calDay] || []) : [];
  const dayDetail = !selList.length ? "" : `
    <div class="cal-day-detail">
      <div class="label">${esc(new Date(S.calDay + "T00:00:00")
        .toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</div>
      <div class="rows">${selList.map(e => {
        const multi = e.ends && e.ends !== e.starts;
        return `<div class="ev">
          <div>
            ${houseTag(e.house)}
            <div class="ti">${esc(e.title || "Sale")}</div>
            <div class="ci">${[e.city, e.kind,
              multi ? `${fmtDate(e.starts)}\u2013${fmtDate(e.ends)}` : ""]
              .filter(Boolean).map(esc).join(" \u00b7 ")}</div>
            ${e.lot_count ? `<div class="nt tnum">${e.lot_count} lots</div>` : ""}
          </div>
          <div class="rs">${safeUrl(e.url)
            ? `<a class="chip" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">Catalogue</a>`
            : ""}</div>
        </div>`;
      }).join("")}</div>
    </div>`;

  const byMonth = {};
  evs.forEach(e => {
    const d = new Date(e.starts + "T00:00:00");
    const k = d.toLocaleString("en-GB", { month: "long", year: "numeric" });
    (byMonth[k] = byMonth[k] || []).push(e);
  });

  const real = Object.keys(byMonth).length ? Object.entries(byMonth).map(([m, list]) => `
    <div class="month">${esc(m)}</div>
    <div class="rows">${list.map(e => {
      const d = new Date(e.starts + "T00:00:00");
      const day = `${String(d.getDate()).padStart(2, "0")} ${MON3[d.getMonth()]}`;
      return `<div class="ev">
        <div>
          <div class="day tnum">${esc(day)}</div>
          ${houseTag(e.house)}
          <div class="ti">${esc(e.title || "Sale")}</div>
          <div class="ci">${[e.city, e.kind].filter(Boolean).map(esc).join(" \u00b7 ")}</div>
          ${e.lot_count ? `<div class="nt tnum">${e.lot_count} lots</div>` : ""}
        </div>
        <div class="rs">${safeUrl(e.url) ? `<a class="chip" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">Catalogue</a>` : ""}</div>
      </div>`;
    }).join("")}</div>`).join("")
    : (active === "All"
        ? '<div class="empty">No sale is currently scheduled at the houses we track. New dates appear here as the houses publish them.</div>'
        : `<div class="empty">Nothing scheduled at ${esc(active)}.</div>`);

  return `<div class="view-head"><h1>Calendar</h1>
      <p>${evs.length} forthcoming ${evs.length === 1 ? "sale" : "sales"} \u00b7 ${esc(listOf(REAL.coverage.houses))}</p></div>
    <div class="view-body">
      <div class="sec" style="margin-top:8px">${grid}${dayDetail}</div>

      <div class="sec">${sectionHead("All forthcoming", evs.length === all.length ? "" : `${evs.length} of ${all.length}`)}${real}</div>

      <div class="sec">${sectionHead("Add to her calendar")}
        <div class="btnrow" style="margin-top:16px">
          <a class="btn btn-primary" href="calendar.ics">Download .ics</a>
          <a class="btn" href="${esc(location.href.replace(/[^/]*$/, ""))}calendar.ics">Feed URL</a>
        </div>
        <div class="foot-note">Subscribe rather than download and the sales keep arriving on their own: Settings \u2192 Calendar \u2192 Accounts \u2192 Add Account \u2192 Other \u2192 Add Subscribed Calendar, and paste the feed URL. Apple re-checks it for you.</div>
      </div>

    </div>`;
}

/* The search sheet is built ONCE per opening. It used to re-render itself on
   every keystroke, which replaced the <input> the caret was sitting in — so on
   an iPad each letter tore down the field, dropped focus and dismissed the
   keyboard, and typing "Gaitonde" meant nine separate taps on the search icon.
   Only the results list is allowed to redraw while she types. */
function renderSheetResults() {
  const el = document.getElementById("sheet-body");
  if (!el) return;
  const q = S.query.trim().toLowerCase();
  const matches = artistKeys.filter(k =>
    A(k).name.toLowerCase().includes(q) || A(k).movement.toLowerCase().includes(q)).slice(0, 8);

  const body = q === ""
    ? `<div class="sheet-hint"><div class="label">Quick picks</div>
        <div class="chiprow" style="padding-left:0;padding-right:0;margin:0;flex-wrap:wrap;overflow:visible">
          ${artistKeys.map(k => `<button class="chip" data-open-artist="${k}">${esc(A(k).name)}</button>`).join("")}
        </div></div>`
    : matches.length
      ? matches.map(k => `<button class="sug" data-open-artist="${k}">
          <span class="n">${esc(A(k).name)}</span>
          <span class="m tnum">${[A(k).years, `${A(k).stats.lots12} lots / 12 mo`].filter(Boolean).map(esc).join(" · ")}</span></button>`).join("")
      : `<div class="empty">No artist matches “${esc(S.query)}”. Try Gaitonde, Raza or Baroda.</div>`;

  el.innerHTML = `<div class="label" style="padding:18px 0 4px">${q === "" ? artistKeys.length + " artists \u00b7 " + REAL.coverage.lots.toLocaleString() + " lots" : matches.length + " match" + (matches.length === 1 ? "" : "es")}</div>${body}`;
}

function renderSheet() {
  const el = document.getElementById("sheet");
  if (!S.searchOpen) { el.innerHTML = ""; return; }

  el.innerHTML = `<div class="sheet-bg" data-act="close-search-bg">
    <div class="sheet" role="dialog" aria-label="Search artists">
      <div class="sheet-top">
        <span class="g">${I(ICON.search, 21)}</span>
        <input id="q" data-q="1" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
          placeholder="Gaitonde, Raza, Sher-Gil, Khakhar…" value="${esc(S.query)}">
        <button class="cancel" data-act="close-search">Cancel</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div></div>`;
  renderSheetResults();

  // Typing is handled by the delegated input listener, so no per-render
  // addEventListener here — that used to stack a fresh one on every keystroke.
  const inp = document.getElementById("q");
  if (inp) {
    inp.focus();
    try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function view() {
  switch (S.screen) {
    case "today": return viewToday();
    case "artists": return viewArtists();
    case "dossier": return isSplit ? viewArtists() : viewDossier(false);
    case "market": return viewMarket();
    case "clients": return viewClients();
    case "newclient": return viewNewClient();
    case "unlock": return viewUnlock();
    case "client": return isSplit ? viewClients() : viewClient(false);
    case "calendar": return viewCalendar();
    case "knowledge": return viewKnowledge();
    default: return viewMore();
  }
}

// A throw inside any one of these used to take the whole desk down with it:
// renderRail() ran first, so one stale reference in a nav badge left `main`
// untouched and the site opened blank. Paint the content first, then the
// chrome, and let each piece fail alone and loudly.
function guard(label, fn) {
  try { fn(); } catch (e) { console.error("render: " + label + " failed", e); }
}

function render(keepScroll) {
  const main = document.getElementById("main");
  const y = keepScroll ? main.scrollTop : 0;
  const split = (S.screen === "artists" || S.screen === "dossier" || S.screen === "clients" || S.screen === "client") && isSplit;
  guard("main", () => {
    main.innerHTML = `<div class="wrap ${split ? "wide" : ""}">${view()}</div>`;
    main.scrollTop = y;
  });
  guard("rail", renderRail);
  guard("topbar", renderTopbar);
  guard("tabbar", renderTabbar);
  guard("sparks", drawSparks);
  document.title = "The Gallery";
}

function drawSparks() {
  document.querySelectorAll("[data-spark]").forEach(el => {
    const a = A(el.getAttribute("data-spark"));
    if (a) el.innerHTML = sparkline(a.index, el.clientWidth || 320);
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
function go(screen, opts) {
  Object.assign(S, opts || {});
  S.screen = screen;
  render(false);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-nav],[data-act],[data-open-artist],[data-open-client],[data-house],[data-market],[data-know],[data-cal],[data-toggle-done],[data-tpl],[data-obj],[data-pitch],[data-nc-tier],[data-clear-followup],[data-panel],[data-ed-tier],[data-ed-channel],[data-card-followup],[data-edit-row],[data-del-row],[data-cal-nav],[data-cal-day],[data-mark],[data-res],[data-feed]");
  if (!t) return;

  const attr = n => t.getAttribute(n);

  if (attr("data-open-artist")) {
    S.searchOpen = false; S.query = "";
    return go(isSplit ? "artists" : "dossier", { artist: attr("data-open-artist"), houseFilter: "All", bioOpen: false });
  }
  if (attr("data-open-client")) {
    const ck = attr("data-open-client");
    S.searchOpen = false;
    go(isSplit ? "clients" : "client", { client: ck, openTemplate: null });
    if (CRM.live && !CRM.detail[ck]) {
      api(`/clients/${encodeURIComponent(ck)}`)
        .then(d => { if (d) { CRM.detail[ck] = d; render(true); } })
        .catch(() => {});
    }
    return;
  }
  if (attr("data-house")) { S.houseFilter = attr("data-house"); return render(true); }
  if (attr("data-market")) { S.marketTab = attr("data-market"); return render(true); }
  if (attr("data-cal")) { S.calFilter = attr("data-cal"); S.calDay = null; return render(true); }
  if (attr("data-res")) {
    const [k, v] = attr("data-res").split(":");
    S[k === "house" ? "resHouse" : "resPerf"] = v;
    return render(true);
  }
  if (attr("data-feed")) {
    const [k, v] = attr("data-feed").split(":");
    S[k === "cat" ? "feedCat" : "feedScope"] = v;
    return render(true);
  }
  if (attr("data-mark")) {
    const url = attr("data-mark");
    const all = [...(((REAL.news || {}).on_market) || []), ...(((REAL.news || {}).wider) || [])];
    const n = all.find(x => markKey(x) === url) || { url };
    toggleMark(n);
    return render(true);
  }
  if (attr("data-cal-nav")) {
    const dir = attr("data-cal-nav");
    S.calMonth = dir === "today" ? 0 : (S.calMonth || 0) + (dir === "next" ? 1 : -1);
    S.calDay = null;                       // a day from another month must not stay open
    return render(true);
  }
  if (attr("data-cal-day")) {
    const k = attr("data-cal-day");
    S.calDay = S.calDay === k ? null : k;  // tapping the open day closes it
    return render(true);
  }
  if (attr("data-clear-followup")) {
    const fid = attr("data-clear-followup");
    CRM.followups = CRM.followups.filter(f => f.id !== fid);
    render(true);
    api(`/followups/${encodeURIComponent(fid)}/done`, { method: "POST", body: "{}" })
      .catch(() => { loadCRM().then(() => render(true)); });   // put it back if the write failed
    return;
  }
  if (attr("data-toggle-done")) { const k = attr("data-toggle-done"); S.done[k] = !S.done[k]; persist(); return render(true); }
  if (attr("data-tpl")) { const i = +attr("data-tpl"); S.openTemplate = S.openTemplate === i ? null : i; return render(true); }
  if (attr("data-obj")) { const i = +attr("data-obj"); S.openObjection = S.openObjection === i ? null : i; return render(true); }
  if (attr("data-pitch")) {
    S.pitchClient = attr("data-pitch");
    S.aiError = null;
    ensureDetail(S.pitchClient);
    return render(true);
  }

  if (attr("data-nc-tier")) {
    S.newClient = { ...S.newClient, tier: attr("data-nc-tier") };
    return render(true);
  }

  if (attr("data-panel")) {
    const which = attr("data-panel");
    if (which === "close" || S.panel === which) {
      S.panel = null; S.draft = {}; S.draftError = null; S.confirmDelete = null;
      return render(true);
    }
    const d = CRM.detail[S.client] || {};
    S.panel = which;
    S.draftError = null;
    S.confirmDelete = null;
    S.draft =
      which === "client" ? {
        name: d.name || "", title: d.title || "", city: d.city || "",
        tier: d.tier || "Growth", since: d.since || "",
        lifetime_inr: d.lifetime_inr == null ? "" : String(d.lifetime_inr),
        focus: d.focus || "", wants: (d.wants || []).join(", "),
        brief: d.brief || "", next_when: d.next_when || "", next_what: d.next_what || "",
      }
      : which === "log"      ? { happened: todayIso(), channel: "Call", note: "" }
      : which === "followup" ? { due: todayIso(), reason: "" }
      : { artist_name: "", work: "", acquired: "", paid_inr: "" };
    return render(true);
  }
  if (attr("data-ed-tier"))    { S.draft = { ...S.draft, tier: attr("data-ed-tier") }; return render(true); }
  if (attr("data-ed-channel")) { S.draft = { ...S.draft, channel: attr("data-ed-channel") }; return render(true); }

  if (attr("data-edit-row")) {
    const token = attr("data-edit-row");
    const kind = token.slice(0, token.indexOf(":"));
    const rid = token.slice(token.indexOf(":") + 1);
    const d = CRM.detail[S.client] || {};
    const row = (kind === "holding" ? (d.holdings || [])
               : kind === "log"     ? (d.log || [])
               :                      (d.followups || [])).find(x => x.id === rid);
    if (!row) return;
    S.panel = `${kind}:${rid}`;
    S.confirmDelete = null;
    S.draftError = null;
    S.draft = kind === "holding"
      ? { artist_name: row.artist_name || "", work: row.work || "",
          acquired: row.acquired || "", paid_inr: row.paid_inr == null ? "" : String(row.paid_inr) }
      : kind === "log"
      ? { happened: row.happened || "", channel: row.channel || "", note: row.note || "" }
      : { due: row.due || "", reason: row.reason || "" };
    return render(true);
  }

  if (attr("data-del-row")) {
    const token = attr("data-del-row");
    // First tap arms it, second does it. Nothing is deleted on one tap.
    if (S.confirmDelete !== token) {
      S.confirmDelete = token; S.panel = null; S.draft = {}; S.draftError = null;
      return render(true);
    }
    const kind = token.slice(0, token.indexOf(":"));
    const rid = token.slice(token.indexOf(":") + 1);
    const route = kind === "holding" ? "/holdings/" : kind === "log" ? "/log/" : "/followups/";
    const cid = S.client;
    S.confirmDelete = null;
    render(true);
    api(route + encodeURIComponent(rid), { method: "DELETE" })
      .then(res => { if (!res) throw new Error("not signed in"); return refreshClient(cid); })
      .then(() => { if (S.client === cid) render(true); })
      .catch(() => { S.draftError = "Could not delete. Check you are still signed in."; render(true); });
    return;
  }

  if (attr("data-card-followup")) {
    const fid = attr("data-card-followup");
    const d = CRM.detail[S.client];
    const f = ((d && d.followups) || []).find(x => x.id === fid);
    if (!f) return;
    const was = f.done;
    f.done = was ? 0 : 1;                       // optimistic, so the tap feels instant
    render(true);
    api(`/followups/${encodeURIComponent(fid)}/done`, {
      method: "POST", body: JSON.stringify({ done: !was }),
    })
      .then(res => { if (!res) throw new Error("not signed in"); return refreshClient(S.client); })
      .then(() => render(true))
      .catch(() => { f.done = was; render(true); });   // put it back if the write failed
    return;
  }

  const act = attr("data-act");
  if (act === "new-client") {
    return go("newclient", { newClient: {}, newClientError: null });
  }
  if (act === "save-client") {
    const f = S.newClient || {};
    if (!f.name || !f.name.trim()) {
      S.newClientError = "A client needs a name.";
      return render(true);
    }
    const btn = t;
    btn.textContent = "Saving\u2026";
    api("/clients", { method: "POST", body: JSON.stringify({ ...f, name: f.name.trim() }) })
      .then(res => {
        if (!res) throw new Error("not signed in");
        return loadCRM();
      })
      .then(() => go("clients", { newClient: {}, newClientError: null }))
      .catch(() => {
        S.newClientError = "Could not save. Check you are still signed in.";
        render(true);
      });
    return;
  }
  /* One shape for all four writes: disable the button, post, re-read the record,
     close the panel. On failure the panel stays open with the draft intact, so
     nothing she typed is lost. */
  const saveDraft = (btn, run) => {
    // Disabling the button is the whole double-submit guard. A flag on S would
    // outlive the panel it belongs to and silently swallow the next save.
    const cid = S.client, label = btn.textContent;
    btn.textContent = "Saving\u2026";
    btn.disabled = true;
    Promise.resolve(run(cid))
      .then(res => { if (!res) throw new Error("not signed in"); return refreshClient(cid); })
      .then(() => {
        if (S.client !== cid) return;      // she moved on; do not yank the card back
        S.panel = null; S.draft = {}; S.draftError = null; S.confirmDelete = null;
        render(true);
      })
      .catch(() => {
        S.draftError = "Could not save. Check you are still signed in.";
        btn.textContent = label; btn.disabled = false;
        render(true);
      });
  };

  if (act === "save-edit") {
    const f = S.draft || {};
    if (!f.name || !f.name.trim()) { S.draftError = "A client needs a name."; return render(true); }
    const body = {
      name: f.name.trim(),
      title: blankToNull(f.title), city: blankToNull(f.city),
      tier: f.tier || "Growth", since: blankToNull(f.since),
      lifetime_inr: intOrNull(f.lifetime_inr),
      focus: blankToNull(f.focus), brief: blankToNull(f.brief),
      next_when: blankToNull(f.next_when), next_what: blankToNull(f.next_what),
      wants: String(f.wants || "").split(",").map(x => x.trim()).filter(Boolean),
    };
    return saveDraft(t, cid => api(`/clients/${encodeURIComponent(cid)}`,
      { method: "PATCH", body: JSON.stringify(body) }));
  }

  if (act === "save-holding") {
    const f = S.draft || {};
    if (!f.artist_name || !f.artist_name.trim()) {
      S.draftError = "A holding needs an artist."; return render(true);
    }
    const name = f.artist_name.trim();
    return saveDraft(t, cid => api("/holdings", { method: "POST", body: JSON.stringify({
      client_id: cid,
      artist_name: name,
      artist_key: artistKeyByName(name),   // links the holding to the public dossier
      work: blankToNull(f.work),
      acquired: blankToNull(f.acquired),
      paid_inr: intOrNull(f.paid_inr),
    }) }));
  }

  if (act === "save-log") {
    const f = S.draft || {};
    if (!f.note || !f.note.trim()) { S.draftError = "A note needs something in it."; return render(true); }
    return saveDraft(t, cid => api("/log", { method: "POST", body: JSON.stringify({
      client_id: cid,
      happened: f.happened || todayIso(),
      channel: blankToNull(f.channel),
      note: f.note.trim(),
    }) }));
  }

  if (act === "save-followup") {
    const f = S.draft || {};
    if (!f.due) { S.draftError = "A follow-up needs a date."; return render(true); }
    return saveDraft(t, cid => api("/followups", { method: "POST", body: JSON.stringify({
      client_id: cid,
      due: f.due,
      reason: blankToNull(f.reason),
    }) }));
  }

  if (act === "save-row") {
    const which = S.panel || "";
    const i = which.indexOf(":");
    if (i < 0) return;
    const kind = which.slice(0, i), rid = which.slice(i + 1);
    const f = S.draft || {};
    let route, body;
    if (kind === "holding") {
      if (!f.artist_name || !f.artist_name.trim()) {
        S.draftError = "A holding needs an artist."; return render(true);
      }
      const name = f.artist_name.trim();
      route = "/holdings/";
      body = { artist_name: name, artist_key: artistKeyByName(name),
               work: blankToNull(f.work), acquired: blankToNull(f.acquired),
               paid_inr: intOrNull(f.paid_inr) };
    } else if (kind === "log") {
      if (!f.happened) { S.draftError = "A note needs a date."; return render(true); }
      if (!f.note || !f.note.trim()) { S.draftError = "A note needs something in it."; return render(true); }
      route = "/log/";
      body = { happened: f.happened, channel: blankToNull(f.channel), note: f.note.trim() };
    } else {
      if (!f.due) { S.draftError = "A follow-up needs a date."; return render(true); }
      route = "/followups/";
      body = { due: f.due, reason: blankToNull(f.reason) };
    }
    return saveDraft(t, () => api(route + encodeURIComponent(rid),
      { method: "PATCH", body: JSON.stringify(body) }));
  }

  if (act === "toggle-theme") { toggleTheme(); return; }
  if (act === "save-key") {
    const el = document.querySelector("[data-key]");
    const k = (el && el.value || "").trim();
    if (!k) { CRM.keyError = "Paste the key first."; return render(true); }
    setDeskKey(k);
    CRM.keyError = null;
    loadCRM().then(ok => {
      if (ok) { go("clients"); }
      else { setDeskKey(""); CRM.keyError = "That key was not accepted."; render(true); }
    });
    return;
  }
  if (act === "open-search") { S.searchOpen = true; S.query = ""; return renderSheet(); }
  if (act === "close-search") { S.searchOpen = false; S.query = ""; return renderSheet(); }
  if (act === "close-search-bg" && e.target.classList.contains("sheet-bg")) { S.searchOpen = false; S.query = ""; return renderSheet(); }
  if (act === "toggle-bio") { S.bioOpen = !S.bioOpen; return render(true); }
  if (act === "pitch-for") {
    const cid = attr("data-client");
    ensureDetail(cid).then(d => { if (d) render(true); });
    return go("knowledge", { pitchClient: cid, knowTab: "pitch" });
  }

  if (act === "ai-clear") {
    delete S.aiDrafts[attr("data-client")];
    S.aiError = null;
    return render(true);
  }
  if (act === "ai-pitch") {
    const cid = attr("data-client");
    if (S.aiBusy) return;                      // the free tier is one call at a time
    S.aiBusy = cid; S.aiError = null;
    render(true);

    // The comparables come from here rather than being re-derived in the Worker:
    // the artist matching lives in this file, and duplicating it server-side is
    // exactly how the news constants drifted apart. The holdings have to be on
    // hand before that match can mean anything, so wait for them.
    ensureDetail(cid)
      .then(() => {
        const held = (CRM.detail[cid] || {}).holdings || [];
        const comparables = REAL.feed
          .filter(f => held.some(h => h.artist_key && h.artist_key === f.artist_key))
          .slice(0, 4)
          .map(m => ({ artist: m.artist, title: m.title, price: m.price,
                       house: m.house, above: !!m.above }));
        return aiPitch(cid, comparables);
      })
      .then(d => { S.aiDrafts[cid] = d; })
      .catch(err => { S.aiError = err.message || "The drafter could not be reached."; })
      .then(() => { S.aiBusy = null; render(true); });
    return;
  }

  const nav = attr("data-nav");
  if (nav) {
    const know = attr("data-know");
    return go(nav, know ? { knowTab: know } : {});
  }
});

document.addEventListener("input", e => {
  const q = e.target.closest("[data-q]");
  if (q) { S.query = q.value; renderSheetResults(); return; }   // never redraws the field
  const nc = e.target.closest("[data-nc]");
  if (nc) { S.newClient = { ...S.newClient, [nc.getAttribute("data-nc")]: nc.value }; return; }
  const ed = e.target.closest("[data-ed]");
  if (ed) { S.draft = { ...S.draft, [ed.getAttribute("data-ed")]: ed.value }; }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.searchOpen) { S.searchOpen = false; S.query = ""; renderSheet(); }
});

padQ.addEventListener("change", ev => { isPad = ev.matches; render(false); });
splitQ.addEventListener("change", ev => { isSplit = ev.matches; render(false); });

let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawSparks, 140); });

rebuildFromReal();
render(false);

// paint from the embedded copy first so the desk is never blank, then upgrade
Promise.allSettled([loadLiveData(), loadCRM()]).then(([data]) => {
  if (data.status === "fulfilled" && data.value) rebuildFromReal();
  render(true);

  // Order matters: loadLiveData() REPLACES REAL, so asking for news first would
  // have the fetched headlines overwritten by the baked ones a moment later.
  loadNews().then(ok => { if (ok) render(true); });
});

/* Keep it current while she has the desk open — an auction morning is exactly
   when a stale headline is worst. Only while the tab is actually visible, so a
   forgotten background tab is not re-fetching all day. */
const NEWS_REFRESH_MS = 10 * 60 * 1000;
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  loadNews().then(ok => { if (ok) render(true); });
}, NEWS_REFRESH_MS);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const stamp = (REAL.news || {}).generated_at;
  const age = stamp ? Date.now() - Date.parse(stamp) : Infinity;
  if (!(age < NEWS_REFRESH_MS)) loadNews().then(ok => { if (ok) render(true); });
});
</script>
